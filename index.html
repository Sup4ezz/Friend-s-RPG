    <script>

    <script>
        // Independent mobile route recovery. This watchdog deliberately lives in index.html
        // so it still runs when the SPA router or a page adapter fails.
        (() => {
            const path = (location.pathname.replace(/\/+$/, "") || "/");
            const targets = {
                "/character": { selector: ".lorgus-character-page", render: "renderLorgusCharacterHub" },
                "/mail": { selector: ".lorgus-mail-page", render: "renderMail" },
                "/rp": { selector: ".lorgus-rp-page-container, .lorgus-rp-page, .lorgus-rp-hub", render: "renderLorgusRpHub" },
                "/lorblook": { selector: ".lorgus-codex-page", render: "renderLorgusCodex" }
            };
            const target = targets[path];
            if (!target || !matchMedia("(max-width: 720px)").matches) return;

            // Keep the original browser exception so the player can send it to the admin.
            window.addEventListener("error", event => {
                window.__lorgusEmergencyError = String(event.error?.stack || event.message || "Неизвестная ошибка JavaScript");
            });
            window.addEventListener("unhandledrejection", event => {
                const reason = event.reason;
                window.__lorgusEmergencyError = String(reason?.stack || reason?.message || reason || "Необработанная ошибка Promise");
            });

            // Некоторые рендереры назначают класс страницы самому #cabinet-content,
            // а не его дочернему элементу. Учитываем оба варианта, иначе watchdog
            // ошибочно показывает аварию даже после успешной отрисовки.
            const getPageElement = () => {
                const host = document.getElementById("cabinet-content");
                if (!host) return null;
                return host.matches(target.selector) ? host : host.querySelector(target.selector);
            };
            const visiblePageExists = () => !!getPageElement();
            const reveal = () => {
                document.documentElement.classList.remove("lorgus-transition-active", "lorgus-scene-transitioning");
                document.body.classList.remove("lorgus-transition-active", "lorgus-scene-transitioning");
                delete document.documentElement.dataset.lorgusTransition;

                // Stop container pseudo-elements from recreating a full-screen veil on mobile.
                if (!document.getElementById("lorgus-character-mobile-reveal-style")) {
                    const style = document.createElement("style");
                    style.id = "lorgus-character-mobile-reveal-style";
                    style.textContent = "html::before,html::after,body::before,body::after,#root::before,#root::after,.game-page::before,.game-page::after,#cabinet-content::before,#cabinet-content::after,.lorgus-region-arrival::before,.lorgus-region-arrival::after{content:none!important;display:none!important;animation:none!important;transition:none!important}";
                    document.head.appendChild(style);
                }

                // Remove named transition layers plus any unknown fixed full-screen overlay
                // that sits above the actual character page.
                document.querySelectorAll(".lorgus-portal-transition, .lorgus-eye-transition, .lorgus-cinematic-auth, .lorgus-region-transition-veil, .lorgus-transition-screen, .lorgus-scene-transition-overlay, .lorgus-transition-overlay, .lorgus-portal-transition-veil, .lorgus-portal-transition-core, .lorgus-portal-transition-ring, .lorgus-veil, .lorgus-transition-veil, .lorgus-scene-veil, .lorgus-loading-veil, .lorgus-mobile-veil, [class*='blackout'], [id*='blackout'], [class*='curtain'], [id*='curtain']").forEach(el => el.remove());
                const page = getPageElement();
                document.querySelectorAll("body *").forEach(el => {
                    // Do not skip page descendants wholesale: on this route the page can
                    // itself be #cabinet-content, which would otherwise exempt every veil
                    // nested inside it from detection. Full-screen positioned descendants
                    // are checked below and removed if they cover the page.
                    if (el === page || el.contains(page) ||
                        el.id === "root" || el.id === "cabinet-content" ||
                        el.id === "lorgus-global-utility" || el.id === "lorgus-mobile-emergency" ||
                        el.matches(".lorgus-global-utility,.lorgus-mainmenu-nav,.lorgus-subpage-nav")) return;
                    const style = getComputedStyle(el);
                    const rect = el.getBoundingClientRect();
                    const coversScreen = rect.width >= innerWidth * 0.8 && rect.height >= innerHeight * 0.8;
                    const elevated = style.position === "fixed" || style.position === "absolute";
                    // On the direct character route, even low-z fullscreen layers can
                    // dim the whole page. The page and its ancestors were excluded above,
                    // so remove any remaining fullscreen fixed/absolute sibling layer.
                    if (coversScreen && elevated) el.remove();
                });
                const root = document.getElementById("root");
                const cabinet = root && root.querySelector(".game-page");
                const host = document.getElementById("cabinet-content");
                [document.documentElement, document.body, root, cabinet, host].filter(Boolean).forEach(el => {
                    el.style.setProperty("visibility", "visible", "important");
                    el.style.setProperty("opacity", "1", "important");
                    el.style.setProperty("display", "block", "important");
                    el.style.setProperty("filter", "none", "important");
                    el.style.setProperty("transform", "none", "important");
                    el.style.setProperty("pointer-events", "auto", "important");
                    el.style.setProperty("mix-blend-mode", "normal", "important");
                });
                if (cabinet) {
                    cabinet.classList.remove("preparing");
                    cabinet.style.position = "relative";
                    cabinet.style.inset = "auto";
                    cabinet.style.zIndex = "1";
                }
            };

            // Recover after late transitions, and also catch a veil recreated after startup.
            [700, 1400, 2400, 4000, 6500, 9000, 14000, 22000, 30000].forEach(delay => {
                window.setTimeout(() => {
                    if (location.pathname.replace(/\/+$/, "") === "/character") reveal();
                }, delay);
            });

            // Some transition code inserts its overlay after the first cleanup. Watch only
            // newly inserted nodes; ordinary page updates must not repeatedly rewrite the UI.
            const veilSelector = ".lorgus-portal-transition,.lorgus-eye-transition,.lorgus-cinematic-auth," +
                ".lorgus-region-transition-veil,.lorgus-transition-screen,.lorgus-scene-transition-overlay," +
                ".lorgus-transition-overlay,.lorgus-portal-transition-veil,.lorgus-portal-transition-core," +
                ".lorgus-portal-transition-ring,.lorgus-veil,.lorgus-transition-veil,.lorgus-scene-veil," +
                ".lorgus-loading-veil,.lorgus-mobile-veil,[class*='blackout'],[id*='blackout']," +
                "[class*='curtain'],[id*='curtain']";
            const isNewVeil = node => {
                if (!(node instanceof Element)) return false;
                if (node.matches(veilSelector) || node.querySelector(veilSelector)) return true;
                if (node.matches("#root,.game-page,#cabinet-content,#lorgus-global-utility,.lorgus-mainmenu-nav,.lorgus-subpage-nav")) return false;
                const css = getComputedStyle(node);
                const rect = node.getBoundingClientRect();
                return (css.position === "fixed" || css.position === "absolute") &&
                    rect.width >= innerWidth * 0.8 && rect.height >= innerHeight * 0.8 &&
                    !node.contains(getPageElement());
            };
            const veilObserver = new MutationObserver(records => {
                if (location.pathname.replace(/\/+$/, "") !== "/character") {
                    veilObserver.disconnect();
                    return;
                }
                if (records.some(record => Array.from(record.addedNodes).some(isNewVeil))) {
                    reveal();
                }
            });
            veilObserver.observe(document.body, { childList: true, subtree: true });

            window.setTimeout(async () => {
                // Always remove stale transition veils first, even when the page content
                // exists underneath them. Otherwise mobile can remain covered forever.
                reveal();
                if (visiblePageExists()) return;

                // First retry the registered renderer directly if player state is already available.
                try {
                    if (typeof window[target.render] === "function" && document.getElementById("cabinet-content")) {
                        await window[target.render]();
                    }
                } catch (error) {
                    window.__lorgusEmergencyError = "Повторный обработчик: " + String(error?.stack || error?.message || error);
                    console.error("LORGUS mobile emergency renderer:", error);
                }

                if (visiblePageExists()) { reveal(); return; }

                // If startup never restored the cabinet, request the auth session and restart
                // the normal render path once instead of leaving a black screen indefinitely.
                try {
                    if (window.supabaseClient?.auth && typeof window.render === "function") {
                        const result = await window.supabaseClient.auth.getSession();
                        await window.render(result?.data?.session || null);
                    }
                } catch (error) {
                    window.__lorgusEmergencyError = "Повторный запуск приложения: " + String(error?.stack || error?.message || error);
                    console.error("LORGUS mobile emergency startup retry:", error);
                }

                window.setTimeout(() => {
                    if (visiblePageExists()) { reveal(); return; }
                    reveal();
                    if (document.getElementById("lorgus-mobile-emergency")) return;
                    const panel = document.createElement("section");
                    panel.id = "lorgus-mobile-emergency";
                    panel.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:grid;align-content:center;justify-items:center;gap:14px;padding:24px;overflow:auto;background:#100e0b;color:#eee3ce;font:16px/1.55 Georgia,serif;text-align:center";
                    const host = document.getElementById("cabinet-content");
                    const details = [
                        "Раздел: " + path,
                        "Кабинет: " + (host ? "создан" : "не создан"),
                        "Персонаж: " + (window.activeCharacter ? "восстановлен" : "не восстановлен"),
                        "Supabase: " + (window.supabaseClient ? "подключён" : "не подключён"),
                        "Обработчик: " + (typeof window[target.render] === "function" ? "найден" : "не найден"),
                        "Элемент раздела: " + (visiblePageExists() ? "создан" : "не создан"),
                        "Последняя ошибка: " + (window.__lorgusEmergencyError || "ошибка не перехвачена; возможен сбой внутри обработчика")
                    ];
                    panel.innerHTML = '<div style="color:#d7b66d;letter-spacing:.14em;font-size:12px">ЛОРГУС · АВАРИЙНОЕ ВОССТАНОВЛЕНИЕ</div><h1 style="margin:0;color:#e0c47f;font-size:24px">Раздел не открылся</h1><p style="max-width:440px;margin:0">Приложение не смогло открыть раздел. Можно отправить отчёт администратору или попробовать ещё раз.</p><pre style="max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;font:12px/1.6 monospace;color:#c7b99f"></pre><p data-report-result role="status" style="max-width:440px;margin:0;color:#d7b66d"></p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" data-send-report style="min-height:48px;padding:12px 22px;background:#d7b66d;color:#17110a;border:0;font-weight:700">Отправить</button><button type="button" data-reload-page style="min-height:48px;padding:12px 22px;background:#211b12;color:#eee3ce;border:1px solid #66502c;font-weight:700">Перезагрузить</button></div>';
                    panel.querySelector("pre").textContent = details.join("\n");
                    panel.querySelector("[data-reload-page]").addEventListener("click", () => location.reload());
                    panel.querySelector("[data-send-report]").addEventListener("click", async event => {
                        const button = event.currentTarget;
                        const resultLine = panel.querySelector("[data-report-result]");
                        button.disabled = true;
                        button.textContent = "Отправляем…";
                        resultLine.textContent = "";
                        try {
                            const client = window.supabaseClient;
                            if (!client?.auth || !client?.from) throw new Error("Нет подключения к службе отправки отчётов. Перезагрузи страницу и попробуй снова.");
                            const auth = await client.auth.getSession();
                            if (auth.error) throw auth.error;
                            const user = auth.data?.session?.user;
                            if (!user?.id) throw new Error("Сессия игрока не найдена. Войди в аккаунт и повтори отправку.");
                            const character = window.activeCharacter || {};
                            const errorText = window.__lorgusEmergencyError || "Обработчик найден, но раздел не создался; ошибка не перехвачена.";
                            const report = {
                                user_id: user.id,
                                username: String(window.lorgusCurrentUsername || user.user_metadata?.username || user.email || "Игрок").slice(0, 160),
                                character_id: character.id || null,
                                character_name: String(character.name || "").slice(0, 160) || null,
                                route: path,
                                message: String(errorText).slice(0, 8000),
                                stack: String(window.__lorgusEmergencyError || "").slice(0, 16000),
                                diagnostics: {
                                    state: details,
                                    handler: target.render,
                                    pageElementExists: visiblePageExists(),
                                    cabinetExists: !!document.getElementById("cabinet-content"),
                                    characterRestored: !!window.activeCharacter,
                                    supabaseConnected: !!window.supabaseClient,
                                    timestamp: new Date().toISOString()
                                },
                                user_agent: String(navigator.userAgent || "").slice(0, 1000),
                                viewport: String(window.innerWidth + "x" + window.innerHeight + " / DPR " + (window.devicePixelRatio || 1)).slice(0, 100)
                            };
                            const { error } = await client.from("client_error_reports").insert(report);
                            if (error) throw error;
                            button.textContent = "Отправлено";
                            resultLine.textContent = "Отчёт отправлен администратору. Спасибо — это поможет исправить ошибку.";
                        } catch (error) {
                            button.disabled = false;
                            button.textContent = "Отправить";
                            resultLine.textContent = "Не удалось отправить отчёт: " + String(error?.message || error);
                        }
                    });
                    document.body.appendChild(panel);
                }, 4000);
            }, 5000);
        })();
    </script>
    <script>
        // Last-resort mobile /map recovery. This runs independently of app.js.
        (() => {
            // На мобильных карта не используется; роутер сам перенаправляет /map на главную.
            if (matchMedia("(max-width: 720px)").matches) return;
            if (!/^\/(map|world)\/?$/.test(location.pathname)) return;
            window.setTimeout(() => {
                document.querySelectorAll(
                    "[class*='transition'],[id*='transition'],[class*='portal'],[id*='portal'],[class*='veil'],[id*='veil'],[class*='blackout'],[id*='blackout'],[class*='overlay'],[id*='overlay']"
                ).forEach(el => {
                    if (el.id === "root" || el.id === "cabinet-content" || el.classList.contains("lorgus-map-page")) return;
                    const style = getComputedStyle(el);
                    const rect = el.getBoundingClientRect();
                    if (style.position === "fixed" || style.position === "absolute" || rect.width >= innerWidth * 0.8 && rect.height >= innerHeight * 0.8) el.remove();
                });
                document.documentElement.classList.remove("lorgus-transition-active","lorgus-scene-transitioning");
                document.body.classList.remove("lorgus-transition-active","lorgus-scene-transitioning");
                document.documentElement.style.setProperty("background","#100d09","important");
                document.body.style.setProperty("background","#100d09","important");
                const root = document.getElementById("root");
                if (!root) return;
                [root, ...root.querySelectorAll(".game-page,#cabinet-content,.lorgus-cabinet-entering,.lorgus-map-page,.lorgus-map-shell,.lorgus-map-main")].forEach(el => {
                    el.style.setProperty("visibility","visible","important");
                    el.style.setProperty("opacity","1","important");
                    el.style.setProperty("filter","none","important");
                    el.style.setProperty("transform","none","important");
                    el.style.setProperty("display","block","important");
                });
                root.style.setProperty("min-height","100dvh","important");
                root.style.setProperty("position","relative","important");
                root.style.setProperty("z-index","1","important");
                const cabinet = document.getElementById("cabinet-content");
                if (cabinet && window.activeCharacter && typeof window.renderLorgusWorldMapCurrent === "function" &&
                    !cabinet.querySelector(".lorgus-map-page")) {
                    try { window.renderLorgusWorldMapCurrent(); } catch (e) { console.error("Map recovery failed",e); }
                }
                window.setTimeout(() => {
                    const map = document.querySelector("#cabinet-content .lorgus-map-page");
                    if (map) {
                        map.style.setProperty("visibility","visible","important");
                        map.style.setProperty("opacity","1","important");
                        map.style.setProperty("display","block","important");
                        map.style.setProperty("filter","none","important");
                        map.style.setProperty("transform","none","important");
                        return;
                    }
                    // Do not replace the entire app with a false failure screen while
                    // Supabase is still restoring the active character. Retry the route first.
                    if (window.activeCharacter && window.lorgusRouter) {
                        window.lorgusRouter.bootCurrentRoute();
                        window.setTimeout(() => {
                            const retryMap = document.querySelector("#cabinet-content .lorgus-map-page");
                            if (retryMap) {
                                retryMap.style.setProperty("visibility","visible","important");
                                retryMap.style.setProperty("opacity","1","important");
                                retryMap.style.setProperty("display","block","important");
                            }
                        }, 2500);
                    }
                }, 1800);
            }, 6500);
        })();
    </script>
