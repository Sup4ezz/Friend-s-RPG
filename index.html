        }

    <script>
        // Last-resort mobile /map recovery. This runs independently of app.js.
        (() => {
            // На мобильных карта не используется; роутер сам перенаправляет /map на главную.
            if (matchMedia("(max-width: 720px)").matches) return;
            if (!/^\/(map|world)\/?$/.test(location.pathname)) return;
            window.setTimeout(() => {
                document.querySelectorAll(
                    "[class*='transition'],[id*='transition'],[class*='portal'],[id*='portal'],[class*='veil'],[id*='veil'],[class*='blackout'],[id*='blackout'],[class*='overlay'],[id*='overlay']"
                ).forEach(el => {
                    if (el.id === "root" || el.id === "cabinet-content" || el.classList.contains("lorgus-map-page")) return;
                    const style = getComputedStyle(el);
                    const rect = el.getBoundingClientRect();
                    if (style.position === "fixed" || style.position === "absolute" || rect.width >= innerWidth * 0.8 && rect.height >= innerHeight * 0.8) el.remove();
                });
                document.documentElement.classList.remove("lorgus-transition-active","lorgus-scene-transitioning");
                document.body.classList.remove("lorgus-transition-active","lorgus-scene-transitioning");
                document.documentElement.style.setProperty("background","#100d09","important");
                document.body.style.setProperty("background","#100d09","important");
                const root = document.getElementById("root");
                if (!root) return;
                [root, ...root.querySelectorAll(".game-page,#cabinet-content,.lorgus-cabinet-entering,.lorgus-map-page,.lorgus-map-shell,.lorgus-map-main")].forEach(el => {
                    el.style.setProperty("visibility","visible","important");
                    el.style.setProperty("opacity","1","important");
                    el.style.setProperty("filter","none","important");
                    el.style.setProperty("transform","none","important");
                    el.style.setProperty("display","block","important");
                });
                root.style.setProperty("min-height","100dvh","important");
                root.style.setProperty("position","relative","important");
                root.style.setProperty("z-index","1","important");
                const cabinet = document.getElementById("cabinet-content");
                if (cabinet && window.activeCharacter && typeof window.renderLorgusWorldMapCurrent === "function" &&
                    !cabinet.querySelector(".lorgus-map-page")) {
                    try { window.renderLorgusWorldMapCurrent(); } catch (e) { console.error("Map recovery failed",e); }
                }
                window.setTimeout(() => {
                    const map = document.querySelector("#cabinet-content .lorgus-map-page");
                    if (map) {
                        map.style.setProperty("visibility","visible","important");
                        map.style.setProperty("opacity","1","important");
                        map.style.setProperty("display","block","important");
                        map.style.setProperty("filter","none","important");
                        map.style.setProperty("transform","none","important");
                        return;
                    }
                    // Do not replace the entire app with a false failure screen while
                    // Supabase is still restoring the active character. Retry the route first.
                    if (window.activeCharacter && window.lorgusRouter) {
                        window.lorgusRouter.bootCurrentRoute();
                        window.setTimeout(() => {
                            const retryMap = document.querySelector("#cabinet-content .lorgus-map-page");
                            if (retryMap) {
                                retryMap.style.setProperty("visibility","visible","important");
                                retryMap.style.setProperty("opacity","1","important");
                                retryMap.style.setProperty("display","block","important");
                            }
                        }, 2500);
                    }
                }, 1800);
            }, 6500);
        })();
    </script>
