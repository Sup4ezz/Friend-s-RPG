<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#263b4a"/><stop offset=".58" stop-color="#91a08f"/><stop offset="1" stop-color="#d2a765"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#c9bda6"/><stop offset="1" stop-color="#655c51"/></linearGradient>
<linearGradient id="road" x2="0" y2="1"><stop stop-color="#766451"/><stop offset="1" stop-color="#29211b"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#754727"/><stop offset="1" stop-color="#29160d"/></linearGradient>
<linearGradient id="awning" x2="0" y2="1"><stop stop-color="#b48749"/><stop offset="1" stop-color="#5d351d"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#ffe4a0" stop-opacity=".72"/><stop offset="1" stop-color="#ffe4a0" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="1120" cy="180" rx="390" ry="220" fill="url(#sun)" filter="url(#glow)"/>

