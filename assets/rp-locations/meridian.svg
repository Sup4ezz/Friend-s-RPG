<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#283c48"/><stop offset=".62" stop-color="#89958a"/><stop offset="1" stop-color="#c99a5d"/></linearGradient>
<linearGradient id="road" x2="0" y2="1"><stop stop-color="#665546"/><stop offset="1" stop-color="#201914"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#bdb29f"/><stop offset="1" stop-color="#625b50"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#744628"/><stop offset="1" stop-color="#27150c"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#ffe1a0" stop-opacity=".7"/><stop offset="1" stop-color="#ffe1a0" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="1220" cy="170" rx="370" ry="220" fill="url(#sun)" filter="url(#blur)"/>

<!-- FOUR ROADS CONVERGING ON THE CARAVANSERAI -->
<path d="M0 900L665 565 750 535 0 620Z" fill="url(#road)" stroke="#3d322a" stroke-width="10"/>
<path d="M1600 900L935 565 850 535 1600 620Z" fill="url(#road)" stroke="#3d322a" stroke-width="10"/>
<path d="M650 0L760 535 680 565 505 0Z" fill="#4d4135" stroke="#332a24" stroke-width="8"/>
<path d="M950 0L840 535 920 565 1095 0Z" fill="#4d4135" stroke="#332a24" stroke-width="8"/>

