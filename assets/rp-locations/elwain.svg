<!-- CENTRAL STONE HALL, all architecture connected -->
<g stroke="#171a13" stroke-width="12">
<path d="M620 675V500L800 345L980 500V675Z" fill="#523522"/>
<path d="M620 675V500L800 345L980 500" fill="none" stroke="#777b62" stroke-width="28"/>
