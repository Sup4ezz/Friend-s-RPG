</g>
<!-- old forest settlement, buildings overlap and anchor the ruins -->

<g stroke="#21150e" stroke-width="10">
  <path d="M405 585L490 485L575 585V690H405Z" fill="url(#wood)"/>
  <path d="M1025 585L1110 485L1195 585V690H1025Z" fill="url(#wood)"/>
  <path d="M625 500L800 360L975 500V670H625Z" fill="#523522"/>
</g>
<g fill="#b9d59c" stroke="#26321f" stroke-width="7">
 stroke="#26321f" stroke-width="7">
<path d="M430 535h42v62h-42zM495 505h42v62h-42zM1050 505h42v62h-42zM1115 535h42v62h-42z"/>
<path d="M670 475h58v72h-58zM735 420h58v72h-58zM807 420h58v72h-58zM872 475h58v72h-58z"/>
</g>
<!-- elevated old wooden walkways -->
