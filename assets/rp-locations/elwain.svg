<path d="M360 610Q520 550 670 590L650 640Q510 610 375 660Z"/>
<path d="M930 590Q1080 550 1240 610L1225 660Q1090 610 950 640Z"/>
</g>
<g stroke="#3a2416" stroke-width="14"><path d="M410 630v150M600 600v170M1000 600v170M1190 630v150"/></g>
