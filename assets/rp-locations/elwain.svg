<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#08170d"/><stop offset=".55" stop-color="#274a2b"/><stop offset="1" stop-color="#09100a"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#777b62"/><stop offset="1" stop-color="#292b23"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#70452a"/><stop offset="1" stop-color="#24140d"/></linearGradient>
<linearGradient id="path" x2="0" y2="1"><stop stop-color="#655d48"/><stop offset="1" stop-color="#1b1a14"/></linearGradient>
<radialGradient id="mist"><stop stop-color="#b5d6a7" stop-opacity=".32"/><stop offset="1" stop-color="#b5d6a7" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
