<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#08170d"/><stop offset=".55" stop-color="#274a2b"/><stop offset="1" stop-color="#09100a"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#6b735d"/><stop offset="1" stop-color="#24271f"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#70452a"/><stop offset="1" stop-color="#24140d"/></linearGradient>
<linearGradient id="path" x2="0" y2="1"><stop stop-color="#655d48"/><stop offset="1" stop-color="#1b1a14"/></linearGradient>
<radialGradient id="mist"><stop stop-color="#b5d6a7" stop-opacity=".35"/><stop offset="1" stop-color="#b5d6a7" stop-opacity="0"/></radialGradient>
</defs>
<!-- deep ancient forest -->
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="#0b2112" stroke="#315a36" stroke-width="12">
<path d="M-80 690L40 90L160 690Z"/><path d="M100 690L230 40L360 690Z"/><path d="M1240 690L1370 40L1500 690Z"/><path d="M1440 690L1570 90L1690 690Z"/>
</g>
<!-- enormous ancient trunks -->
<g fill="#2a1b12" stroke="#4f3620" stroke-width="18">
<path d="M120 0H355Q330 180 365 360Q390 500 330 650Q290 760 350 900H0V0Z"/>
<path d="M1245 0H1480V900H1135Q1195 760 1165 650Q1105 500 1130 360Q1165 180 1245 0Z"/>
</g>
<!-- gnarled branches -->
<g fill="none" stroke="#49301c" stroke-linecap="round">
<path d="M280 350Q470 175 760 230Q850 245 930 330" stroke-width="100"/>
<path d="M1320 350Q1130 175 840 230Q750 245 670 330" stroke-width="100"/>
<path d="M250 500Q430 390 590 430" stroke-width="58"/>
<path d="M1350 500Q1170 390 1010 430" stroke-width="58"/>
</g>
<!-- ancient stone structures, fully grounded in the settlement -->
<g fill="url(#stone)" stroke="#171a13" stroke-width="12">
