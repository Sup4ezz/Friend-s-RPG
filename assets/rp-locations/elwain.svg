<path d="M570 900Q640 745 715 620Q770 535 800 490Q830 535 885 620Q960 745 1030 900Z" fill="url(#path)" stroke="#29271f" stroke-width="14"/>
<g stroke="#9a8c69" stroke-width="6" opacity=".6"><path d="M670 850h260M700 790h200M730 735h140M755 685h90M775 640h50"/></g>
