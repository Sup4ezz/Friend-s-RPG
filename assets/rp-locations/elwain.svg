<path d="M535 740V635H585M1065 740V635H1015"/><circle cx="585" cy="690" r="17"/><circle cx="1015" cy="690" r="17"/>
</g>
<ellipse cx="800" cy="475" rx="380" ry="250" fill="url(#mist)"/>
<!-- foreground roots and stones -->
