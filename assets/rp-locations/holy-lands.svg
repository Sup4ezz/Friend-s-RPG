<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0e1518"/><stop offset=".55" stop-color="#59635f"/><stop offset="1" stop-color="#1d2223"/></linearGradient>
 <linearGradient id="armor" x2=".15" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#f1f4f0"/><stop offset=".72" stop-color="#c5ccc8"/><stop offset="1" stop-color="#6e7774"/></linearGradient>
 <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#d5dbd7"/><stop offset="1" stop-color="#69726f"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#e0e3dc"/><stop offset="1" stop-color="#606866"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#747a76"/><stop offset="1" stop-color="#242829"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fffef1" stop-opacity=".95"/><stop offset=".45" stop-color="#eef0e5" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

