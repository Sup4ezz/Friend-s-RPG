<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101619"/><stop offset=".48" stop-color="#56615f"/><stop offset="1" stop-color="#191e20"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#e3e5df"/><stop offset=".55" stop-color="#a7ada8"/><stop offset="1" stop-color="#555d5b"/></linearGradient>
 <linearGradient id="armor" x2=".15" y2="1"><stop stop-color="#fff"/><stop offset=".34" stop-color="#f0f3ef"/><stop offset=".72" stop-color="#c7ceca"/><stop offset="1" stop-color="#737c79"/></linearGradient>
 <linearGradient id="steel" x2="0" y2="1"><stop stop-color="#fafcf8"/><stop offset=".5" stop-color="#cfd5d1"/><stop offset="1" stop-color="#626b68"/></linearGradient>
 <radialGradient id="holyLight"><stop stop-color="#fffef1" stop-opacity=".95"/><stop offset=".4" stop-color="#e9eadf" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#777d79"/><stop offset="1" stop-color="#24292a"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
