 <path d="M470 55H590V320L530 395L470 320Z"/><path d="M1010 55H1130V320L1070 395L1010 320Z"/>
</g>

<!-- huge light behind guardian -->
<ellipse cx="800" cy="285" rx="390" ry="330" fill="url(#light)" filter="url(#shadow)"/>
<ellipse cx="800" cy="285" rx="275" ry="240" fill="url(#light)"/>

