<g fill="none" stroke="#b7bcb6" stroke-width="28" opacity=".5">
 <path d="M150 0Q800 300 1450 0"/><path d="M300 0Q800 245 1300 0"/><path d="M500 0Q800 180 1100 0"/>
</g>

<!-- rear architecture with real depth -->
