<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#11181a"/><stop offset=".6" stop-color="#596360"/><stop offset="1" stop-color="#202628"/></linearGradient>
 <linearGradient id="marble" x2="0" y2="1"><stop stop-color="#f1f2ed"/><stop offset=".5" stop-color="#b9bfba"/><stop offset="1" stop-color="#5f6865"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#292c2b"/><stop offset=".5" stop-color="#535753"/><stop offset="1" stop-color="#171a1a"/></linearGradient>
 <linearGradient id="armor" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".3" stop-color="#eef1ed"/><stop offset=".7" stop-color="#b8c0bc"/><stop offset="1" stop-color="#59625f"/></linearGradient>
 <linearGradient id="blade" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#dce2de"/><stop offset="1" stop-color="#7c8581"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#fffef1" stop-opacity=".95"/><stop offset=".45" stop-color="#e8ebe2" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>

<!-- deep 3D chamber -->
<rect width="1600" height="900" fill="url(#wall)"/>
<path d="M130 0H1470V555Q1260 470 800 470Q340 470 130 555Z" fill="#747c78" stroke="#303736" stroke-width="20"/>
