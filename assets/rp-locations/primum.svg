  <linearGradient id="book4" x2="0" y2="1"><stop stop-color="#74617d"/><stop offset="1" stop-color="#423548"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>

