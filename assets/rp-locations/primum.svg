  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#4a2d1d"/><stop offset="1" stop-color="#120b08"/></linearGradient>
  <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#71462b"/><stop offset=".5" stop-color="#3b2418"/><stop offset="1" stop-color="#1b100b"/></linearGradient>
  <linearGradient id="shelf" x2="0" y2="1"><stop stop-color="#98623b"/><stop offset=".4" stop-color="#57351f"/><stop offset="1" stop-color="#28170f"/></linearGradient>
  <radialGradient id="lamp"><stop stop-color="#ffe9a9" stop-opacity=".8"/><stop offset=".35" stop-color="#e9b65e" stop-opacity=".28"/><stop offset="1" stop-color="#e9b65e" stop-opacity="0"/></radialGradient>
  <linearGradient id="book1" x2="0" y2="1"><stop stop-color="#b95f48"/><stop offset="1" stop-color="#693426"/></linearGradient>
  <linearGradient id="book2" x2="0" y2="1"><stop stop-color="#c39a52"/><stop offset="1" stop-color="#715326"/></linearGradient>
