<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#202b30"/><stop offset=".55" stop-color="#69746f"/><stop offset="1" stop-color="#a8794d"/></linearGradient>
<linearGradient id="forge" x2="0" y2="1"><stop stop-color="#5b4533"/><stop offset="1" stop-color="#21150e"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#918579"/><stop offset="1" stop-color="#393633"/></linearGradient>
<linearGradient id="metal" x2="0" y2="1"><stop stop-color="#9a9b93"/><stop offset=".45" stop-color="#444746"/><stop offset="1" stop-color="#171918"/></linearGradient>
<radialGradient id="fire"><stop stop-color="#ffd978" stop-opacity=".9"/><stop offset=".3" stop-color="#df7b35" stop-opacity=".55"/><stop offset="1" stop-color="#7d301d" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="800" cy="470" rx="520" ry="300" fill="url(#fire)" filter="url(#blur)"/>

<!-- industrial skyline -->
<g fill="#353a39" stroke="#242826" stroke-width="9">
<path d="M0 590V300H210V590Z"/><path d="M210 590V250H400V590Z"/>
<path d="M1200 590V250H1390V590Z"/><path d="M1390 590V300H1600V590Z"/>
</g>
<g fill="#65706d" stroke="#292e2c" stroke-width="7">
<rect x="45" y="345" width="55" height="120"/><rect x="125" y="330" width="55" height="135"/>
<rect x="260" y="300" width="48" height="150"/><rect x="325" y="340" width="48" height="110"/>
<rect x="1225" y="340" width="48" height="110"/><rect x="1290" y="300" width="48" height="150"/>
<rect x="1420" y="330" width="55" height="135"/><rect x="1500" y="345" width="55" height="120"/>
</g>

<!-- huge foundry -->
<g stroke="#3c3530" stroke-width="11">
<path d="M430 610V290L800 120 1170 290V610Z" fill="url(#stone)"/>
<path d="M385 295L800 90 1215 295 1170 350 800 165 430 350Z" fill="#a79b8b"/>
<path d="M530 610V380Q530 295 620 260L800 195 980 260Q1070 295 1070 380V610Z" fill="#292b29"/>
</g>

<!-- giant waterwheel -->
<circle cx="800" cy="395" r="145" fill="#242727" stroke="#8f806d" stroke-width="18"/>
<circle cx="800" cy="395" r="38" fill="#b08a55" stroke="#4a3724" stroke-width="9"/>
<g stroke="#9b8c77" stroke-width="12">
<path d="M800 250V540M655 395H945M697 292L903 498M903 292L697 498"/>
</g>
<g fill="#675440" stroke="#2d2824" stroke-width="6">
<path d="M800 250l-25 35h50Z"/><path d="M945 395l-35-25v50Z"/><path d="M800 540l-25-35h50Z"/><path d="M655 395l35-25v50Z"/>
</g>

<!-- foundry chimneys -->
<g fill="#383b39" stroke="#242725" stroke-width="9">
<path d="M505 310V135L545 105 585 135V310Z"/><path d="M1015 310V135L1055 105 1095 135V310Z"/>
</g>
<g fill="#4b4d49"><rect x="515" y="155" width="60" height="18"/><rect x="1025" y="155" width="60" height="18"/></g>
<path d="M535 110Q535 70 560 35M1045 110Q1045 70 1070 35" fill="none" stroke="#4a4a45" stroke-width="24" opacity=".35"/>

<!-- overhead crane -->
<g stroke="#292c2a" stroke-width="15" fill="none">
<path d="M250 190H1350"/><path d="M300 190V255M1300 190V255"/><path d="M800 190V330"/>
</g>
<path d="M770 330H830L815 365H785Z" fill="#b49a6d" stroke="#34291f" stroke-width="7"/>

<!-- side forges -->
<g stroke="#302a25" stroke-width="9">
<path d="M85 620V500L165 455 245 500V620Z" fill="url(#forge)"/>
<path d="M1355 620V500L1435 455 1515 500V620Z" fill="url(#forge)"/>
</g>
<g fill="url(#fire)"><ellipse cx="165" cy="525" rx="100" ry="95"/><ellipse cx="1435" cy="525" rx="100" ry="95"/></g>
<path d="M135 560Q165 500 195 560Z" fill="#e8873a"/><path d="M1405 560Q1435 500 1465 560Z" fill="#e8873a"/>

<!-- organized workbenches -->
<g stroke="#30251c" stroke-width="8" fill="url(#wood)">
<path d="M285 620V545H500V620Z"/><path d="M1100 620V545H1315V620Z"/>
</g>
<g fill="#8e8d84" stroke="#2d2e2c" stroke-width="6">
<path d="M330 545V510H390V545Z"/><path d="M400 545V500H460V545Z"/>
<path d="M1145 545V510H1205V545Z"/><path d="M1215 545V500H1275V545Z"/>
</g>
<!-- anvils -->
<g fill="url(#metal)" stroke="#222624" stroke-width="7">
<path d="M335 510L370 490 405 510 392 528H348Z"/><path d="M1160 510L1195 490 1230 510 1217 528H1173Z"/>
</g>

<!-- molten channels in workshop floor -->
<path d="M480 620L650 575 720 590 555 665Z" fill="#5b2517" stroke="#30231c" stroke-width="8"/>
<path d="M880 590L950 575 1120 620 1045 665Z" fill="#5b2517" stroke="#30231c" stroke-width="8"/>
<path d="M560 665L720 610 735 630 590 700Z" fill="#d56d2e" opacity=".8"/>
<path d="M865 630L880 610 1010 665 995 700Z" fill="#d56d2e" opacity=".8"/>

<!-- foreground industrial yard -->
<path d="M0 650L800 545 1600 650V900H0Z" fill="#252321"/>
<g stroke="#5f564b" stroke-width="5" opacity=".55">
<path d="M0 760L800 620 1600 760M0 835L800 700 1600 835"/>
<path d="M300 900L700 560M1300 900L900 560"/>
</g>

<!-- crates, metal bars and production stock -->
<g stroke="#33251a" stroke-width="7">
<g fill="#78502f"><rect x="70" y="750" width="150" height="120"/><path d="M85 780h120M85 820h120M120 750v120M170 750v120"/></g>
<g fill="#78502f"><rect x="1380" y="750" width="150" height="120"/><path d="M1395 780h120M1395 820h120M1430 750v120M1480 750v120"/></g>
</g>
<g fill="#767873" stroke="#292b29" stroke-width="6">
<rect x="250" y="790" width="230" height="30"/><rect x="1120" y="790" width="230" height="30"/>
<rect x="280" y="835" width="180" height="24"/><rect x="1140" y="835" width="180" height="24"/>
</g>

<!-- hanging lamps -->
<g stroke="#30271f" stroke-width="7" fill="#ffd879">
<path d="M270 470V560M1330 470V560M800 365V470"/>
<path d="M250 555h40l-8 35h-24Z"/><path d="M1310 555h40l-8 35h-24Z"/><path d="M780 465h40l-8 35h-24Z"/>
</g>
</svg>