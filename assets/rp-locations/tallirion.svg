<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#07170d"/><stop offset=".5" stop-color="#234b2d"/><stop offset="1" stop-color="#101b12"/></linearGradient>
<linearGradient id="water" x2="0" y2="1"><stop stop-color="#376f72"/><stop offset="1" stop-color="#142f32"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#6a4328"/><stop offset="1" stop-color="#24150d"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#6e705b"/><stop offset="1" stop-color="#2c3028"/></linearGradient>
<radialGradient id="light"><stop stop-color="#d6e9a0" stop-opacity=".35"/><stop offset="1" stop-color="#d6e9a0" stop-opacity="0"/></radialGradient>
</defs>
<!-- deep woodland -->
<rect width="1600" height="900" fill="url(#bg)"/>
<g fill="#0b2112" stroke="#315a36" stroke-width="12">
<path d="M-40 700L80 80L210 700Z"/><path d="M170 700L300 30L430 700Z"/><path d="M360 700L470 110L590 700Z"/>
<path d="M1010 700L1130 90L1250 700Z"/><path d="M1190 700L1320 20L1450 700Z"/><path d="M1380 700L1510 100L1640 700Z"/>
</g>
<!-- massive irregular trunks -->
<g fill="#2a1b11" stroke="#4e3821" stroke-width="18">
<path d="M0 0H180Q210 170 160 330Q120 470 205 610Q245 690 225 900H0Z"/>
<path d="M310 0H440Q410 180 455 320Q500 455 440 590Q400 700 450 900H300Q350 700 315 590Q255 450 300 320Q345 180 310 0Z"/>
<path d="M1160 0H1300Q1265 180 1310 320Q1355 455 1295 590Q1255 700 1305 900H1155Q1205 700 1165 590Q1105 450 1150 320Q1195 180 1160 0Z"/>
<path d="M1420 0H1600V900H1375Q1395 690 1435 610Q1520 470 1480 330Q1430 170 1420 0Z"/>
</g>
<!-- natural canopy, NOT triangles -->
<g fill="none" stroke="#365f35" stroke-linecap="round">
<path d="M120 260Q330 120 560 260Q720 350 900 235Q1110 105 1470 260" stroke-width="90"/>
<path d="M170 410Q340 300 520 390Q690 480 850 390Q1040 285 1410 410" stroke-width="55"/>
</g>
<!-- forest clearing -->
<path d="M0 560Q300 510 560 555Q820 600 1060 545Q1330 500 1600 560V900H0Z" fill="#274d2d"/>
<g fill="#4d7a43" opacity=".9">
<ellipse cx="90" cy="520" rx="110" ry="45"/><ellipse cx="250" cy="490" rx="130" ry="55"/><ellipse cx="1350" cy="500" rx="140" ry="55"/><ellipse cx="1510" cy="530" rx="120" ry="45"/>
</g>
<!-- river tucked through forest -->
<path d="M0 665Q230 600 430 650Q610 695 760 665Q930 625 1080 665Q1300 720 1600 650V900H0Z" fill="url(#water)" stroke="#6f9f8e" stroke-width="9"/>
<path d="M0 745Q240 680 470 735T900 735T1600 720" fill="none" stroke="#88b6a4" stroke-width="7" opacity=".35"/>
<!-- timber village, broad rectangular silhouettes -->
<g stroke="#20140c" stroke-width="12">
<path d="M455 610V455H620V610Z" fill="url(#wood)"/><path d="M980 610V455H1145V610Z" fill="url(#wood)"/>
<path d="M650 590V405H910V590Z" fill="#533522"/>
</g>
<!-- shallow sloped roofs, no giant triangles -->
<g fill="#39251a" stroke="#21150e" stroke-width="12">
<path d="M430 455L535 405L645 455Z"/><path d="M955 455L1060 405L1170 455Z"/><path d="M620 405L780 340L940 405Z"/>
</g>
<!-- windows contained inside walls -->
<g fill="#c5d79b" stroke="#27331e" stroke-width="8">
<path d="M485 490H525V545H485Z"/><path d="M555 490H595V545H555Z"/>
<path d="M1010 490H1050V545H1010Z"/><path d="M1080 490H1120V545H1080Z"/>
<path d="M700 445H750V510H700Z"/><path d="M810 445H860V510H810Z"/>
</g>
<!-- covered wooden walkway -->
<g fill="#654128" stroke="#25170e" stroke-width="11">
<path d="M400 625Q530 575 670 605L660 650Q525 630 415 670Z"/>
<path d="M890 605Q1030 575 1180 625L1165 670Q1030 630 900 650Z"/>
</g>
<g stroke="#3b2718" stroke-width="13"><path d="M450 635V760M610 610V750M990 610V750M1150 635V760"/></g>
<!-- small timber bridge across stream -->
<path d="M610 690Q800 640 990 690L980 735Q800 700 620 735Z" fill="url(#wood)" stroke="#24170e" stroke-width="13"/>
<g stroke="#9a7649" stroke-width="7"><path d="M665 690l10 35M730 675l8 38M800 668v40M870 675l-8 38M935 690l-10 35"/></g>
<!-- forest path, curved rather than triangular -->
<path d="M790 900Q720 820 650 765Q590 720 560 670" fill="none" stroke="#665b43" stroke-width="95"/>
<path d="M810 900Q880 820 950 765Q1010 720 1040 670" fill="none" stroke="#665b43" stroke-width="95"/>
<path d="M790 900Q720 820 650 765Q590 720 560 670M810 900Q880 820 950 765Q1010 720 1040 670" fill="none" stroke="#918060" stroke-width="8" opacity=".5"/>
<!-- market/farm objects -->
<g stroke="#25170e" stroke-width="9">
<path d="M190 760H330V835H190Z" fill="#70462a"/><circle cx="220" cy="845" r="20" fill="#2a241b"/><circle cx="300" cy="845" r="20" fill="#2a241b"/>
<path d="M1270 760H1410V835H1270Z" fill="#70462a"/><circle cx="1300" cy="845" r="20" fill="#2a241b"/><circle cx="1380" cy="845" r="20" fill="#2a241b"/>
</g>
<g fill="#9ebd62"><circle cx="230" cy="745" r="20"/><circle cx="270" cy="735" r="16"/><circle cx="1310" cy="745" r="20"/><circle cx="1350" cy="735" r="16"/></g>
<!-- foreground foliage -->
<g fill="#183b22" stroke="#315a36" stroke-width="8">
<ellipse cx="120" cy="820" rx="150" ry="65"/><ellipse cx="1480" cy="820" rx="150" ry="65"/><ellipse cx="430" cy="860" rx="130" ry="45"/><ellipse cx="1170" cy="860" rx="130" ry="45"/>
</g>
<!-- warm village lights -->
<g fill="#e0edaa" stroke="#332317" stroke-width="8"><circle cx="445" cy="635" r="14"/><circle cx="1160" cy="635" r="14"/><circle cx="800" cy="620" r="18"/></g>
<ellipse cx="800" cy="530" rx="500" ry="280" fill="url(#light)"/>
</svg>