<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#071b22"/><stop offset=".55" stop-color="#183f3b"/><stop offset="1" stop-color="#08100e"/></linearGradient>
<linearGradient id="bark" x2="1" y2="0"><stop stop-color="#24150f"/><stop offset=".45" stop-color="#684329"/><stop offset=".72" stop-color="#9a6337"/><stop offset="1" stop-color="#2a1710"/></linearGradient>
<linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#3e8752"/><stop offset="1" stop-color="#102c20"/></linearGradient>
<linearGradient id="walk" x2="0" y2="1"><stop stop-color="#5c4934"/><stop offset="1" stop-color="#171510"/></linearGradient>
<radialGradient id="moon"><stop stop-color="#d9ffe1"/><stop offset="1" stop-color="#8fe0a8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1280" cy="150" r="190" fill="url(#moon)"/><circle cx="1280" cy="150" r="48" fill="#d7f4d9"/>
