<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#081b20"/><stop offset=".52" stop-color="#1d4a39"/><stop offset="1" stop-color="#08120e"/></linearGradient>
<linearGradient id="bark" x2="1"><stop stop-color="#1b100b"/><stop offset=".38" stop-color="#684126"/><stop offset=".62" stop-color="#9a6337"/><stop offset="1" stop-color="#25140e"/></linearGradient>
<linearGradient id="road" x2="0" y2="1"><stop stop-color="#5b5038"/><stop offset="1" stop-color="#181711"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#895732"/><stop offset="1" stop-color="#2d1a12"/></linearGradient>
<radialGradient id="light"><stop stop-color="#d6f4b1" stop-opacity=".6"/><stop offset="1" stop-color="#9edc9b" stop-opacity="0"/></radialGradient>
</defs>
<!-- forest clearing -->
<rect width="1600" height="900" fill="url(#sky)"/>
<path d="M0 0Q170 80 300 0Q420 90 560 0M1040 0Q1180 95 1310 0Q1450 90 1600 0V360H0Z" fill="#102e25"/>
<path d="M0 360Q220 275 410 350T800 325T1190 350T1600 330V700H0Z" fill="#0b2119"/>
<ellipse cx="800" cy="390" rx="500" ry="280" fill="url(#light)"/>
<!-- two colossal trees frame the city -->
<path d="M0 0H310Q345 210 305 390Q270 545 355 690Q410 780 455 900H0Z" fill="url(#bark)" stroke="#180e0a" stroke-width="16"/>
<path d="M1290 0H1600V900H1145Q1190 780 1245 690Q1330 545 1295 390Q1255 210 1290 0Z" fill="url(#bark)" stroke="#180e0a" stroke-width="16"/>
<!-- massive branches over street -->
<g fill="none" stroke="#4c2d1b" stroke-linecap="round">
<path d="M250 300Q420 180 700 170Q820 165 930 210" stroke-width="105"/>
<path d="M1350 300Q1180 180 900 170Q800 165 700 210" stroke-width="105"/>
<path d="M230 470Q390 380 570 405" stroke-width="70"/>
<path d="M1370 470Q1210 380 1030 405" stroke-width="70"/>
</g>
<!-- layered canopy, architectural silhouette rather than circles -->
<g fill="#173e2b" stroke="#4f8e5b" stroke-width="7">
<path d="M0 70L120 15L250 80L360 25L500 105L610 55L720 145L610 230L420 190L260 240L80 190Z"/>
<path d="M880 145L1000 55L1110 105L1240 25L1370 80L1490 15L1600 70V220L1430 240L1270 190L1090 230Z"/>
<path d="M0 250L120 205L250 270L360 215L500 290L610 250L700 330L560 390L390 345L220 385L60 335Z"/>
<path d="M900 330L1000 250L1110 290L1240 215L1370 270L1480 205L1600 250V335L1380 385L1210 345L1040 390Z"/>
</g>
<!-- city built around the trunks -->
<g stroke="#23150d" stroke-width="10">
<!-- left tower -->
<path d="M90 510V300L190 235L290 300V510Z" fill="url(#wood)"/>
<path d="M110 320L190 265L270 320" fill="none" stroke="#b57a43" stroke-width="13"/>
<path d="M130 350h42v70h-42zM208 335h42v85h-42z" fill="#c9e9a5"/>
<!-- right tower -->
<path d="M1310 510V300L1410 235L1510 300V510Z" fill="url(#wood)"/>
<path d="M1330 320L1410 265L1490 320" fill="none" stroke="#b57a43" stroke-width="13"/>
<path d="M1350 350h42v70h-42zM1428 335h42v85h-42z" fill="#c9e9a5"/>
<!-- mid-level homes -->
<path d="M360 475L470 390L580 475V600H360Z" fill="#744a2a"/>
<path d="M1020 475L1130 390L1240 475V600H1020Z" fill="#744a2a"/>
<path d="M625 420L800 300L975 420V555H625Z" fill="#895732"/>
</g>
<!-- windows -->
<g fill="#c8eeaa" stroke="#2a1b11" stroke-width="7">
<path d="M405 480h48v65h-48zM485 450h48v65h-48zM1055 450h48v65h-48zM1135 480h48v65h-48z"/>
<path d="M690 410h55v70h-55zM855 410h55v70h-55zM775 365h50v70h-50z"/>
</g>
<!-- elevated platforms -->
<g fill="#654027" stroke="#21140e" stroke-width="11">
<path d="M330 580Q470 535 610 565L590 625Q455 600 345 640Z"/>
<path d="M990 565Q1130 535 1270 580L1255 640Q1145 600 1010 625Z"/>
</g>
<g stroke="#3a2115" stroke-width="15"><path d="M380 610v125M550 585v150M1050 585v150M1220 610v125"/></g>
<!-- central bridge network -->
<path d="M460 590Q800 690 1140 590" fill="none" stroke="#ad7844" stroke-width="20"/>
<path d="M475 590Q800 655 1125 590" fill="none" stroke="#e0ae69" stroke-width="6"/>
<g stroke="#4b2b18" stroke-width="8"><path d="M530 620l-7 38M610 638l-5 38M690 650l-3 38M770 657v38M850 657v38M930 650l3 38M1010 638l5 38M1090 620l7 38"/></g>
<!-- central street and plaza -->
<path d="M620 900Q670 735 735 610Q775 535 800 505Q825 535 865 610Q930 735 980 900Z" fill="url(#road)" stroke="#17120e" stroke-width="13"/>
<g stroke="#92784f" stroke-width="7"><path d="M700 850h200M720 790h160M745 735h110M765 690h70M782 650h36"/></g>
<!-- foreground roots -->
<path d="M0 900Q230 760 500 825Q600 850 690 900M1600 900Q1370 760 1100 825Q1000 850 910 900" fill="none" stroke="#5a351f" stroke-width="80"/>
<!-- stalls / planters -->
<g stroke="#25160f" stroke-width="8">
<path d="M235 690h150l-20 105H255Z" fill="#6e4528"/><path d="M1215 690h150l-30 105h-100Z" fill="#6e4528"/>
<path d="M255 690h110" stroke="#b47b43" stroke-width="12"/><path d="M1235 690h110" stroke="#b47b43" stroke-width="12"/>
</g>
<g fill="#6da96d"><circle cx="290" cy="675" r="25"/><circle cx="335" cy="660" r="34"/><circle cx="1300" cy="665" r="30"/><circle cx="1345" cy="675" r="22"/></g>
<!-- lanterns -->
<g stroke="#24160f" stroke-width="9" fill="#d7f1b2">
<path d="M430 760V650M430 650h45M475 650v45"/><circle cx="475" cy="705" r="15"/>
<path d="M1170 760V650M1170 650h-45M1125 650v45"/><circle cx="1125" cy="705" r="15"/>
</g>
<!-- fireflies -->
<g fill="#b8efa9"><circle cx="180" cy="610" r="5"/><circle cx="315" cy="535" r="7"/><circle cx="560" cy="450" r="5"/><circle cx="1040" cy="450" r="6"/><circle cx="1280" cy="535" r="5"/><circle cx="1420" cy="610" r="7"/><circle cx="520" cy="760" r="5"/><circle cx="1080" cy="760" r="5"/></g>
</svg>