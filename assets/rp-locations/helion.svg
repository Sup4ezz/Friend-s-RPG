<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="wall" x2="0" y2="1"><stop stop-color="#252b2d"/><stop offset=".65" stop-color="#151a1b"/><stop offset="1" stop-color="#090b0c"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#505657"/><stop offset=".45" stop-color="#303537"/><stop offset="1" stop-color="#151819"/></linearGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#39271c"/><stop offset="1" stop-color="#0b0807"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#704222"/><stop offset=".55" stop-color="#3b2114"/><stop offset="1" stop-color="#160b07"/></linearGradient>
<linearGradient id="iron" x2="0" y2="1"><stop stop-color="#737a7b"/><stop offset=".5" stop-color="#3c4244"/><stop offset="1" stop-color="#171b1c"/></linearGradient>
<linearGradient id="ember" x2="0" y2="1"><stop stop-color="#fff2ad"/><stop offset=".3" stop-color="#ff9e32"/><stop offset="1" stop-color="#bd3519"/></linearGradient>
<radialGradient id="warm"><stop stop-color="#ffae3c" stop-opacity=".42"/><stop offset=".45" stop-color="#d84d20" stop-opacity=".12"/><stop offset="1" stop-color="#d84d20" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="blocks" width="180" height="82" patternUnits="userSpaceOnUse"><path d="M0 81H180M90 0V81" stroke="#b1b5b2" stroke-opacity=".1" stroke-width="3"/></pattern>
</defs>

<!-- dark monumental forge hall -->
<rect width="1600" height="900" fill="url(#wall)"/>
<path d="M0 590V170L180 70L360 170V590Z" fill="url(#stone)" stroke="#737877" stroke-width="10"/>
<path d="M1240 590V170L1420 70L1600 170V590Z" fill="url(#stone)" stroke="#737877" stroke-width="10"/>
<path d="M300 590V190Q800 -15 1300 190V590Z" fill="#24292b" stroke="#858987" stroke-width="12"/>
<path d="M360 590V235Q800 40 1240 235V590" fill="#111516" stroke="#555b5c" stroke-width="9"/>
<path d="M0 285H1600V590H0Z" fill="url(#blocks)"/>

<!-- heavy roof ribs -->
<path d="M360 590V225Q800 35 1240 225M465 590V285Q800 115 1135 285M570 590V345Q800 205 1030 345" fill="none" stroke="#888985" stroke-opacity=".42" stroke-width="13"/>
<path d="M360 225L465 285M1240 225L1135 285M465 285L570 345M1135 285L1030 345" stroke="#8e5e39" stroke-width="7"/>

<!-- central industrial furnace: no giant flame -->
<path d="M585 590V360L660 300H940L1015 360V590Z" fill="#171b1c" stroke="#90603a" stroke-width="9"/>
<path d="M645 590V405Q800 315 955 405V590Z" fill="#080a0b" stroke="#4e4035" stroke-width="8"/>
<path d="M690 500V420Q800 355 910 420V500Z" fill="#030405"/>
<ellipse cx="800" cy="470" rx="170" ry="120" fill="url(#warm)" filter="url(#blur)"/>
<!-- contained furnace glow -->
<path d="M800 500C770 470 792 440 800 395C825 440 840 475 800 500Z" fill="url(#ember)"/>
<path d="M800 480C787 460 799 438 803 420C815 447 820 466 800 480Z" fill="#fff3b0"/>

<!-- chimney -->
<path d="M665 315V105H755V285M845 285V105H935V315" fill="url(#stone)" stroke="#777b79" stroke-width="9"/>
<path d="M645 108H775L755 72H665ZM825 108H955L935 72H845Z" fill="#252a2b" stroke="#95623a" stroke-width="7"/>

<!-- organized side furnaces -->
<path d="M75 590V415Q210 305 345 415V590Z" fill="#111516" stroke="#73503a" stroke-width="9"/>
<path d="M120 525Q210 435 300 525V565H120Z" fill="#030405"/>
<path d="M210 530C180 495 204 470 210 435C240 475 250 505 210 530Z" fill="url(#ember)"/>
<path d="M1255 590V415Q1390 305 1525 415V590Z" fill="#111516" stroke="#73503a" stroke-width="9"/>
<path d="M1300 525Q1390 435 1480 525V565H1300Z" fill="#030405"/>
<path d="M1390 530C1360 495 1384 470 1390 435C1420 475 1430 505 1390 530Z" fill="url(#ember)"/>

<!-- crane, restrained -->
<path d="M120 105H1480" stroke="#515758" stroke-width="22"/>
<path d="M180 105V235M1420 105V235" stroke="#303536" stroke-width="17"/>
<path d="M800 105V250" stroke="#9a683d" stroke-width="9"/>
<path d="M755 250H845" stroke="#806044" stroke-width="12"/>
<path d="M800 250V330" stroke="#9a683d" stroke-width="7"/>
<path d="M775 330H825L815 370H785Z" fill="#737978" stroke="#202425" stroke-width="6"/>

<!-- left orderly smithing station -->
<path d="M85 610L300 575L355 615L135 650Z" fill="url(#wood)" stroke="#9c6438" stroke-width="7"/>
<path d="M125 648L112 820M320 620L340 780" stroke="#321b11" stroke-width="28"/>
<!-- right orderly smithing station -->
<path d="M1245 615L1460 575L1515 615L1295 650Z" fill="url(#wood)" stroke="#9c6438" stroke-width="7"/>
<path d="M1285 648L1272 820M1480 620L1500 780" stroke="#321b11" stroke-width="28"/>

<!-- only two clear anvils -->
<g fill="url(#iron)" stroke="#171b1c" stroke-width="7">
<path d="M145 610L215 585L285 610L260 635H170L182 660H252L235 705H175L145 660Z"/>
<path d="M1315 610L1385 585L1455 610L1430 635H1340L1352 660H1422L1405 705H1345L1315 660Z"/>
</g>



<!-- stone floor perspective -->
<path d="M0 590L800 505L1600 590V900H0Z" fill="url(#floor)"/>
<g stroke="#a06b3b" stroke-opacity=".28" stroke-width="5" fill="none">
<path d="M0 685L800 555L1600 685M0 790L800 650L1600 790M0 885L800 745L1600 885"/>
<path d="M185 900L715 550M500 900L770 550M1100 900L830 550M1415 900L885 550"/>
</g>

<!-- controlled molten channels, integrated into floor -->
<path d="M800 565V900M500 585L620 900M1100 585L980 900" stroke="#160b07" stroke-width="48"/>
<path d="M800 565V900M500 585L620 900M1100 585L980 900" stroke="#c9471b" stroke-width="12"/>
<path d="M800 565V900M500 585L620 900M1100 585L980 900" stroke="#ffbd4d" stroke-width="4"/>

<!-- foreground: clean storage racks -->
<g fill="#202527" stroke="#555c5d" stroke-width="7">
<path d="M65 710H290V835H65Z"/><path d="M1310 710H1535V835H1310Z"/>
<path d="M65 755H290M1310 755H1535"/>
</g>
<g stroke="#9ca19f" stroke-width="14" stroke-linecap="round">
<path d="M100 735H255M100 785H255M1345 735H1500M1345 785H1500"/>
</g>
<g stroke="#3d4344" stroke-width="7"><path d="M110 720V825M150 720V825M190 720V825M230 720V825M1355 720V825M1395 720V825M1435 720V825M1475 720V825"/></g>

<!-- restrained forge haze and sparks -->
<ellipse cx="800" cy="470" rx="520" ry="330" fill="url(#warm)" opacity=".18" filter="url(#blur)"/>
<g fill="#ffd66b"><circle cx="605" cy="470" r="4"/><circle cx="630" cy="440" r="3"/><circle cx="995" cy="455" r="4"/><circle cx="1020" cy="425" r="3"/></g>
</svg>