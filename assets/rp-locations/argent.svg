<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#334555"/><stop offset=".58" stop-color="#a8a294"/><stop offset="1" stop-color="#d5b47e"/></linearGradient>
<linearGradient id="ground" x2="0" y2="1"><stop stop-color="#807568"/><stop offset="1" stop-color="#29231f"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#eee4d0"/><stop offset="1" stop-color="#938676"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#7b4f2c"/><stop offset="1" stop-color="#2d1b11"/></linearGradient>
<linearGradient id="canopy" x2="0" y2="1"><stop stop-color="#b94d35"/><stop offset="1" stop-color="#633027"/></linearGradient>
<linearGradient id="canopy2" x2="0" y2="1"><stop stop-color="#d0a34d"/><stop offset="1" stop-color="#755324"/></linearGradient>
<linearGradient id="water" x2="0" y2="1"><stop stop-color="#315764"/><stop offset="1" stop-color="#17262c"/></linearGradient>
<radialGradient id="light"><stop stop-color="#ffe6a4" stop-opacity=".75"/><stop offset="1" stop-color="#ffe6a4" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>

<!-- sky and distant city -->
<rect width="1600" height="900" fill="url(#sky)"/>
<ellipse cx="1040" cy="210" rx="390" ry="230" fill="url(#light)" filter="url(#blur)"/>
<path d="M0 485L120 405 230 460 350 390 470 465 590 420 700 470 800 430 900 470 1030 405 1160 465 1280 395 1410 460 1510 410 1600 450V550H0Z" fill="#555753"/>
<g stroke="#514b44" stroke-width="7" fill="#91887b">
<path d="M0 540V335L120 275 240 335V540Z"/><path d="M240 540V365L345 315 450 365V540Z"/>
<path d="M1150 540V365L1255 315 1360 365V540Z"/><path d="M1360 540V320L1480 260 1600 320V540Z"/>
</g>

<!-- monumental bank / guild palace in the distance -->
<path d="M515 515V315L800 185 1085 315V515Z" fill="url(#stone)" stroke="#514a42" stroke-width="10"/>
<path d="M455 315L800 145 1145 315 1105 355 800 205 495 355Z" fill="#d9cdb8" stroke="#514a42" stroke-width="10"/>
<path d="M610 515V365L800 270 990 365V515Z" fill="#4a4743" stroke="#393633" stroke-width="9"/>
<g fill="#b9d0cf" stroke="#5c574f" stroke-width="5">
<rect x="655" y="365" width="38" height="110"/><rect x="715" y="335" width="38" height="140"/>
<rect x="847" y="335" width="38" height="140"/><rect x="907" y="365" width="38" height="110"/>
</g>
<path d="M752 515V430Q752 370 800 350Q848 370 848 430V515Z" fill="#26231f" stroke="#c4943d" stroke-width="8"/>
<circle cx="800" cy="225" r="34" fill="#e8cf91" stroke="#745321" stroke-width="8"/>
<path d="M800 202v46M777 225h46" stroke="#745321" stroke-width="7"/>

<!-- side merchant buildings framing the market -->
<g stroke="#514a42" stroke-width="9">
<path d="M0 660V410L150 345 300 410V660Z" fill="#b8ad9b"/>
<path d="M300 620V430L420 375 540 430V620Z" fill="#c9bdab"/>
<path d="M1060 620V430L1180 375 1300 430V620Z" fill="#c9bdab"/>
<path d="M1300 660V410L1450 345 1600 410V660Z" fill="#b8ad9b"/>
</g>
<g fill="#65797e" stroke="#504a43" stroke-width="5">
<path d="M55 440h48v130H55zM145 405h48v155h-48zM335 455h38v105h-38z"/>
<path d="M1227 455h38v105h-38zM1360 405h48v155h-48zM1450 440h48v130h-48z"/>
</g>

<!-- broad market square: one clear plaza, no central obstruction -->
<path d="M510 900L715 505 800 475 885 505 1090 900Z" fill="url(#ground)" stroke="#3a332e" stroke-width="10"/>
<!-- plaza paving lines converge to the bank -->
<g stroke="#a0907c" stroke-width="5" opacity=".65" fill="none">
<path d="M545 850L800 770 1055 850"/><path d="M575 775L800 710 1025 775"/>
<path d="M610 700L800 655 990 700"/><path d="M645 630L800 605 955 630"/><path d="M680 565L800 550 920 565"/>
<path d="M600 900L760 480M1000 900L840 480"/>
</g>

<!-- market stalls: three unmistakable rows -->
<g stroke="#3b281c" stroke-width="7">
<!-- left row -->
<g>
<path d="M115 700V555L275 520 400 570V700Z" fill="url(#wood)"/>
<path d="M95 555L275 485 420 545 400 585 275 535 115 595Z" fill="url(#canopy)"/>
<path d="M145 610h230v75H145z" fill="#c9954e"/>
<path d="M165 630h48v35h-48zM230 625h48v40h-48zM295 630h48v35h-48z" fill="#e5c16c"/>
</g>
<!-- center near row -->
<g>
<path d="M515 720V585L800 525 1085 585V720Z" fill="url(#wood)"/>
<path d="M480 585L800 475 1120 585 1095 625 800 535 505 625Z" fill="url(#canopy2)"/>
<path d="M545 625h510v75H545z" fill="#b87339"/>
<g fill="#ead084">
<rect x="580" y="642" width="58" height="36"/><rect x="650" y="632" width="58" height="46"/>
<rect x="720" y="625" width="58" height="53"/><rect x="790" y="625" width="58" height="53"/>
<rect x="860" y="632" width="58" height="46"/><rect x="930" y="642" width="58" height="36"/>
</g>
</g>
<!-- right row -->
<g>
<path d="M1200 700V570L1325 520 1485 555V700Z" fill="url(#wood)"/>
<path d="M1180 545L1325 485 1505 555 1485 595 1325 535 1200 585Z" fill="url(#canopy)"/>
<path d="M1225 610h230v75h-230z" fill="#c9954e"/>
<path d="M1245 630h48v35h-48zM1310 625h48v40h-48zM1375 630h48v35h-48z" fill="#e5c16c"/>
</g>
</g>

<!-- hanging market signs / poles, attached to stalls, not standing in the middle -->
<g stroke="#38281d" stroke-width="8" fill="#d7b15b">
<path d="M145 555V500h80v55M1375 555V500h80v55"/>
<path d="M565 585V515h90v70M945 585V515h90v70"/>
</g>

<!-- canal kept to the edges, clearly secondary to market -->
<path d="M0 900L300 900 690 500 715 490 600 900Z" fill="url(#water)" stroke="#292e2e" stroke-width="9"/>
<path d="M1600 900L1300 900 910 500 885 490 1000 900Z" fill="url(#water)" stroke="#292e2e" stroke-width="9"/>
<path d="M0 900L300 900 690 500" fill="none" stroke="#ddd0b9" stroke-width="18"/>
<path d="M1600 900L1300 900 910 500" fill="none" stroke="#ddd0b9" stroke-width="18"/>

<!-- foreground merchant carts and cargo -->
<g stroke="#2d1d13" stroke-width="8">
<path d="M25 790H300L265 875H60Z" fill="url(#wood)"/>
<circle cx="75" cy="880" r="27" fill="#292522"/><circle cx="240" cy="880" r="27" fill="#292522"/>
<path d="M1300 790H1575L1540 875H1335Z" fill="url(#wood)"/>
<circle cx="1360" cy="880" r="27" fill="#292522"/><circle cx="1525" cy="880" r="27" fill="#292522"/>
<rect x="350" y="805" width="125" height="85" fill="#875a31"/><path d="M365 830h95M365 860h95M390 805v85M430 805v85"/>
<rect x="1125" y="805" width="125" height="85" fill="#875a31"/><path d="M1140 830h95M1140 860h95M1165 805v85M1205 805v85"/>
</g>

<!-- warm lamps along the market edges -->
<g stroke="#42382f" stroke-width="8">
<path d="M330 500V675M1270 500V675M480 540V640M1120 540V640"/>
</g>
<g fill="#ffe3a0" stroke="#a07838" stroke-width="5">
<path d="M312 670h36l-8 45h-20Z"/><path d="M1252 670h36l-8 45h-20Z"/>
<path d="M462 635h36l-8 40h-20Z"/><path d="M1102 635h36l-8 40h-20Z"/>
</g>

<!-- subtle depth haze -->
<rect width="1600" height="900" fill="url(#light)" opacity=".08"/>
</svg>