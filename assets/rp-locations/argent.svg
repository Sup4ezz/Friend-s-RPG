<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#243443"/><stop offset=".55" stop-color="#7f8888"/><stop offset="1" stop-color="#c8a875"/></linearGradient>
<linearGradient id="stone" x2="0" y2="1"><stop stop-color="#eee5d2"/><stop offset="1" stop-color="#81776a"/></linearGradient>
<linearGradient id="stoneDark" x2="0" y2="1"><stop stop-color="#a99e8c"/><stop offset="1" stop-color="#62594f"/></linearGradient>
<linearGradient id="road" x2="0" y2="1"><stop stop-color="#62564c"/><stop offset="1" stop-color="#201b18"/></linearGradient>
<linearGradient id="wood" x2="0" y2="1"><stop stop-color="#825431"/><stop offset="1" stop-color="#2b1910"/></linearGradient>
<linearGradient id="red" x2="0" y2="1"><stop stop-color="#b65b43"/><stop offset="1" stop-color="#542b24"/></linearGradient>
<linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f2d17b"/><stop offset="1" stop-color="#8a6123"/></linearGradient>
<linearGradient id="water" x2="0" y2="1"><stop stop-color="#355866"/><stop offset="1" stop-color="#17262c"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#ffe7aa" stop-opacity=".7"/><stop offset="1" stop-color="#ffe7aa" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

