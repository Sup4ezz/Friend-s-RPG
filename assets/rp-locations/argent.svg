<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#233445"/><stop offset=".58" stop-color="#71808a"/><stop offset="1" stop-color="#d0a56a"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#eee5d2"/><stop offset="1" stop-color="#918675"/></linearGradient>
