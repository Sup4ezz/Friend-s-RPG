name: LORGUS Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - unity/lorgus-windows-prototype
    paths:
      - "unity-prototype/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: lorgus-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Compile LORGUS for Windows (Mono)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: unity/lorgus-windows-prototype
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-prototype/Library
          key: Library-Windows-${{ hashFiles('unity-prototype/Assets/**', 'unity-prototype/Packages/**', 'unity-prototype/ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Build Windows player with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-prototype
          unityVersion: 6000.0.60f1
          targetPlatform: StandaloneWindows64
          buildMethod: Lorgus.Prototype.Editor.BuildScript.BuildWindows
          buildsPath: Builds
          buildName: LORGUS

      - name: Package the complete Windows player
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="unity-prototype/Builds/Windows"
          test -f "$BUILD_DIR/LORGUS.exe"
          test -f "$BUILD_DIR/UnityPlayer.dll"
          test -d "$BUILD_DIR/LORGUS_Data"
          mkdir -p dist
          cd "$BUILD_DIR"
          # Unity players require runtime DLLs and support folders alongside the EXE.
          # Archive the entire build directory, not only the executable and Data folder.
          zip -r ../../../dist/LORGUS-Windows.zip .
          test -s ../../../dist/LORGUS-Windows.zip
          unzip -l ../../../dist/LORGUS-Windows.zip | grep -E 'UnityPlayer\.dll$'
          unzip -l ../../../dist/LORGUS-Windows.zip | grep -E 'LORGUS_Data/globalgamemanagers$'

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: LORGUS-Windows
          path: dist/LORGUS-Windows.zip
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh build after repository secrets are configured.
