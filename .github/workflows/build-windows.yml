name: LORGUS Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - unity/lorgus-windows-prototype
    paths:
      - "unity-prototype/Assets/**"
      - "unity-prototype/Packages/**"
      - "unity-prototype/ProjectSettings/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: lorgus-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Compile LORGUS for Windows (Mono)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: unity/lorgus-windows-prototype
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-prototype/Library
          key: Library-Windows-${{ hashFiles('unity-prototype/Assets/**', 'unity-prototype/Packages/**', 'unity-prototype/ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-

      - name: Build Windows player with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-prototype
          unityVersion: 6000.0.60f1
          targetPlatform: StandaloneWindows64
          buildMethod: Lorgus.Prototype.Editor.BuildScript.BuildWindows
          buildsPath: Builds
          buildName: LORGUS
          # Avoid semantic versioning: Unity creates Library/ during the build,
          # which makes the checkout appear dirty to the action.
          versioning: None

      - name: Package the complete Windows player
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'unity-prototype/Builds/Windows'
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $archive = Join-Path $distDir 'LORGUS-Windows.zip'
          if (!(Test-Path (Join-Path $buildDir 'LORGUS.exe'))) { throw 'LORGUS.exe is missing' }
          if (!(Test-Path (Join-Path $buildDir 'UnityPlayer.dll'))) { throw 'UnityPlayer.dll is missing' }
          if (!(Test-Path (Join-Path $buildDir 'LORGUS_Data/globalgamemanagers'))) { throw 'Unity player data is incomplete' }
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Compress-Archive -Path (Join-Path $buildDir '*') -DestinationPath $archive -Force
          if (!(Test-Path $archive) -or (Get-Item $archive).Length -eq 0) { throw 'Windows archive is empty' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = $zip.Entries.FullName
            if (!($names -contains 'UnityPlayer.dll')) { throw 'UnityPlayer.dll is missing from archive' }
            if (!($names -contains 'LORGUS_Data/globalgamemanagers')) { throw 'globalgamemanagers is missing from archive' }
          } finally {
            $zip.Dispose()
          }

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: LORGUS-Windows
          path: dist/LORGUS-Windows.zip
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh build after repository secrets are configured.
