name: LORGUS AI Chronicle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lorgus-ai-chronicle
  cancel-in-progress: false

jobs:
  generate-chronicle-drafts:
    runs-on: ubuntu-latest
    env:
      LORGUS_CHRONICLE_SECRET: ${{ secrets.LORGUS_CHRONICLE_SECRET }}
    steps:
      - name: Process new RP messages
        run: |
          if [ -z "$LORGUS_CHRONICLE_SECRET" ]; then
            echo "Chronicle is idle until LORGUS_CHRONICLE_SECRET is configured."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://dxdxnttpznoekaiecrlv.supabase.co/functions/v1/lorgus-chronicle" \
            --header "content-type: application/json" \
            --header "x-lorgus-cron-secret: $LORGUS_CHRONICLE_SECRET" \
            --data '{}'
