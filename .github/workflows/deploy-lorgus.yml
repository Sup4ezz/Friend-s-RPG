# Trigger deployment of the current main branch through Actions on push.
name: Deploy LORGUS to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "Obsidian Vault/**"
      - "Obsidian Vault.zip"
      - ".agent/**"
      - "AGENTS.md"
      - "LORGUS_CHECKLIST.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment summary
        run: |
          echo "LORGUS production deployed from commit ${GITHUB_SHA}"
