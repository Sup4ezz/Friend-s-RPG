name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-production:
    name: Supabase Production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LORGUS_CHRONICLE_SECRET: ${{ secrets.LORGUS_CHRONICLE_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      # Deploy the Telegram Mini App independently, before migrations. A migration-history
      # mismatch must not prevent the bot's Edge Function from receiving code updates.
      - name: Deploy Telegram player function
        run: supabase functions deploy lorgus-telegram-player --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply production migrations
        run: supabase db push --linked --include-all

      - name: Verify migration state
        run: supabase migration list --linked

      - name: Configure and deploy AI chronicle
        if: ${{ env.GEMINI_API_KEY != '' && env.LORGUS_CHRONICLE_SECRET != '' }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "GEMINI_API_KEY=$GEMINI_API_KEY" "LORGUS_CHRONICLE_SECRET=$LORGUS_CHRONICLE_SECRET"
          supabase functions deploy lorgus-chronicle --project-ref "$SUPABASE_PROJECT_ID"

      - name: Explain skipped AI chronicle deployment
        if: ${{ env.GEMINI_API_KEY == '' || env.LORGUS_CHRONICLE_SECRET == '' }}
        run: echo "::warning::AI chronicle not deployed. Add GEMINI_API_KEY and LORGUS_CHRONICLE_SECRET to GitHub Actions secrets, then run this workflow manually."
