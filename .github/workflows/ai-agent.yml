name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI pipeline
        env:
          API: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import urllib.request
          import urllib.error
          import json

          API = os.environ["API"]
          TASK = os.environ["TASK"]

          files = [
              ".ai/AGENT.md",
              ".ai/ARCHITECT.md",
              ".ai/CODER.md",
              ".ai/REVIEWER.md",
              ".ai/QA.md",
              "docs/PROJECT.md",
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml"
          ]

          editable_files = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          MAX_FIX_ATTEMPTS = 2


          # ============================================================
          # FILE READING
          # ============================================================

          def read_file(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return f.read()
              except Exception as e:
                  return f"[FILE NOT FOUND: {e}]"


          def repository_context():
              result = ""

              for path in files:
                  result += f"\n\n===== {path} =====\n"
                  result += read_file(path)

              return result


          def get_diff():
              result = subprocess.run(
                  ["git", "diff", "--"],
                  capture_output=True,
                  text=True
              )

              return result.stdout


          # ============================================================
          # OPENROUTER
          # ============================================================

          def ask_ai(prompt):
              data = {
                  "model": "openrouter/free",
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(data).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + API,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      raw = response.read().decode("utf-8")
                      result = json.loads(raw)

              except urllib.error.HTTPError as e:
                  print("AI HTTP ERROR:", e.code)
                  print(e.read().decode("utf-8"))
                  raise

              if not result.get("choices"):
                  raise RuntimeError("OpenRouter returned no choices")

              content = result["choices"][0]["message"].get("content")

              if not content:
                  raise RuntimeError("OpenRouter returned empty content")

              return content.strip()


          # ============================================================
          # NORMALIZE AI DIFF
          # ============================================================

          def normalize_diff(text):
              text = text.strip()

              if text == "NO_CHANGES":
                  return "NO_CHANGES"

              lines = text.splitlines()

              # Remove opening markdown fence.
              if lines and lines[0].strip().startswith("```"):
                  lines = lines[1:]

              # Remove closing markdown fence.
              if lines and lines[-1].strip() == "```":
                  lines = lines[:-1]

              text = "\n".join(lines).strip()

              # Find the actual beginning of the diff.
              marker = text.find("diff --git ")

              if marker >= 0:
                  text = text[marker:]

              # Remove accidental trailing markdown fence.
              if text.endswith("```"):
                  text = text[:-3].rstrip()

              return text.strip()


          # ============================================================
          # VALIDATE DIFF
          # ============================================================

          def validate_diff(diff, agent):
              if diff == "NO_CHANGES":
                  return

              if not diff.startswith("diff --git "):
                  raise RuntimeError(
                      f"{agent} did not return a valid unified diff"
                  )

              for line in diff.splitlines():

                  if line.startswith("<<<<<<<"):
                      raise RuntimeError(
                          f"{agent} returned merge-conflict markers"
                      )

                  if line.startswith("======="):
                      raise RuntimeError(
                          f"{agent} returned invalid separator"
                      )

                  if line.startswith(">>>>>>>"):
                      raise RuntimeError(
                          f"{agent} returned merge-conflict markers"
                      )

                  if line.startswith("diff --git "):
                      parts = line.split()

                      if len(parts) != 4:
                          raise RuntimeError(
                              f"{agent} returned malformed diff header"
                          )

                      old_path = parts[2][2:]
                      new_path = parts[3][2:]

                      if old_path not in editable_files:
                          raise RuntimeError(
                              f"{agent} attempted to modify forbidden file: "
                              f"{old_path}"
                          )

                      if new_path not in editable_files:
                          raise RuntimeError(
                              f"{agent} attempted to modify forbidden file: "
                              f"{new_path}"
                          )


          # ============================================================
          # APPLY DIFF
          # ============================================================

          def apply_ai_diff(text, agent):
              diff = normalize_diff(text)

              if diff == "NO_CHANGES":
                  print(f"\n{agent}: NO CHANGES\n")
                  return False

              validate_diff(diff, agent)

              with open("/tmp/lorgus.patch", "w", encoding="utf-8") as f:
                  f.write(diff + "\n")

              check = subprocess.run(
                  ["git", "apply", "--check", "/tmp/lorgus.patch"],
                  capture_output=True,
                  text=True
              )

              if check.returncode != 0:
                  print(f"\n{agent} INVALID PATCH:\n")
                  print(check.stdout)
                  print(check.stderr)

                  raise RuntimeError(
                      f"{agent} produced an invalid git patch"
                  )

              subprocess.run(
                  ["git", "apply", "/tmp/lorgus.patch"],
                  check=True
              )

              print(f"\n{agent}: PATCH APPLIED\n")

              return True


          # ============================================================
          # ARCHITECT
          # ============================================================

          context = repository_context()

          architect_prompt = f"""
          Ты ARCHITECT проекта LORGUS.

          Твоя задача — ТОЛЬКО анализировать проект.

          НИКОГДА не создавай diff.
          НИКОГДА не используй строки:
          diff --git
          +++
          ---
          <<<<<<<
          =======
          >>>>>>>

          ===== ROLE =====

          {read_file(".ai/ARCHITECT.md")}

          ===== GENERAL RULES =====

          {read_file(".ai/AGENT.md")}

          ===== USER TASK =====

          {TASK}

          ===== REAL REPOSITORY =====

          {context}

          Изучи реальный код.

          Определи:

          1. Что сейчас существует.
          2. Как работает нужная функциональность.
          3. Какие файлы относятся к задаче.
          4. Что необходимо изменить.
          5. Что менять не нужно.
          6. Возможные риски.
          7. Как проверить результат.

          Ответ должен быть ОБЫЧНЫМ ТЕКСТОМ.

          Не пиши код.
          Не пиши diff.
          Не предлагай вымышленные файлы.
          Не придумывай функции.
          """

          architect = ask_ai(architect_prompt)

          print("\n================ ARCHITECT ================\n")
          print(architect)


          # ============================================================
          # CODER
          # ============================================================

          context = repository_context()

          coder_prompt = f"""
          Ты CODER проекта LORGUS.

          ===== ROLE =====

          {read_file(".ai/CODER.md")}

          ===== GENERAL RULES =====

          {read_file(".ai/AGENT.md")}

          ===== USER TASK =====

          {TASK}

          ===== ARCHITECT ANALYSIS =====

          {architect}

          ===== REAL REPOSITORY =====

          {context}

          Твоя задача — внести необходимые изменения.

          Используй только существующий код.

          Не переписывай проект целиком.

          Не удаляй существующую функциональность без необходимости.

          Не создавай вымышленные зависимости.

          Не добавляй секреты.

          Не изменяй .ai/.

          Если функциональность уже существует и задача выполнена,
          верни ровно:

          NO_CHANGES

          Если изменения нужны, верни ТОЛЬКО настоящий unified git diff.

          ПЕРВАЯ СТРОКА ДОЛЖНА БЫТЬ:

          diff --git

          НЕЛЬЗЯ использовать Markdown-блоки.

          НЕЛЬЗЯ писать пояснения до или после diff.

          НЕЛЬЗЯ использовать:

          <<<<<<<
          =======
          >>>>>>>

          Разрешённые файлы:

          README.md
          index.html
          app.js
          style.css
          worker.js
          wrangler.toml
          docs/PROJECT.md
          """

          coder = ask_ai(coder_prompt)

          print("\n================ CODER ================\n")
          print(coder)

          apply_ai_diff(coder, "CODER")


          # ============================================================
          # QA / REVIEWER / FIXER LOOP
          # ============================================================

          approved = False

          for attempt in range(0, MAX_FIX_ATTEMPTS + 1):

              print(
                  f"\n================ ATTEMPT "
                  f"{attempt + 1} ================\n"
              )

              current_context = repository_context()
              current_diff = get_diff()


              # ========================================================
              # QA
              # ========================================================

              qa_prompt = f"""
              Ты QA проекта LORGUS.

              ===== ROLE =====

              {read_file(".ai/QA.md")}

              ===== GENERAL RULES =====

              {read_file(".ai/AGENT.md")}

              ===== USER TASK =====

              {TASK}

              ===== ARCHITECT =====

              {architect}

              ===== CURRENT REPOSITORY =====

              {current_context}

              ===== CURRENT GIT DIFF =====

              {current_diff}

              Проверь реальные изменения.

              Проверь:

              - JavaScript
              - HTML
              - CSS
              - Supabase
              - Cloudflare Worker
              - API
              - синтаксис
              - регрессии
              - соответствие задаче
              - сохранение старой функциональности

              Не изменяй файлы.

              В конце напиши одну из двух строк:

              RESULT: PASS

              или

              RESULT: FAIL

              Если FAIL — обязательно перечисли конкретные проблемы.
              """

              qa = ask_ai(qa_prompt)

              print("\n================ QA ================\n")
              print(qa)


              # ========================================================
              # REVIEWER
              # ========================================================

              reviewer_context = repository_context()
              reviewer_diff = get_diff()

              reviewer_prompt = f"""
              Ты REVIEWER проекта LORGUS.

              ===== ROLE =====

              {read_file(".ai/REVIEWER.md")}

              ===== GENERAL RULES =====

              {read_file(".ai/AGENT.md")}

              ===== USER TASK =====

              {TASK}

              ===== ARCHITECT =====

              {architect}

              ===== QA =====

              {qa}

              ===== CURRENT REPOSITORY =====

              {reviewer_context}

              ===== GIT DIFF =====

              {reviewer_diff}

              Проведи финальное code review.

              Проверь:

              - логику
              - безопасность
              - JavaScript
              - Supabase
              - Cloudflare Worker
              - XSS
              - пользовательские данные
              - регрессии
              - лишние изменения
              - архитектуру
              - соответствие задаче

              Не изменяй файлы.

              В конце напиши:

              RESULT: APPROVE

              или

              RESULT: REJECT

              Если REJECT — перечисли конкретные проблемы.
              """

              reviewer = ask_ai(reviewer_prompt)

              print("\n================ REVIEWER ================\n")
              print(reviewer)


              # ========================================================
              # APPROVED
              # ========================================================

              if (
                  "RESULT: PASS" in qa
                  and
                  "RESULT: APPROVE" in reviewer
              ):
                  approved = True
                  break


              # ========================================================
              # FIXER
              # ========================================================

              if attempt >= MAX_FIX_ATTEMPTS:
                  break

              print("\n================ FIXER ================\n")

              fixer_context = repository_context()
              fixer_diff = get_diff()

              fixer_prompt = f"""
              Ты FIXER проекта LORGUS.

              Исправь реальные проблемы,
              найденные QA или Reviewer.

              ===== GENERAL RULES =====

              {read_file(".ai/AGENT.md")}

              ===== CODER RULES =====

              {read_file(".ai/CODER.md")}

              ===== USER TASK =====

              {TASK}

              ===== ARCHITECT =====

              {architect}

              ===== QA RESULT =====

              {qa}

              ===== REVIEWER RESULT =====

              {reviewer}

              ===== CURRENT REPOSITORY =====

              {fixer_context}

              ===== CURRENT DIFF =====

              {fixer_diff}

              Исправляй только проблемы,
              относящиеся к текущей задаче.

              Не переписывай проект.

              Не удаляй существующую функциональность.

              Не добавляй секреты.

              Не изменяй .ai/.

              Если исправлять нечего:

              NO_CHANGES

              Иначе верни ТОЛЬКО unified git diff.

              Первая строка:

              diff --git

              Без Markdown.

              Без пояснений.

              Без:

              <<<<<<<
              =======
              >>>>>>> 
              """

              fixer = ask_ai(fixer_prompt)

              print(fixer)

              changed = apply_ai_diff(fixer, "FIXER")

              if not changed:
                  break


          # ============================================================
          # FINAL RESULT
          # ============================================================

          final_diff = get_diff()

          print(
              "\n================ FINAL GIT DIFF ================\n"
          )

          if final_diff:
              print(final_diff)
          else:
              print("NO CHANGES")

          print(
              "\n================ FINAL ================\n"
          )

          if approved:
              print("PIPELINE RESULT: APPROVED")
          else:
              print("PIPELINE RESULT: FAILED")
              raise SystemExit(1)

          PY
