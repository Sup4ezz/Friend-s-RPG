name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request
          import urllib.error

          MODEL = "openrouter/free"

          TASK = os.environ["TASK"]
          API_KEY = os.environ["OPENROUTER_API_KEY"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md",
          }


          def run(cmd):
              result = subprocess.run(
                  cmd,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(f"Command failed: {cmd}")

              return result.stdout


          def ask_ai(prompt):
              data = json.dumps({
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://github.com/Sup4ezz/Friend-s-RPG",
                      "X-Title": "LORGUS AI Workspace"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      result = json.loads(response.read().decode("utf-8"))

                  return result["choices"][0]["message"]["content"]

              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"OpenRouter HTTP {e.code}: {body}"
                  )


          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines).strip()

              start = text.find("{")
              end = text.rfind("}")

              if start != -1 and end != -1 and end > start:
                  text = text[start:end + 1]

              return text


          def parse_json(text):
              cleaned = clean_json(text)

              try:
                  return json.loads(cleaned)
              except Exception as e:
                  raise RuntimeError(
                      "AI did not return valid JSON:\n\n" + text
                  ) from e


          def read_repository():
              files = {}

              for path in ALLOWED_FILES:
                  if os.path.isfile(path):
                      with open(path, "r", encoding="utf-8") as f:
                          files[path] = f.read()

              return files


          def repository_text():
              files = read_repository()

              parts = []

              for path, content in files.items():
                  parts.append(
                      f"\n===== FILE: {path} =====\n"
                      f"{content}\n"
                  )

              return "\n".join(parts)


          def apply_changes(result):
              if "changes" not in result:
                  raise RuntimeError(
                      "AI JSON does not contain 'changes'"
                  )

              changes = result["changes"]

              if not isinstance(changes, list):
                  raise RuntimeError(
                      "'changes' must be a list"
                  )

              changed_paths = []

              for change in changes:
                  path = change.get("path")
                  content_lines = change.get("content_lines")

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"AI attempted to modify forbidden file: {path}"
                      )

                  if not isinstance(content_lines, list):
                      raise RuntimeError(
                          f"content_lines missing or invalid for {path}"
                      )

                  content = "\n".join(content_lines) + "\n"

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  changed_paths.append(path)

              return changed_paths


          def git_diff():
              return run("git diff --")


          print("=" * 40)
          print("LORGUS AI WORKSPACE")
          print("=" * 40)
          print()
          print("TASK:")
          print(TASK)
          print()

          initial_files = read_repository()


          # ============================================================
          # ARCHITECT
          # ============================================================

          print("=" * 40)
          print("ARCHITECT")
          print("=" * 40)

          architect_prompt = f"""
          Ты Architect Agent проекта LORGUS.

          Твоя задача — только проанализировать задачу.
          НИЧЕГО НЕ ИЗМЕНЯЙ.

          Ты НЕ имеешь доступа к shell, terminal, git или filesystem.
          Не используй <tool_call>.
          Не пиши команды cat, git, bash, python и т.п.

          Изучи реальное содержимое репозитория ниже.

          ТЕКУЩАЯ ЗАДАЧА:
          {TASK}

          РЕПОЗИТОРИЙ:
          {repository_text()}

          Ответь обычным текстом.

          Обязательно укажи:
          - проблему;
          - причину;
          - затронутые файлы;
          - план изменений;
          - возможные риски;
          - способ проверки результата.

          Не создавай diff.
          Не пиши код изменений.
          """

          architect = ask_ai(architect_prompt)

          print(architect)
          print()


          # ============================================================
          # CODER
          # ============================================================

          print("=" * 40)
          print("CODER")
          print("=" * 40)

          coder_prompt = f"""
          Ты Coder Agent проекта LORGUS.

          Твоя задача — реализовать поставленную задачу.

          ТЫ НЕ ИМЕЕШЬ shell, terminal, git или filesystem.
          Не используй <tool_call>.
          Не пиши команды cat, git, bash, python и т.п.

          Ты должен работать ТОЛЬКО с реальным содержимым файлов,
          приведённым ниже.

          ТЕКУЩАЯ ЗАДАЧА:
          {TASK}

          АРХИТЕКТУРНЫЙ АНАЛИЗ:
          {architect}

          ТЕКУЩИЕ ФАЙЛЫ:
          {repository_text()}

          ВАЖНО:

          1. Не придумывай содержимое существующих файлов.
          2. Сохрани существующую функциональность.
          3. Измени только необходимые файлы.
          4. Не изменяй файлы, которых нет в задаче.
          5. Не изменяй .ai/.
          6. Не создавай unified diff.
          7. Не используй markdown fences.
          8. Верни ТОЛЬКО JSON.

          Формат:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "строка 1",
                  "строка 2"
                ]
              }}
            ]
          }}

          Для каждого изменяемого файла передай ПОЛНОЕ новое содержимое
          через content_lines.

          Если изменений не требуется:

          {{
            "changes": []
          }}
          """

          coder_raw = ask_ai(coder_prompt)

          print(coder_raw)

          coder = parse_json(coder_raw)

          changed = apply_changes(coder)

          print()
          print("CODER: updated " + ", ".join(changed))


          # ============================================================
          # GIT DIFF
          # ============================================================

          print()
          print("=" * 40)
          print("ACTUAL GIT DIFF")
          print("=" * 40)

          diff = git_diff()

          if not diff.strip():
              print("NO CHANGES")
              sys.exit(0)

          print(diff)


          # ============================================================
          # VALIDATION LOOP
          # ============================================================

          approved = False

          for validation_pass in range(1, 4):

              print()
              print("=" * 40)
              print(f"VALIDATION PASS {validation_pass}")
              print("=" * 40)


              current_repository = repository_text()
              current_diff = git_diff()


              # ========================================================
              # QA
              # ========================================================

              print()
              print("=" * 40)
              print("QA")
              print("=" * 40)

              qa_prompt = f"""
              Ты QA Agent проекта LORGUS.

              У тебя НЕТ shell, terminal, git, filesystem или других
              инструментов.

              НИКОГДА не используй:
              <tool_call>
              cat
              git
              bash
              python
              shell

              Проверяй изменения ТОЛЬКО по данным,
              которые приведены ниже.

              ТЕКУЩАЯ ЗАДАЧА:
              {TASK}

              ТЕКУЩИЙ КОД:
              {current_repository}

              ACTUAL GIT DIFF:
              {current_diff}

              Проверь:

              1. Выполнена ли задача.
              2. Не изменены ли лишние файлы.
              3. Сохранена ли существующая функциональность.
              4. Нет ли очевидных ошибок.
              5. Соответствует ли изменение задаче.

              Верни ТОЛЬКО JSON.

              Если всё правильно:

              {{
                "result": "PASS",
                "summary": "краткое описание",
                "problems": []
              }}

              Если есть проблема:

              {{
                "result": "FAIL",
                "summary": "краткое описание",
                "problems": [
                  {{
                    "file": "README.md",
                    "problem": "что не так",
                    "required_change": "что исправить"
                  }}
                ]
              }}
              """

              qa_raw = ask_ai(qa_prompt)

              print(qa_raw)

              try:
                  qa = parse_json(qa_raw)
              except Exception as e:
                  qa = {
                      "result": "FAIL",
                      "summary": "QA returned invalid JSON.",
                      "problems": [
                          {
                              "file": "unknown",
                              "problem": str(e),
                              "required_change": "Повторно проверить изменения."
                          }
                      ]
                  }


              if qa.get("result") != "PASS":

                  print()
                  print("QA: FAIL")


                  # ====================================================
                  # FIXER
                  # ====================================================

                  print()
                  print("=" * 40)
                  print("FIXER")
                  print("=" * 40)

                  fixer_prompt = f"""
                  Ты Fixer Agent проекта LORGUS.

                  Исправь проблемы, найденные QA.

                  У тебя НЕТ shell, terminal, git, filesystem
                  или других инструментов.

                  Не используй <tool_call>.
                  Не используй cat, git, bash, python или shell.

                  ТЕКУЩАЯ ЗАДАЧА:
                  {TASK}

                  ТЕКУЩИЕ ФАЙЛЫ:
                  {current_repository}

                  QA:
                  {json.dumps(qa, ensure_ascii=False, indent=2)}

                  ВАЖНО:

                  Верни ТОЛЬКО JSON.

                  Формат:

                  {{
                    "changes": [
                      {{
                        "path": "README.md",
                        "content_lines": [
                          "полное содержимое файла"
                        ]
                      }}
                    ]
                  }}

                  Передавай полное содержимое изменяемого файла.

                  Не изменяй несвязанные файлы.
                  """

                  fixer_raw = ask_ai(fixer_prompt)

                  print(fixer_raw)

                  fixer = parse_json(fixer_raw)

                  fixed = apply_changes(fixer)

                  print()
                  print("FIXER: updated " + ", ".join(fixed))

                  continue


              print()
              print("QA: PASS")


              # ========================================================
              # REVIEWER
              # ========================================================

              print()
              print("=" * 40)
              print("REVIEWER")
              print("=" * 40)

              reviewer_prompt = f"""
              Ты Reviewer Agent проекта LORGUS.

              У тебя НЕТ shell, terminal, git, filesystem
              или других инструментов.

              Не используй:
              <tool_call>
              cat
              git
              bash
              python
              shell

              Проверяй реальные изменения по представленному diff.

              ТЕКУЩАЯ ЗАДАЧА:
              {TASK}

              ACTUAL GIT DIFF:
              {current_diff}

              Проверь:

              1. Логику.
              2. Безопасность.
              3. Архитектуру.
              4. Регрессии.
              5. Несвязанные изменения.
              6. Соответствие задаче.
              7. Секреты.
              8. Supabase.
              9. Cloudflare Worker.

              Верни ТОЛЬКО JSON.

              Если проблем нет:

              {{
                "result": "APPROVE",
                "summary": "краткое описание",
                "problems": []
              }}

              Если есть проблемы:

              {{
                "result": "REJECT",
                "summary": "краткое описание",
                "problems": [
                  {{
                    "file": "README.md",
                    "problem": "что не так",
                    "required_change": "что исправить"
                  }}
                ]
              }}
              """

              reviewer_raw = ask_ai(reviewer_prompt)

              print(reviewer_raw)

              try:
                  reviewer = parse_json(reviewer_raw)
              except Exception as e:
                  reviewer = {
                      "result": "REJECT",
                      "summary": "Reviewer returned invalid JSON.",
                      "problems": [
                          {
                              "file": "unknown",
                              "problem": str(e),
                              "required_change": "Повторно проверить изменения."
                          }
                      ]
                  }


              if reviewer.get("result") != "APPROVE":

                  print()
                  print("REVIEWER: REJECT")


                  # ====================================================
                  # FIXER
                  # ====================================================

                  print()
                  print("=" * 40)
                  print("FIXER")
                  print("=" * 40)

                  fixer_prompt = f"""
                  Ты Fixer Agent проекта LORGUS.

                  Исправь проблемы Reviewer.

                  У тебя НЕТ shell, terminal, git, filesystem
                  или других инструментов.

                  Не используй <tool_call>.
                  Не используй cat, git, bash, python или shell.

                  ТЕКУЩАЯ ЗАДАЧА:
                  {TASK}

                  ТЕКУЩИЕ ФАЙЛЫ:
                  {current_repository}

                  REVIEWER:
                  {json.dumps(reviewer, ensure_ascii=False, indent=2)}

                  Верни ТОЛЬКО JSON:

                  {{
                    "changes": [
                      {{
                        "path": "README.md",
                        "content_lines": [
                          "полное содержимое файла"
                        ]
                      }}
                    ]
                  }}

                  Передавай полное содержимое изменяемого файла.

                  Не изменяй несвязанные файлы.
                  """

                  fixer_raw = ask_ai(fixer_prompt)

                  print(fixer_raw)

                  fixer = parse_json(fixer_raw)

                  fixed = apply_changes(fixer)

                  print()
                  print("FIXER: updated " + ", ".join(fixed))

                  continue


              print()
              print("REVIEWER: APPROVE")

              approved = True
              break


          if not approved:
              print()
              print("=" * 40)
              print("PIPELINE RESULT: FAILED")
              print("=" * 40)
              sys.exit(1)


          # ============================================================
          # FINAL DIFF
          # ============================================================

          print()
          print("=" * 40)
          print("PIPELINE RESULT: APPROVED")
          print("=" * 40)

          final_diff = git_diff()

          print()
          print("FINAL DIFF:")
          print(final_diff)


          # ============================================================
          # COMMIT + PUSH
          # ============================================================

          print()
          print("=" * 40)
          print("COMMIT + PUSH")
          print("=" * 40)

          run('git config user.name "LORGUS AI"')
          run('git config user.email "lorgus-ai@users.noreply.github.com"')

          run("git add -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md")

          status = run("git status --short")

          if not status.strip():
              print("Nothing to commit.")
              sys.exit(0)

          run('git commit -m "AI: update LORGUS project"')

          run("git push origin HEAD")

          print()
          print("=" * 40)
          print("PUSH SUCCESSFUL")
          print("=" * 40)
          PY
