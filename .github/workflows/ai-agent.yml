name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ask AI
        env:
          API: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          def read_file(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return f.read()
              except:
                  return "[FILE NOT FOUND]"

          files = [
              ".ai/AGENT.md",
              ".ai/ARCHITECT.md",
              ".ai/CODER.md",
              ".ai/REVIEWER.md",
              ".ai/QA.md",
              "docs/PROJECT.md",
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml"
          ]

          context = ""

          for file in files:
              context += f"\n\n===== {file} =====\n"
              context += read_file(file)

          prompt = f"""Ты работаешь непосредственно с репозиторием LORGUS.

          Ниже находится реальное содержимое файлов репозитория.

          {context}

          Задача пользователя:
          {os.environ["TASK"]}

          ВАЖНО:
          - Используй только фактическое содержимое файлов выше.
          - Не придумывай существование функций, API или компонентов.
          - Если информации нет в файлах, так и скажи.
          - Ничего не изменяй.
          - Дай конкретный анализ задачи.
          """

          data = {
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ]
          }

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(data).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["API"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          print(result["choices"][0]["message"]["content"])
          PY
