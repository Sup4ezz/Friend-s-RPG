name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import subprocess
          import sys
          import urllib.request

          API_KEY = os.environ["OPENROUTER_API_KEY"]
          TASK = os.environ["TASK"]

          MODEL = "openrouter/free"

          EDITABLE_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md",
          }

          def run(cmd):
              result = subprocess.run(
                  cmd,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed:\n{cmd}\n\n"
                      f"STDOUT:\n{result.stdout}\n\n"
                      f"STDERR:\n{result.stderr}"
                  )

              return result.stdout

          def repo_text():
              files = []

              for root, dirs, names in os.walk("."):
                  dirs[:] = [
                      d for d in dirs
                      if d not in {".git", ".github"}
                  ]

                  for name in names:
                      path = os.path.join(root, name)

                      if path.startswith("./"):
                          path = path[2:]

                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                      except (UnicodeDecodeError, OSError):
                          continue

                      files.append(
                          f"\n===== FILE: {path} =====\n"
                          f"{content}\n"
                          f"===== END FILE =====\n"
                      )

              return "".join(sorted(files))

          def ask_ai(system_prompt, user_prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": system_prompt
                      },
                      {
                          "role": "user",
                          "content": user_prompt
                      }
                  ]
              }

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://github.com/Sup4ezz/Friend-s-RPG",
                      "X-Title": "LORGUS AI Workspace"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              return data["choices"][0]["message"]["content"]

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines).strip()

              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  start = text.find("{")
                  end = text.rfind("}")

                  if start == -1 or end == -1 or end <= start:
                      raise RuntimeError(
                          "AI did not return valid JSON:\n\n" + text
                      )

                  try:
                      return json.loads(
                          text[start:end + 1]
                      )
                  except json.JSONDecodeError as e:
                      raise RuntimeError(
                          "AI returned invalid JSON:\n\n"
                          + text
                      ) from e

          def apply_changes(response, agent_name):
              if not isinstance(response, dict):
                  raise RuntimeError(
                      f"{agent_name}: response must be a JSON object"
                  )

              changes = response.get("changes")

              if not isinstance(changes, list):
                  raise RuntimeError(
                      f"{agent_name}: 'changes' must be an array"
                  )

              if len(changes) > 10:
                  raise RuntimeError(
                      f"{agent_name}: too many changed files"
                  )

              seen = set()

              for change in changes:
                  if not isinstance(change, dict):
                      raise RuntimeError(
                          f"{agent_name}: invalid change object"
                      )

                  path = change.get("path")
                  lines = change.get("content_lines")

                  if not isinstance(path, str):
                      raise RuntimeError(
                          f"{agent_name}: invalid file path"
                      )

                  if not isinstance(lines, list):
                      raise RuntimeError(
                          f"{agent_name}: content_lines must be an array"
                      )

                  if path.startswith("/"):
                      raise RuntimeError(
                          f"{agent_name}: absolute path forbidden: {path}"
                      )

                  if ".." in path.split("/"):
                      raise RuntimeError(
                          f"{agent_name}: parent path forbidden: {path}"
                      )

                  if path not in EDITABLE_FILES:
                      raise RuntimeError(
                          f"{agent_name}: file is not allowed: {path}"
                      )

                  if path in seen:
                      raise RuntimeError(
                          f"{agent_name}: duplicate file: {path}"
                      )

                  seen.add(path)

                  for line in lines:
                      if not isinstance(line, str):
                          raise RuntimeError(
                              f"{agent_name}: every content_lines item must be a string"
                          )

                  content = "\n".join(lines)

                  if lines:
                      content += "\n"

                  directory = os.path.dirname(path)

                  if directory:
                      os.makedirs(
                          directory,
                          exist_ok=True
                      )

                  with open(
                      path,
                      "w",
                      encoding="utf-8",
                      newline=""
                  ) as f:
                      f.write(content)

                  print(
                      f"{agent_name}: updated {path}"
                  )

              if not changes:
                  print(
                      f"{agent_name}: no changes"
                  )

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("TASK:")
          print(TASK)
          print()

          initial_repo = repo_text()

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect = ask_ai(
              """
          Ты Architect Agent проекта LORGUS.

          Изучи реальное содержимое репозитория.

          Твоя задача:
          - понять задачу;
          - изучить существующую архитектуру;
          - определить необходимые файлы;
          - определить минимальный план изменений;
          - учитывать существующий код;
          - не придумывать отсутствующую функциональность.

          НЕ изменяй файлы.

          НЕ создавай git diff.

          НЕ пиши код.

          НЕ возвращай JSON.

          Верни обычный текстовый архитектурный анализ.
          """,
              f"""
          ЗАДАЧА:

          {TASK}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {initial_repo}
          """
          )

          print(architect)

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_raw = ask_ai(
              """
          Ты Coding Agent проекта LORGUS.

          Ты должен реализовать поставленную задачу.

          Перед изменением изучи реальный репозиторий.

          ВАЖНО.

          Ты НЕ должен создавать git diff.

          Ты НЕ должен создавать unified diff.

          Ты НЕ должен использовать:
          @@
          +++
          ---
          diff --git

          Вместо этого верни ТОЛЬКО JSON следующего формата:

          {
            "changes": [
              {
                "path": "README.md",
                "content_lines": [
                  "# Friend-s-RPG",
                  "",
                  "## LORGUS AI Workspace",
                  "",
                  "текст"
                ]
              }
            ]
          }

          КРИТИЧЕСКИ ВАЖНО:

          content_lines содержит ПОЛНОЕ содержимое файла.

          Каждый элемент content_lines является ОДНОЙ строкой файла.

          НЕ помещай переносы строк внутрь строк content_lines.

          НЕ возвращай только изменённый фрагмент.

          Если файл нужно изменить — верни его полностью.

          Если изменений не требуется:

          {
            "changes": []
          }

          Можно изменять только:

          README.md
          index.html
          app.js
          style.css
          worker.js
          wrangler.toml
          docs/PROJECT.md

          НЕ изменяй другие файлы.

          Верни ТОЛЬКО JSON.
          Без Markdown.
          Без ```json.
          Без пояснений.
          """,
              f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТУРНЫЙ АНАЛИЗ:

          {architect}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {repo_text()}
          """
          )

          coder = clean_json(coder_raw)

          print(
              json.dumps(
                  coder,
                  ensure_ascii=False,
                  indent=2
              )
          )

          apply_changes(
              coder,
              "CODER"
          )

          print()
          print("========================================")
          print("ACTUAL GIT DIFF")
          print("========================================")

          diff = run(
              "git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md"
          )

          if not diff.strip():
              print("NO CHANGES")
          else:
              print(diff)

          def current_diff():
              return run(
                  "git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md"
              )

          def run_qa():
              print()
              print("========================================")
              print("QA")
              print("========================================")

              result = ask_ai(
                  """
          Ты QA Agent проекта LORGUS.

          Проверь РЕАЛЬНОЕ состояние репозитория после изменений.

          Проверь:
          - JavaScript;
          - HTML;
          - CSS;
          - Worker;
          - Supabase;
          - отсутствие очевидных регрессий;
          - соответствие поставленной задаче.

          Используй реальное содержимое файлов и реальный git diff.

          В конце обязательно напиши ровно одну из строк:

          RESULT: PASS

          или

          RESULT: FAIL

          Если FAIL — подробно объясни проблему.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          РЕПОЗИТОРИЙ:

          {repo_text()}

          GIT DIFF:

          {current_diff()}
          """
              )

              print(result)

              if "RESULT: PASS" in result:
                  return True, result

              return False, result

          def run_reviewer():
              print()
              print("========================================")
              print("REVIEWER")
              print("========================================")

              result = ask_ai(
                  """
          Ты Reviewer Agent проекта LORGUS.

          Проверь реальные изменения в репозитории.

          Проверяй:
          - логику;
          - безопасность;
          - JavaScript;
          - Supabase;
          - Cloudflare Worker;
          - регрессии;
          - лишние изменения;
          - соответствие архитектуре.

          Особенно проверь:
          - секреты;
          - service-role ключи;
          - пользовательские данные;
          - XSS;
          - неправильные права;
          - ошибки API.

          В конце обязательно напиши ровно одну из строк:

          RESULT: APPROVE

          или

          RESULT: REJECT

          Если REJECT — подробно укажи проблемы.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          РЕПОЗИТОРИЙ:

          {repo_text()}

          GIT DIFF:

          {current_diff()}
          """
              )

              print(result)

              if "RESULT: APPROVE" in result:
                  return True, result

              return False, result

          for attempt in range(3):

              print()
              print("========================================")
              print(
                  f"VALIDATION PASS {attempt + 1}"
              )
              print("========================================")

              qa_ok, qa_result = run_qa()

              reviewer_ok, reviewer_result = run_reviewer()

              if qa_ok and reviewer_ok:
                  print()
                  print("========================================")
                  print("PIPELINE RESULT: APPROVED")
                  print("========================================")

                  print()
                  print("FINAL DIFF:")

                  print(current_diff())

                  sys.exit(0)

              if attempt == 2:
                  print()
                  print("========================================")
                  print("PIPELINE RESULT: FAILED")
                  print("========================================")

                  sys.exit(1)

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_raw = ask_ai(
                  """
          Ты Fixer Agent проекта LORGUS.

          QA или Reviewer нашли проблему.

          Исправь проблему в реальном коде.

          НЕ создавай git diff.

          Верни ТОЛЬКО JSON:

          {
            "changes": [
              {
                "path": "README.md",
                "content_lines": [
                  "# Friend-s-RPG",
                  "",
                  "исправленное содержимое"
                ]
              }
            ]
          }

          content_lines содержит ПОЛНОЕ содержимое файла.

          Каждый элемент content_lines — ОДНА строка файла.

          НЕ помещай переносы строк внутрь элементов content_lines.

          Если изменений не требуется:

          {
            "changes": []
          }

          Разрешённые файлы:

          README.md
          index.html
          app.js
          style.css
          worker.js
          wrangler.toml
          docs/PROJECT.md

          НЕ изменяй другие файлы.

          Без Markdown.
          Без ```json.
          Без пояснений.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {repo_text()}

          QA:

          {qa_result}

          REVIEWER:

          {reviewer_result}

          ТЕКУЩИЙ GIT DIFF:

          {current_diff()}
          """
              )

              fixer = clean_json(
                  fixer_raw
              )

              print(
                  json.dumps(
                      fixer,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              apply_changes(
                  fixer,
                  "FIXER"
              )

          PY
