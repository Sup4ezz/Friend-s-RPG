name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import subprocess
          import sys
          import urllib.request

          API_KEY = os.environ["OPENROUTER_API_KEY"]
          TASK = os.environ["TASK"]

          MODEL = "openrouter/free"

          EDITABLE_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md",
          }

          def run(cmd):
              result = subprocess.run(
                  cmd,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed:\n{cmd}\n\n"
                      f"STDOUT:\n{result.stdout}\n\n"
                      f"STDERR:\n{result.stderr}"
                  )

              return result.stdout

          def repo_text():
              files = []

              for root, dirs, names in os.walk("."):
                  dirs[:] = [
                      d for d in dirs
                      if d not in {".git", ".github"}
                  ]

                  for name in names:
                      path = os.path.join(root, name)

                      if path.startswith("./"):
                          path = path[2:]

                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                      except (UnicodeDecodeError, OSError):
                          continue

                      files.append(
                          f"\n===== FILE: {path} =====\n"
                          f"{content}\n"
                          f"===== END FILE =====\n"
                      )

              return "".join(sorted(files))

          def ask_ai(system_prompt, user_prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": system_prompt
                      },
                      {
                          "role": "user",
                          "content": user_prompt
                      }
                  ]
              }

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://github.com/Sup4ezz/Friend-s-RPG",
                      "X-Title": "LORGUS AI Workspace"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(response.read().decode("utf-8"))

              return data["choices"][0]["message"]["content"]

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines).strip()

              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  start = text.find("{")
                  end = text.rfind("}")

                  if start == -1 or end == -1 or end <= start:
                      raise RuntimeError(
                          "AI did not return valid JSON:\n\n" + text
                      )

                  try:
                      return json.loads(text[start:end + 1])
                  except json.JSONDecodeError as e:
                      raise RuntimeError(
                          "AI returned invalid JSON:\n\n"
                          + text
                      ) from e

          def apply_changes(response, agent_name):
              if not isinstance(response, dict):
                  raise RuntimeError(
                      f"{agent_name}: response must be a JSON object"
                  )

              changes = response.get("changes")

              if not isinstance(changes, list):
                  raise RuntimeError(
                      f"{agent_name}: JSON must contain 'changes' array"
                  )

              if len(changes) > 10:
                  raise RuntimeError(
                      f"{agent_name}: too many changed files"
                  )

              seen = set()

              for change in changes:
                  if not isinstance(change, dict):
                      raise RuntimeError(
                          f"{agent_name}: invalid change object"
                      )

                  path = change.get("path")
                  content = change.get("content")

                  if not isinstance(path, str):
                      raise RuntimeError(
                          f"{agent_name}: invalid file path"
                      )

                  if not isinstance(content, str):
                      raise RuntimeError(
                          f"{agent_name}: content must be a string"
                      )

                  if (
                      path.startswith("/")
                      or ".." in path.split("/")
                      or path not in EDITABLE_FILES
                  ):
                      raise RuntimeError(
                          f"{agent_name}: file is not allowed: {path}"
                      )

                  if path in seen:
                      raise RuntimeError(
                          f"{agent_name}: duplicate file: {path}"
                      )

                  seen.add(path)

                  os.makedirs(
                      os.path.dirname(path) or ".",
                      exist_ok=True
                  )

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(
                      f"{agent_name}: updated {path}"
                  )

              if not changes:
                  print(f"{agent_name}: no changes")

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("TASK:")
          print(TASK)
          print()

          initial_repo = repo_text()

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect = ask_ai(
              """
          Ты Architect Agent проекта LORGUS.

          Изучи реальное содержимое репозитория.

          Твоя задача:
          - понять задачу;
          - изучить существующую архитектуру;
          - определить необходимые файлы;
          - определить минимальный план изменений;
          - учитывать существующий код;
          - не придумывать отсутствующую функциональность.

          НЕ изменяй файлы.

          НЕ создавай git diff.

          НЕ пиши код.

          НЕ возвращай JSON.

          Верни обычный текстовый архитектурный анализ.
          """,
              f"""
          ЗАДАЧА:

          {TASK}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {initial_repo}
          """
          )

          print(architect)

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_raw = ask_ai(
              """
          Ты Coding Agent проекта LORGUS.

          Ты должен реализовать поставленную задачу.

          Перед изменением изучи реальный репозиторий.

          ВАЖНО:

          Ты НЕ должен создавать git diff.

          Ты НЕ должен создавать unified diff.

          Ты НЕ должен использовать строки:
          @@
          +++
          ---
          diff --git

          Вместо этого верни JSON со следующим форматом:

          {
            "changes": [
              {
                "path": "README.md",
                "content": "ПОЛНОЕ НОВОЕ СОДЕРЖИМОЕ ФАЙЛА"
              }
            ]
          }

          content должен содержать ПОЛНОЕ содержимое изменяемого файла.

          Не возвращай только изменённый фрагмент.

          Если изменений не требуется:

          {
            "changes": []
          }

          Можно изменять только необходимые файлы.

          Доступные файлы:

          README.md
          index.html
          app.js
          style.css
          worker.js
          wrangler.toml
          docs/PROJECT.md

          Верни ТОЛЬКО JSON.
          Без Markdown.
          Без ```json.
          Без пояснений.
          """,
              f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТУРНЫЙ АНАЛИЗ:

          {architect}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {repo_text()}
          """
          )

          coder = clean_json(coder_raw)

          print(json.dumps(coder, ensure_ascii=False, indent=2))

          apply_changes(coder, "CODER")

          print()
          print("========================================")
          print("ACTUAL GIT DIFF")
          print("========================================")

          diff = run("git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md")

          if not diff.strip():
              print("NO CHANGES")
          else:
              print(diff)

          def run_qa():
              print()
              print("========================================")
              print("QA")
              print("========================================")

              result = ask_ai(
                  """
          Ты QA Agent проекта LORGUS.

          Проверь РЕАЛЬНОЕ состояние репозитория после изменений.

          Проверь:
          - JavaScript;
          - HTML;
          - CSS;
          - Worker;
          - Supabase;
          - отсутствие очевидных регрессий;
          - соответствие поставленной задаче.

          Используй реальное содержимое файлов и реальный git diff.

          В конце обязательно напиши одну строку:

          RESULT: PASS

          или

          RESULT: FAIL

          Если FAIL — подробно объясни проблему.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          РЕПОЗИТОРИЙ:

          {repo_text()}

          GIT DIFF:

          {run("git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md")}
          """
              )

              print(result)

              if "RESULT: PASS" in result:
                  return True, result

              return False, result

          def run_reviewer():
              print()
              print("========================================")
              print("REVIEWER")
              print("========================================")

              result = ask_ai(
                  """
          Ты Reviewer Agent проекта LORGUS.

          Проверь реальные изменения в репозитории.

          Проверяй:
          - логику;
          - безопасность;
          - JavaScript;
          - Supabase;
          - Cloudflare Worker;
          - регрессии;
          - лишние изменения;
          - соответствие архитектуре.

          Особенно проверь:
          - секреты;
          - service-role ключи;
          - пользовательские данные;
          - XSS;
          - неправильные права;
          - ошибки API.

          В конце обязательно напиши:

          RESULT: APPROVE

          или

          RESULT: REJECT

          Если REJECT — подробно укажи проблемы.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          РЕПОЗИТОРИЙ:

          {repo_text()}

          GIT DIFF:

          {run("git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md")}
          """
              )

              print(result)

              if "RESULT: APPROVE" in result:
                  return True, result

              return False, result

          for attempt in range(3):

              print()
              print("========================================")
              print(f"VALIDATION PASS {attempt + 1}")
              print("========================================")

              qa_ok, qa_result = run_qa()
              reviewer_ok, reviewer_result = run_reviewer()

              if qa_ok and reviewer_ok:
                  print()
                  print("========================================")
                  print("PIPELINE RESULT: APPROVED")
                  print("========================================")

                  print()
                  print("FINAL DIFF:")
                  print(
                      run(
                          "git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md"
                      )
                  )

                  sys.exit(0)

              if attempt == 2:
                  print()
                  print("========================================")
                  print("PIPELINE RESULT: FAILED")
                  print("========================================")

                  sys.exit(1)

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_raw = ask_ai(
                  """
          Ты Fixer Agent проекта LORGUS.

          QA или Reviewer нашли проблему.

          Исправь проблему в реальном коде.

          НЕ создавай git diff.

          Верни ТОЛЬКО JSON:

          {
            "changes": [
              {
                "path": "README.md",
                "content": "ПОЛНОЕ НОВОЕ СОДЕРЖИМОЕ ФАЙЛА"
              }
            ]
          }

          content должен быть полным содержимым файла.

          Если изменений не требуется:

          {
            "changes": []
          }

          Разрешённые файлы:

          README.md
          index.html
          app.js
          style.css
          worker.js
          wrangler.toml
          docs/PROJECT.md

          Без Markdown.
          Без ```json.
          Без пояснений.
          """,
                  f"""
          ЗАДАЧА:

          {TASK}

          АРХИТЕКТ:

          {architect}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:

          {repo_text()}

          QA:

          {qa_result}

          REVIEWER:

          {reviewer_result}

          ТЕКУЩИЙ GIT DIFF:

          {run("git diff -- README.md index.html app.js style.css worker.js wrangler.toml docs/PROJECT.md")}
          """
              )

              fixer = clean_json(fixer_raw)

              print(json.dumps(
                  fixer,
                  ensure_ascii=False,
                  indent=2
              ))

              apply_changes(fixer, "FIXER")

          PY
