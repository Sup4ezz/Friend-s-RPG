name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI pipeline
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error

          TASK = os.environ["TASK"]
          API_KEY = os.environ["OPENROUTER_API_KEY"]
          MODEL = "openrouter/free"

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          def run_cmd(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          def ask_ai(prompt):
              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ]
              }

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=180
                  ) as response:
                      data = json.loads(
                          response.read().decode()
                      )

                  return data["choices"][0]["message"]["content"]

              except urllib.error.HTTPError as e:
                  print(e.read().decode())
                  raise

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines).strip()

              return text

          def parse_json(text):
              text = clean_json(text)

              try:
                  return json.loads(text)
              except Exception:
                  start = text.find("{")
                  end = text.rfind("}")

                  if start == -1 or end == -1:
                      raise RuntimeError(
                          "AI returned invalid JSON:\n" + text
                      )

                  return json.loads(
                      text[start:end + 1]
                  )

          def read_repository():
              files = {}

              for path in ALLOWED_FILES:
                  if os.path.exists(path):
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          files[path] = f.read()

              return files

          def repository_text():
              repo = read_repository()
              parts = []

              for path, content in repo.items():
                  parts.append(
                      f"\n===== {path} =====\n{content}\n"
                  )

              return "\n".join(parts)

          def apply_changes(changes):
              for change in changes:
                  path = change.get("path")
                  content_lines = change.get(
                      "content_lines"
                  )

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"AI attempted to modify "
                          f"forbidden file: {path}"
                      )

                  if not isinstance(
                      content_lines,
                      list
                  ):
                      raise RuntimeError(
                          f"Invalid content_lines "
                          f"for {path}"
                      )

                  content = "\n".join(
                      str(line)
                      for line in content_lines
                  )

                  with open(
                      path,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(content)

                  print(
                      f"UPDATED: {path}"
                  )

          def git_diff():
              return run_cmd(
                  "git diff -- "
                  + " ".join(
                      ALLOWED_FILES
                  )
              )

          print("=" * 60)
          print("LORGUS AI PIPELINE")
          print("=" * 60)
          print()
          print("TASK:")
          print(TASK)
          print()

          initial_repository = repository_text()

          # ==========================================================
          # ARCHITECT
          # ==========================================================

          print("=" * 60)
          print("ARCHITECT")
          print("=" * 60)

          architect_prompt = f"""
          Ты Architect Agent проекта LORGUS.

          Репозиторий является единственным источником истины.

          Твоя задача — только проанализировать задачу.
          Никаких изменений файлов.
          Никакого diff.
          Никакого кода вместо архитектурного плана.

          ЗАДАЧА:
          {TASK}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:
          {initial_repository}

          Проанализируй:

          1. Что именно требуется изменить.
          2. Какие файлы затронуты.
          3. Что уже существует.
          4. Какие зависимости существуют.
          5. Какие изменения действительно необходимы.
          6. Какие риски возможны.
          7. Как проверить результат.

          Верни обычный текстовый архитектурный план.
          """

          architect = ask_ai(
              architect_prompt
          )

          print(architect)
          print()

          # ==========================================================
          # CODER
          # ==========================================================

          print("=" * 60)
          print("CODER")
          print("=" * 60)

          coder_prompt = f"""
          Ты Coder Agent проекта LORGUS.

          Ты работаешь с реальным текущим состоянием
          репозитория.

          ЗАДАЧА:
          {TASK}

          АРХИТЕКТУРНЫЙ ПЛАН:
          {architect}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:
          {repository_text()}

          Правила:

          1. Изучи существующий код.
          2. Измени только необходимые файлы.
          3. Не изменяй файлы, которые не относятся к задаче.
          4. Не удаляй существующую функциональность.
          5. Не переписывай файл целиком без необходимости.
          6. Не переводи существующий текст на другой язык.
          7. Сохраняй существующий язык, форматирование и стиль.
          8. Не меняй существующий контент,
             если этого не требует задача.
          9. Не добавляй секреты.
          10. Не меняй .ai файлы.
          11. Если нужная функциональность уже существует,
              не переписывай её без причины.

          Верни ТОЛЬКО JSON:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "полное новое содержимое файла"
                ]
              }}
            ]
          }}

          content_lines должен содержать ПОЛНОЕ содержимое
          изменяемого файла, построчно.

          Если изменений не требуется:

          {{
            "changes": []
          }}
          """

          coder_raw = ask_ai(
              coder_prompt
          )

          coder = parse_json(
              coder_raw
          )

          if "changes" not in coder:
              raise RuntimeError(
                  "Coder JSON has no changes field"
              )

          apply_changes(
              coder["changes"]
          )

          print()
          print("ACTUAL GIT DIFF")
          print(git_diff())

          # ==========================================================
          # VALIDATION LOOP
          # ==========================================================

          approved = False

          for validation_pass in range(1, 4):

              print()
              print("=" * 60)
              print(
                  f"VALIDATION PASS {validation_pass}"
              )
              print("=" * 60)

              current_repository = repository_text()
              current_diff = git_diff()

              # ======================================================
              # QA
              # ======================================================

              print()
              print("QA")

              qa_prompt = f"""
              Ты QA Agent проекта LORGUS.

              Проверь реальное текущее состояние
              репозитория после изменений.

              ЗАДАЧА:
              {TASK}

              ТЕКУЩИЙ РЕПОЗИТОРИЙ:
              {current_repository}

              ACTUAL GIT DIFF:
              {current_diff}

              Важно:

              ACTUAL GIT DIFF показывает только изменения
              относительно исходного состояния.

              CURRENT REPOSITORY показывает полное текущее
              содержимое файлов.

              Если требуемый элемент уже существовал до изменения,
              его отсутствие в diff НЕ означает,
              что его нет в текущем файле.

              Проверь:

              1. Выполнена ли задача.
              2. Не сломана ли существующая функциональность.
              3. Нет ли ошибок JavaScript.
              4. Нет ли ошибок HTML/CSS.
              5. Нет ли проблем API.
              6. Нет ли проблем Supabase.
              7. Нет ли проблем Cloudflare Worker.
              8. Не изменены ли несвязанные файлы.
              9. Не изменён ли существующий контент без причины.

              Если всё корректно:

              {{
                "result": "PASS",
                "problems": []
              }}

              Если есть проблемы:

              {{
                "result": "FAIL",
                "problems": [
                  {{
                    "file": "README.md",
                    "problem": "описание проблемы",
                    "required_change": "что исправить"
                  }}
                ]
              }}

              Верни ТОЛЬКО JSON.
              """

              qa_raw = ask_ai(
                  qa_prompt
              )

              qa = parse_json(
                  qa_raw
              )

              print(
                  json.dumps(
                      qa,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              # ======================================================
              # FIXER AFTER QA
              # ======================================================

              if qa.get("result") == "FAIL":

                  print()
                  print("FIXER")

                  fixer_prompt = f"""
                  Ты Fixer Agent проекта LORGUS.

                  Исправь только проблемы, найденные QA.

                  ЗАДАЧА:
                  {TASK}

                  QA:
                  {json.dumps(
                      qa,
                      ensure_ascii=False,
                      indent=2
                  )}

                  ТЕКУЩИЙ РЕПОЗИТОРИЙ:
                  {repository_text()}

                  Правила:

                  1. Исправляй только указанные проблемы.
                  2. Не переписывай проект.
                  3. Не переводи существующий текст.
                  4. Сохраняй язык файлов.
                  5. Сохраняй существующее содержимое.
                  6. Не меняй несвязанные части.
                  7. Не делай рефакторинг без необходимости.
                  8. Если проблема уже исправлена —
                     верни changes: [].
                  9. Если QA ошибся и проблема основана
                     только на неправильном чтении diff —
                     не вноси бессмысленные изменения.

                  Верни ТОЛЬКО JSON:

                  {{
                    "changes": [
                      {{
                        "path": "README.md",
                        "content_lines": [
                          "полное содержимое файла"
                        ]
                      }}
                    ]
                  }}

                  Если исправления не нужны:

                  {{
                    "changes": []
                  }}
                  """

                  fixer_raw = ask_ai(
                      fixer_prompt
                  )

                  fixer = parse_json(
                      fixer_raw
                  )

                  apply_changes(
                      fixer.get(
                          "changes",
                          []
                      )
                  )

                  print(
                      "FIXER: changes applied"
                  )

                  continue

              # ======================================================
              # REVIEWER
              # ======================================================

              print()
              print("REVIEWER")

              current_repository = repository_text()
              current_diff = git_diff()

              reviewer_prompt = f"""
              Ты Reviewer Agent проекта LORGUS.

              Проведи финальное ревью реального состояния
              репозитория.

              ЗАДАЧА:
              {TASK}

              CURRENT REPOSITORY:
              {current_repository}

              ACTUAL GIT DIFF:
              {current_diff}

              Важно:

              ACTUAL GIT DIFF показывает только изменения
              относительно исходного состояния.

              CURRENT REPOSITORY показывает полное состояние
              файлов.

              Поэтому отсутствие элемента в diff НЕ означает,
              что этого элемента нет в файле.

              Проверь:

              1. Выполнена ли задача.
              2. Соответствует ли реализация задаче.
              3. Сохранилась ли существующая функциональность.
              4. Нет ли лишних изменений.
              5. Нет ли изменения языка существующего текста.
              6. Нет ли проблем безопасности.
              7. Нет ли проблем Supabase.
              8. Нет ли проблем Cloudflare Worker.
              9. Нет ли JavaScript ошибок.
              10. Нет ли регрессий.

              Не отклоняй изменение только потому,
              что часть требуемого результата уже существовала
              до начала работы.

              APPROVE:

              {{
                "result": "APPROVE",
                "summary": "описание",
                "problems": []
              }}

              REJECT:

              {{
                "result": "REJECT",
                "summary": "описание",
                "problems": [
                  {{
                    "file": "README.md",
                    "problem": "описание",
                    "required_change": "необходимое исправление"
                  }}
                ]
              }}

              Верни ТОЛЬКО JSON.
              """

              reviewer_raw = ask_ai(
                  reviewer_prompt
              )

              reviewer = parse_json(
                  reviewer_raw
              )

              print(
                  json.dumps(
                      reviewer,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              # ======================================================
              # FIXER AFTER REVIEWER
              # ======================================================

              if reviewer.get("result") == "REJECT":

                  print()
                  print("FIXER")

                  fixer_prompt = f"""
                  Ты Fixer Agent проекта LORGUS.

                  Reviewer отклонил текущий результат.

                  ЗАДАЧА:
                  {TASK}

                  REVIEWER:
                  {json.dumps(
                      reviewer,
                      ensure_ascii=False,
                      indent=2
                  )}

                  ТЕКУЩИЙ РЕПОЗИТОРИЙ:
                  {repository_text()}

                  Правила:

                  1. Исправляй только проблемы Reviewer.
                  2. Не переписывай проект.
                  3. Не переводи существующий текст.
                  4. Сохраняй язык файлов.
                  5. Сохраняй существующее содержимое.
                  6. Не меняй несвязанные части.
                  7. Не делай рефакторинг без необходимости.
                  8. Проверь проблему по полному текущему
                     содержимому файла.
                  9. Если проблема уже исправлена —
                     changes должен быть пустым.
                  10. Если Reviewer ошибся из-за неправильного
                      понимания diff — не делай бессмысленных
                      изменений.

                  Верни ТОЛЬКО JSON:

                  {{
                    "changes": [
                      {{
                        "path": "README.md",
                        "content_lines": [
                          "полное содержимое файла"
                        ]
                      }}
                    ]
                  }}

                  Если исправления не нужны:

                  {{
                    "changes": []
                  }}
                  """

                  fixer_raw = ask_ai(
                      fixer_prompt
                  )

                  fixer = parse_json(
                      fixer_raw
                  )

                  apply_changes(
                      fixer.get(
                          "changes",
                          []
                      )
                  )

                  print(
                      "FIXER: changes applied"
                  )

                  continue

              approved = True

              print()
              print("PIPELINE RESULT: APPROVED")

              break

          # ==========================================================
          # FINAL CHECK
          # ==========================================================

          if not approved:
              print()
              print(
                  "PIPELINE FAILED: maximum validation passes reached"
              )
              raise SystemExit(1)

          print()
          print("=" * 60)
          print("FINAL DIFF")
          print("=" * 60)

          final_diff = git_diff()
          print(final_diff)

          # ==========================================================
          # COMMIT + PUSH
          # ==========================================================

          if final_diff.strip():

              print()
              print("=" * 60)
              print("COMMIT + PUSH")
              print("=" * 60)

              run_cmd(
                  'git config user.name "LORGUS AI"'
              )

              run_cmd(
                  'git config user.email '
                  '"lorgus-ai@users.noreply.github.com"'
              )

              run_cmd(
                  "git add -- "
                  + " ".join(ALLOWED_FILES)
              )

              run_cmd(
                  'git commit -m "AI: update LORGUS project"'
              )

              run_cmd(
                  "git push origin HEAD"
              )

              print(
                  "PUSH SUCCESSFUL"
              )

          else:
              print()
              print(
                  "NO CHANGES TO COMMIT"
              )

          print()
          print("=" * 60)
          print("LORGUS AI PIPELINE FINISHED")
          print("=" * 60)
          PY
````
