name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ask AI
        env:
          API: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          def read_file(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return f.read()
              except Exception as e:
                  return f"[FILE NOT FOUND: {e}]"

          files = [
              ".ai/AGENT.md",
              ".ai/ARCHITECT.md",
              ".ai/CODER.md",
              ".ai/REVIEWER.md",
              ".ai/QA.md",
              "docs/PROJECT.md",
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml"
          ]

          context = ""

          for file in files:
              context += f"\n\n===== {file} =====\n"
              context += read_file(file)

          prompt = f"""Ты работаешь непосредственно с репозиторием LORGUS.

          Ниже находится реальное содержимое файлов репозитория.

          {context}

          Задача пользователя:

          {os.environ["TASK"]}

          ВАЖНО:
          - Используй только фактическое содержимое файлов выше.
          - Не придумывай существование функций, API или компонентов.
          - Если информации нет в файлах, так и скажи.
          - Ничего не изменяй.
          - Дай конкретный анализ задачи.
          """

          data = {
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ]
          }

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["API"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  raw = response.read().decode("utf-8")
                  print("HTTP STATUS:", response.status)
                  print("RAW RESPONSE:")
                  print(raw)

                  result = json.loads(raw)

          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print(e.read().decode("utf-8"))
              raise

          if "choices" not in result:
              raise RuntimeError("OpenRouter response does not contain choices")

          if not result["choices"]:
              raise RuntimeError("OpenRouter returned empty choices")

          message = result["choices"][0].get("message", {})
          content = message.get("content")

          if not content:
              raise RuntimeError(
                  "OpenRouter returned an empty message content"
              )

          print("\n===== AI RESPONSE =====\n")
          print(content)
          PY
