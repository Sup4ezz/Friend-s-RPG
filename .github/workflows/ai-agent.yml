name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ask AI
        env:
          API: ${{ secrets.API }}
          TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open(".ai/AGENT.md", encoding="utf-8") as f:
              agent = f.read()

          with open("docs/PROJECT.md", encoding="utf-8") as f:
              project = f.read()

          prompt = f"""Ты работаешь над проектом LORGUS.

          Общие правила:
          {agent}

          Описание проекта:
          {project}

          Задача пользователя:
          {os.environ["TASK"]}

          Пока ничего не изменяй.
          Проанализируй задачу и дай конкретный план действий.
          """

          data = {
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ]
          }

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(data).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["API"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          print(result["choices"][0]["message"]["content"])
          PY
