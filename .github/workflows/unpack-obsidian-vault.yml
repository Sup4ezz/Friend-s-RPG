name: Unpack Obsidian Vault

on:
  push:
    branches: [main]
    paths:
      - "Obsidian Vault.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack vault
        run: |
          rm -rf "Obsidian Vault"
          mkdir -p "Obsidian Vault"
          unzip -q "Obsidian Vault.zip" -d "Obsidian Vault"

      - name: Commit unpacked vault
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Obsidian Vault"
          git diff --cached --quiet || git commit -m "chore: unpack Obsidian vault"
          git push
