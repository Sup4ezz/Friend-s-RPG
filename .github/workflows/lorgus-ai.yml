name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for LORGUS AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run LORGUS AI pipeline
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          API_KEY = os.environ.get("GROQ_API_KEY")
          MODEL = os.environ.get("GROQ_MODEL", "openai/gpt-oss-120b")
          TASK = os.environ.get("USER_TASK", "").strip()

          if not API_KEY:
              raise RuntimeError(
                  "Missing GitHub Secret 'API'. "
                  "Put the Groq API key into Settings -> Secrets and variables -> Actions."
              )

          if not TASK:
              raise RuntimeError("USER_TASK is empty.")

          API_URL = "https://api.groq.com/openai/v1/chat/completions"

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md",
          }

          MAX_RETRIES = 2

          def run_cmd(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed:\n{command}\n\n"
                      f"STDOUT:\n{result.stdout}\n\n"
                      f"STDERR:\n{result.stderr}"
                  )

              return result.stdout

          def get_file(path):
              if not os.path.isfile(path):
                  return None

              with open(path, "r", encoding="utf-8") as f:
                  return f.read()

          def repository_files():
              result = {}

              for path in sorted(ALLOWED_FILES):
                  content = get_file(path)

                  if content is not None:
                      result[path] = content

              return result

          def git_status():
              return run_cmd(
                  "git status --short"
              )

          def git_diff():
              return run_cmd(
                  "git diff -- README.md index.html app.js style.css "
                  "worker.js wrangler.toml docs/PROJECT.md"
              )

          def changed_files():
              output = run_cmd(
                  "git diff --name-only -- "
                  "README.md index.html app.js style.css "
                  "worker.js wrangler.toml docs/PROJECT.md"
              )

              return [
                  line.strip()
                  for line in output.splitlines()
                  if line.strip()
              ]

          def relevant_files(task):
              task_lower = task.lower()

              keywords = {
                  "README.md": [
                      "readme",
                      "документац",
                      "описан"
                  ],
                  "index.html": [
                      "html",
                      "страниц",
                      "интерфейс",
                      "ui",
                      "кнопк",
                      "форма"
                  ],
                  "app.js": [
                      "javascript",
                      "js",
                      "логик",
                      "supabase",
                      "auth",
                      "авторизац",
                      "персонаж",
                      "admin",
                      "админ"
                  ],
                  "style.css": [
                      "css",
                      "стиль",
                      "цвет",
                      "дизайн",
                      "размер",
                      "layout"
                  ],
                  "worker.js": [
                      "worker",
                      "cloudflare",
                      "api",
                      "endpoint",
                      "запрос"
                  ],
                  "wrangler.toml": [
                      "wrangler",
                      "cloudflare",
                      "deploy",
                      "assets",
                      "binding"
                  ],
                  "docs/PROJECT.md": [
                      "project",
                      "архитектур",
                      "документац"
                  ]
              }

              selected = []

              for path, words in keywords.items():
                  if any(word in task_lower for word in words):
                      selected.append(path)

              if not selected:
                  selected = [
                      "README.md",
                      "index.html",
                      "app.js",
                      "style.css",
                      "worker.js",
                      "wrangler.toml",
                      "docs/PROJECT.md"
                  ]

              return selected

          def format_files(paths):
              files = repository_files()
              output = []

              for path in paths:
                  if path not in files:
                      continue

                  output.append(
                      f"===== FILE: {path} =====\n"
                      f"{files[path]}\n"
                      f"===== END FILE: {path} ====="
                  )

              return "\n\n".join(output)

          def call_ai(messages, max_tokens=2500):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_completion_tokens": max_tokens,
                  "reasoning_effort": "low"
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, MAX_RETRIES + 1):
                  request = urllib.request.Request(
                      API_URL,
                      data=data,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:
                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                          return result["choices"][0]["message"]["content"]

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"\nGroq HTTP {error.code} "
                          f"(attempt {attempt}/{MAX_RETRIES})"
                      )
                      print(body)

                      if error.code == 429:
                          retry_after = error.headers.get(
                              "retry-after"
                          )

                          if retry_after:
                              try:
                                  delay = min(
                                      int(float(retry_after)),
                                      60
                                  )
                              except ValueError:
                                  delay = 10
                          else:
                              delay = 10

                          if attempt < MAX_RETRIES:
                              print(
                                  f"Rate limit. Waiting {delay} seconds..."
                              )
                              time.sleep(delay)
                              continue

                          raise RuntimeError(
                              "Groq rate limit reached. "
                              "Check the current Free Plan limits."
                          )

                      if error.code in (401, 403):
                          raise RuntimeError(
                              "Groq authentication failed. "
                              "Check GitHub Secret 'API'."
                          )

                      if attempt < MAX_RETRIES:
                          time.sleep(3)
                          continue

                      raise RuntimeError(
                          f"Groq returned HTTP {error.code}."
                      )

                  except Exception as error:
                      print(
                          f"\nGroq request error "
                          f"(attempt {attempt}/{MAX_RETRIES}): {error}"
                      )

                      if attempt < MAX_RETRIES:
                          time.sleep(3)
                          continue

                      raise

          def extract_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )

                  text = re.sub(
                      r"\s*```$",
                      "",
                      text
                  )

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1:
                  raise RuntimeError(
                      "AI did not return a JSON object.\n\n"
                      + text
                  )

              candidate = text[start:end + 1]

              try:
                  return json.loads(candidate)
              except json.JSONDecodeError as error:
                  raise RuntimeError(
                      "AI returned invalid JSON.\n\n"
                      f"{error}\n\n"
                      f"Response:\n{candidate}"
                  )

          def validate_changes(data):
              if not isinstance(data, dict):
                  raise RuntimeError(
                      "Changes response is not an object."
                  )

              changes = data.get("changes")

              if not isinstance(changes, list):
                  raise RuntimeError(
                      "Missing 'changes' array."
                  )

              validated = []

              for change in changes:
                  if not isinstance(change, dict):
                      raise RuntimeError(
                          "Invalid change object."
                      )

                  path = change.get("path")
                  content_lines = change.get(
                      "content_lines"
                  )

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Forbidden file modification: {path}"
                      )

                  if not isinstance(
                      content_lines,
                      list
                  ):
                      raise RuntimeError(
                          f"content_lines must be a list: {path}"
                      )

                  if not all(
                      isinstance(line, str)
                      for line in content_lines
                  ):
                      raise RuntimeError(
                          f"All content_lines must be strings: {path}"
                      )

                  validated.append(
                      {
                          "path": path,
                          "content_lines": content_lines
                      }
                  )

              return validated

          def apply_changes(changes):
              for change in changes:
                  path = change["path"]

                  content = "\n".join(
                      change["content_lines"]
                  )

                  if not content.endswith("\n"):
                      content += "\n"

                  with open(
                      path,
                      "w",
                      encoding="utf-8"
                  ) as file:
                      file.write(content)

                  print(
                      f"UPDATED: {path}"
                  )

          def print_section(title, content):
              print("\n")
              print("=" * 80)
              print(title)
              print("=" * 80)
              print(content)
              print("=" * 80)

          # ============================================================
          # INITIAL REPOSITORY
          # ============================================================

          all_files = repository_files()

          relevant = relevant_files(TASK)

          relevant_context = format_files(
              relevant
          )

          print_section(
              "TASK",
              TASK
          )

          print_section(
              "RELEVANT FILES",
              relevant_context
          )

          # ============================================================
          # ARCHITECT
          # ============================================================

          architect_prompt = f"""
          You are the ARCHITECT Agent for LORGUS.

          Analyze the user's task and the provided real repository files.

          Do NOT modify files.
          Do NOT output code.
          Do NOT output a diff.

          Produce a concise implementation plan.

          Include only:

          - problem;
          - relevant files;
          - required changes;
          - files that must remain untouched;
          - risks;
          - verification.

          Do not invent files or functionality.

          USER TASK:
          {TASK}

          REPOSITORY:
          {relevant_context}
          """

          architect = call_ai(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are the LORGUS Architect. "
                          "Analyze only the supplied repository."
                      )
                  },
                  {
                      "role": "user",
                      "content": architect_prompt
                  }
              ],
              max_tokens=1800
          )

          print_section(
              "ARCHITECT",
              architect
          )

          # ============================================================
          # CODER
          # ============================================================

          coder_files = relevant_context

          coder_prompt = f"""
          You are the CODER Agent for LORGUS.

          Implement the user's task.

          IMPORTANT:

          - Preserve existing functionality.
          - Make the smallest possible change.
          - Do not rewrite unrelated code.
          - Do not modify files unrelated to the task.
          - Do not create new files.
          - Only modify allowed files.
          - Return ONLY JSON.
          - Do not return Markdown.
          - Do not return a git diff.
          - Changed files must contain COMPLETE final content.

          JSON:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "line 1",
                  "line 2"
                ]
              }}
            ]
          }}

          If no changes are required:

          {{
            "changes": []
          }}

          USER TASK:
          {TASK}

          ARCHITECT PLAN:
          {architect}

          FILES:
          {coder_files}
          """

          coder_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are the LORGUS Coding Agent. "
                          "Return valid JSON only."
                      )
                  },
                  {
                      "role": "user",
                      "content": coder_prompt
                  }
              ],
              max_tokens=6000
          )

          print_section(
              "CODER",
              coder_raw
          )

          coder_data = extract_json(
              coder_raw
          )

          coder_changes = validate_changes(
              coder_data
          )

          if coder_changes:
              apply_changes(
                  coder_changes
              )
          else:
              print(
                  "\nCODER: NO CHANGES"
              )

          # ============================================================
          # DIFF
          # ============================================================

          diff = git_diff()

          print_section(
              "DIFF AFTER CODER",
              diff or "NO DIFF"
          )

          if not diff.strip():
              print(
                  "\nNo changes were produced."
              )

              sys.exit(0)

          # ============================================================
          # QA
          # ============================================================

          changed = changed_files()

          qa_context = format_files(
              changed
          )

          qa_prompt = f"""
          You are QA for LORGUS.

          Check the actual changed repository.

          USER TASK:
          {TASK}

          ARCHITECT:
          {architect}

          CHANGED FILES:
          {qa_context}

          GIT DIFF:
          {diff}

          Determine whether the implementation actually satisfies
          the task.

          Check:

          - functionality;
          - JavaScript;
          - HTML;
          - CSS;
          - API;
          - Supabase;
          - Cloudflare Worker;
          - security;
          - regressions;
          - unrelated changes.

          Start your response with exactly one of:

          PASS

          or

          FAIL

          If FAIL, list concrete problems.
          """

          qa_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are the strict LORGUS QA Agent."
                      )
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              max_tokens=1800
          )

          print_section(
              "QA",
              qa_raw
          )

          qa_match = re.match(
              r"^\s*(PASS|FAIL)\b",
              qa_raw,
              re.IGNORECASE
          )

          if not qa_match:
              raise RuntimeError(
                  "QA did not start with PASS or FAIL."
              )

          qa_status = (
              qa_match.group(1).upper()
          )

          # ============================================================
          # REVIEWER
          # ============================================================

          reviewer_prompt = f"""
          You are the REVIEWER Agent for LORGUS.

          Review the actual implementation.

          USER TASK:
          {TASK}

          ARCHITECT:
          {architect}

          QA:
          {qa_raw}

          GIT DIFF:
          {diff}

          Review:

          - correctness;
          - security;
          - Supabase;
          - Cloudflare;
          - JavaScript;
          - regressions;
          - unrelated changes;
          - whether the requested task is actually complete.

          Start your response with exactly:

          APPROVE

          or

          REJECT

          If REJECT, list concrete problems.
          """

          reviewer_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": (
                          "You are the strict LORGUS Reviewer Agent."
                      )
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              max_tokens=1800
          )

          print_section(
              "REVIEWER",
              reviewer_raw
          )

          reviewer_match = re.match(
              r"^\s*(APPROVE|APPROVED|REJECT|REJECTED)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          if not reviewer_match:
              raise RuntimeError(
                  "Reviewer did not start with APPROVE or REJECT."
              )

          reviewer_status = (
              reviewer_match.group(1).upper()
          )

          reviewer_status = (
              "APPROVE"
              if reviewer_status.startswith("APPROVE")
              else "REJECT"
          )

          # ============================================================
          # FIXER
          # ============================================================

          if (
              qa_status == "FAIL"
              or reviewer_status == "REJECT"
          ):

              print(
                  "\nFIXER REQUIRED"
              )

              current_changed = changed_files()

              fixer_context = format_files(
                  current_changed
              )

              fixer_prompt = f"""
              You are the FIXER Agent for LORGUS.

              The implementation failed QA or Review.

              USER TASK:
              {TASK}

              ARCHITECT:
              {architect}

              QA:
              {qa_raw}

              REVIEWER:
              {reviewer_raw}

              CURRENT CHANGED FILES:
              {fixer_context}

              CURRENT DIFF:
              {git_diff()}

              Fix ONLY the concrete problems identified by QA
              or Reviewer.

              Preserve everything else.

              Rules:

              - no new files;
              - no unrelated changes;
              - only allowed files;
              - return JSON only;
              - no Markdown;
              - no git diff;
              - changed files must contain complete final content.

              JSON:

              {{
                "changes": [
                  {{
                    "path": "README.md",
                    "content_lines": [
                      "line 1",
                      "line 2"
                    ]
                  }}
                ]
              }}

              If no fix is needed:

              {{
                "changes": []
              }}
              """

              fixer_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the LORGUS Fixer Agent. "
                              "Return valid JSON only."
                          )
                      },
                      {
                          "role": "user",
                          "content": fixer_prompt
                      }
                  ],
                  max_tokens=6000
              )

              print_section(
                  "FIXER",
                  fixer_raw
              )

              fixer_data = extract_json(
                  fixer_raw
              )

              fixer_changes = validate_changes(
                  fixer_data
              )

              if fixer_changes:
                  apply_changes(
                      fixer_changes
                  )

              # ========================================================
              # FINAL QA
              # ========================================================

              final_changed = changed_files()

              final_context = format_files(
                  final_changed
              )

              final_diff = git_diff()

              final_qa_prompt = f"""
              Perform FINAL QA for LORGUS.

              USER TASK:
              {TASK}

              ORIGINAL QA:
              {qa_raw}

              ORIGINAL REVIEW:
              {reviewer_raw}

              CURRENT FILES:
              {final_context}

              CURRENT DIFF:
              {final_diff}

              Verify that the identified problems were actually fixed.

              Start exactly with:

              PASS

              or

              FAIL
              """

              final_qa_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final LORGUS QA Agent."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_qa_prompt
                      }
                  ],
                  max_tokens=1800
              )

              print_section(
                  "FINAL QA",
                  final_qa_raw
              )

              final_qa_match = re.match(
                  r"^\s*(PASS|FAIL)\b",
                  final_qa_raw,
                  re.IGNORECASE
              )

              if not final_qa_match:
                  raise RuntimeError(
                      "Final QA did not start with PASS or FAIL."
                  )

              if (
                  final_qa_match.group(1).upper()
                  == "FAIL"
              ):
                  raise RuntimeError(
                      "Final QA failed after Fixer."
                  )

              # ========================================================
              # FINAL REVIEW
              # ========================================================

              final_review_prompt = f"""
              Perform FINAL REVIEW of the LORGUS repository.

              USER TASK:
              {TASK}

              FINAL QA:
              {final_qa_raw}

              CURRENT DIFF:
              {git_diff()}

              Verify that the final repository satisfies the task.

              Start exactly with:

              APPROVE

              or

              REJECT
              """

              final_review_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": (
                              "You are the final LORGUS Reviewer Agent."
                          )
                      },
                      {
                          "role": "user",
                          "content": final_review_prompt
                      }
                  ],
                  max_tokens=1800
              )

              print_section(
                  "FINAL REVIEW",
                  final_review_raw
              )

              final_review_match = re.match(
                  r"^\s*(APPROVE|APPROVED|REJECT|REJECTED)\b",
                  final_review_raw,
                  re.IGNORECASE
              )

              if not final_review_match:
                  raise RuntimeError(
                      "Final Reviewer did not start with APPROVE or REJECT."
                  )

              final_review_status = (
                  final_review_match.group(1).upper()
              )

              if final_review_status.startswith(
                  "REJECT"
              ):
                  raise RuntimeError(
                      "Final Reviewer rejected the changes."
                  )

          else:
              print(
                  "\nQA + REVIEW PASSED"
              )

          # ============================================================
          # FINAL LOCAL CHECK
          # ============================================================

          run_cmd(
              "git diff --check"
          )

          final_diff = git_diff()

          print_section(
              "FINAL DIFF",
              final_diff or "NO CHANGES"
          )

          if not final_diff.strip():
              print(
                  "\nNothing to commit."
              )
              sys.exit(0)

          # ============================================================
          # COMMIT
          # ============================================================

          run_cmd(
              'git config user.name "LORGUS AI"'
          )

          run_cmd(
              'git config user.email "lorgus-ai@users.noreply.github.com"'
          )

          run_cmd(
              "git add -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          print_section(
              "FILES TO COMMIT",
              git_status()
          )

          run_cmd(
              'git commit -m "AI: update LORGUS project"'
          )

          run_cmd(
              "git push origin HEAD"
          )

          print("\n")
          print("=" * 80)
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("=" * 80)

          PY
