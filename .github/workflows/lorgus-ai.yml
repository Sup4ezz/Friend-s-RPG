name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODELS_URL: https://api.groq.com/openai/v1/models

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # GROQ DIAGNOSTICS
      # ------------------------------------------------------------

      - name: Groq preflight diagnostics
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("GROQ_API_KEY", "")
          model = os.environ.get("GROQ_MODEL", "")
          models_url = os.environ.get("GROQ_MODELS_URL", "")

          print("========================================")
          print("GROQ PREFLIGHT DIAGNOSTICS")
          print("========================================")

          if not key:
              print("ERROR: GitHub Secret 'API' is empty or unavailable.")
              print("The workflow cannot authenticate against Groq.")
              raise SystemExit(1)

          print(f"API key detected: YES")
          print(f"API key length: {len(key)}")
          print(f"Target model: {model}")
          print()

          request = urllib.request.Request(
              models_url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "User-Agent": "LORGUS-GitHub-Actions"
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8", errors="replace")

                  print(f"Models endpoint HTTP: {response.status}")
                  print("Models endpoint: OK")
                  print()

                  data = json.loads(body)
                  models = data.get("data", [])

                  ids = sorted(
                      item.get("id")
                      for item in models
                      if item.get("id")
                  )

                  print(f"Available models returned: {len(ids)}")

                  if model in ids:
                      print(f"Target model '{model}': AVAILABLE")
                  else:
                      print(f"Target model '{model}': NOT FOUND")
                      print()
                      print("Models containing 'gpt-oss':")

                      for model_id in ids:
                          if "gpt-oss" in model_id:
                              print(f"  - {model_id}")

                      print()
                      print("First available models:")

                      for model_id in ids[:30]:
                          print(f"  - {model_id}")

                      print()
                      print("The API key works, but the selected model")
                      print("is not available to this project/key.")

                      raise SystemExit(2)

          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")

              print(f"Models endpoint HTTP: {error.code}")
              print("Models endpoint: FAILED")
              print()
              print("Groq response body:")
              print(body)
              print()

              if error.code == 401:
                  print("DIAGNOSIS:")
                  print("HTTP 401 = invalid or missing authentication.")
              elif error.code == 403:
                  print("DIAGNOSIS:")
                  print("HTTP 403 = Groq rejected the request due to permissions.")
                  print()
                  print("This is NOT automatically an API-key authentication error.")
                  print("The response body above is the important diagnostic.")
                  print()
                  print("If the body contains:")
                  print("  model_permission_blocked_org")
                  print("or")
                  print("  model_permission_blocked_project")
                  print("then the model is blocked by Groq permissions.")
                  print()
                  print("If the body is only something like:")
                  print("  error code: 1010")
                  print("then this is NOT the normal documented model-permission")
                  print("response and needs separate investigation.")
              elif error.code == 429:
                  print("DIAGNOSIS:")
                  print("HTTP 429 = Groq rate limit exceeded.")
              else:
                  print("DIAGNOSIS:")
                  print("Unexpected Groq HTTP error.")

              raise SystemExit(3)

          except Exception as error:
              print("Unexpected diagnostic failure:")
              print(repr(error))
              raise SystemExit(4)
          PY

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Prepare Python
        run: python3 --version

      # ------------------------------------------------------------
      # MAIN AI PIPELINE
      # ------------------------------------------------------------

      - name: Run LORGUS AI agents
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          import subprocess

          GROQ_API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          TASK = os.environ["TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("TASK:")
          print(TASK)
          print()

          # ----------------------------------------------------------
          # HELPERS
          # ----------------------------------------------------------

          def run_command(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed with code {result.returncode}: {command}"
                  )

              return result.stdout

          def groq_call(messages, max_tokens):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens
              }

              data = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  GROQ_URL,
                  data=data,
                  headers={
                      "Authorization": f"Bearer {GROQ_API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "LORGUS-GitHub-Actions"
                  },
                  method="POST"
              )

              last_error = None

              for attempt in range(1, 3):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode(
                              "utf-8",
                              errors="replace"
                          )

                          result = json.loads(body)

                          return result["choices"][0]["message"]["content"]

                  except urllib.error.HTTPError as error:
                      body = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print()
                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/2)"
                      )
                      print("Response body:")
                      print(body)
                      print()

                      last_error = (
                          f"Groq HTTP {error.code}: {body}"
                      )

                      if error.code in (401, 403):
                          break

                      if error.code == 429:
                          time.sleep(5)
                          continue

                      time.sleep(3)

                  except Exception as error:
                      print(
                          f"Groq request error "
                          f"(attempt {attempt}/2): {error}"
                      )

                      last_error = str(error)
                      time.sleep(3)

              raise RuntimeError(last_error or "Groq request failed")

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )

                  text = re.sub(
                      r"\s*```$",
                      "",
                      text
                  )

              return text.strip()

          def read_file(path):
              with open(path, "r", encoding="utf-8") as f:
                  return f.read()

          def write_file(path, content_lines):
              content = "\n".join(content_lines)

              if not content.endswith("\n"):
                  content += "\n"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          def repo_snapshot():
              files = {}

              for path in sorted(ALLOWED_FILES):
                  if os.path.isfile(path):
                      files[path] = read_file(path)

              return files

          def relevant_files(task):
              task_lower = task.lower()

              selected = set()

              mapping = {
                  "readme": ["README.md"],
                  "html": ["index.html"],
                  "страниц": ["index.html"],
                  "интерфейс": ["index.html", "style.css", "app.js"],
                  "ui": ["index.html", "style.css", "app.js"],
                  "css": ["style.css"],
                  "стиль": ["style.css"],
                  "javascript": ["app.js"],
                  "js": ["app.js"],
                  "логик": ["app.js"],
                  "supabase": ["app.js", "worker.js", "wrangler.toml"],
                  "cloudflare": ["worker.js", "wrangler.toml"],
                  "worker": ["worker.js", "wrangler.toml"],
                  "wrangler": ["wrangler.toml"],
                  "конфиг": ["wrangler.toml"],
                  "докум": ["docs/PROJECT.md"],
                  "архитект": ["docs/PROJECT.md"],
                  "проект": ["docs/PROJECT.md"]
              }

              for keyword, paths in mapping.items():
                  if keyword in task_lower:
                      selected.update(paths)

              if not selected:
                  selected = set(ALLOWED_FILES)

              return sorted(selected)

          # ----------------------------------------------------------
          # FILE CONTEXT
          # ----------------------------------------------------------

          selected = relevant_files(TASK)

          print("Relevant files:")
          for path in selected:
              print(f"  - {path}")

          print()

          snapshot = repo_snapshot()

          def context_for(paths):
              parts = []

              for path in paths:
                  if path in snapshot:
                      parts.append(
                          f"\n===== FILE: {path} =====\n"
                          f"{snapshot[path]}"
                          f"\n===== END FILE: {path} =====\n"
                      )

              return "\n".join(parts)

          context = context_for(selected)

          # ----------------------------------------------------------
          # ARCHITECT
          # ----------------------------------------------------------

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect_prompt = f"""
          Ты Architect Agent проекта LORGUS.

          Проанализируй реальный код репозитория перед изменениями.

          ЗАДАЧА:
          {TASK}

          Текущие файлы:
          {context}

          Ничего не изменяй.

          Верни только JSON:

          {{
            "problem": "...",
            "cause": "...",
            "files": ["..."],
            "plan": ["..."],
            "risks": ["..."],
            "checks": ["..."]
          }}

          Не создавай diff.
          Не возвращай код.
          Не придумывай отсутствующие файлы.
          """

          architect_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": open(".ai/AGENT.md", encoding="utf-8").read()
                  },
                  {
                      "role": "user",
                      "content": architect_prompt
                  }
              ],
              1800
          )

          architect_raw = clean_json(architect_raw)

          try:
              architect = json.loads(architect_raw)
          except Exception:
              print("ARCHITECT returned invalid JSON:")
              print(architect_raw)
              raise

          print(json.dumps(
              architect,
              ensure_ascii=False,
              indent=2
          ))

          # ----------------------------------------------------------
          # CODER
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_prompt = f"""
          Ты Coding Agent проекта LORGUS.

          ЗАДАЧА:
          {TASK}

          ПЛАН ARCHITECT:
          {json.dumps(architect, ensure_ascii=False, indent=2)}

          ТЕКУЩИЕ ФАЙЛЫ:
          {context}

          Изучи существующий код и внеси минимальные необходимые изменения.

          Разрешённые файлы:
          {sorted(ALLOWED_FILES)}

          Верни ТОЛЬКО JSON следующего формата:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "полное",
                  "новое",
                  "содержимое",
                  "файла"
                ]
              }}
            ]
          }}

          ВАЖНО:

          - content_lines содержит ПОЛНОЕ содержимое файла;
          - не используй unified diff;
          - не используй markdown fences;
          - не меняй несвязанные файлы;
          - не удаляй существующую функциональность;
          - если изменений не требуется, верни {{"changes":[]}};
          - каждый path обязан находиться в списке разрешённых файлов.
          """

          coder_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": open(".ai/CODER.md", encoding="utf-8").read()
                  },
                  {
                      "role": "user",
                      "content": coder_prompt
                  }
              ],
              6000
          )

          coder_raw = clean_json(coder_raw)

          try:
              coder = json.loads(coder_raw)
          except Exception:
              print("CODER returned invalid JSON:")
              print(coder_raw)
              raise

          changes = coder.get("changes", [])

          for change in changes:
              path = change.get("path")
              lines = change.get("content_lines")

              if path not in ALLOWED_FILES:
                  raise RuntimeError(
                      f"Coder attempted to modify forbidden file: {path}"
                  )

              if not isinstance(lines, list):
                  raise RuntimeError(
                      f"Invalid content_lines for {path}"
                  )

              write_file(path, lines)

          # ----------------------------------------------------------
          # DIFF
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("CURRENT DIFF")
          print("========================================")

          run_command(
              "git diff -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          run_command("git diff --check")

          # ----------------------------------------------------------
          # QA
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("QA")
          print("========================================")

          current = repo_snapshot()

          qa_context = context_for(
              sorted(set(selected) | set(
                  change.get("path")
                  for change in changes
                  if change.get("path") in ALLOWED_FILES
              ))
          )

          qa_prompt = f"""
          Ты QA Agent проекта LORGUS.

          ЗАДАЧА:
          {TASK}

          ИЗМЕНЕНИЯ CODER:
          {json.dumps(coder, ensure_ascii=False, indent=2)}

          ТЕКУЩИЕ ФАЙЛЫ ПОСЛЕ ИЗМЕНЕНИЙ:
          {qa_context}

          Проверь реальные изменения.

          Проверь:
          - синтаксис;
          - JavaScript;
          - HTML;
          - CSS;
          - Cloudflare Worker;
          - Supabase;
          - регрессии;
          - соответствие задаче.

          Верни первую строку строго:

          PASS

          или

          FAIL

          После неё объяснение.
          """

          qa_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": open(".ai/QA.md", encoding="utf-8").read()
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              1800
          )

          print(qa_raw)

          qa_pass = bool(
              re.match(
                  r"^\s*PASS\b",
                  qa_raw,
                  re.IGNORECASE
              )
          )

          # ----------------------------------------------------------
          # REVIEWER
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("REVIEWER")
          print("========================================")

          reviewer_prompt = f"""
          Ты Reviewer Agent проекта LORGUS.

          ЗАДАЧА:
          {TASK}

          ИЗМЕНЕНИЯ:
          {json.dumps(coder, ensure_ascii=False, indent=2)}

          QA:
          {qa_raw}

          ТЕКУЩИЙ DIFF:
          {run_command(
              "git diff -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )}

          Проверь реальные изменения.

          Особое внимание:
          - безопасность;
          - Supabase;
          - Cloudflare;
          - XSS;
          - секреты;
          - регрессии;
          - несвязанные изменения.

          Первая строка должна быть:

          APPROVE

          или

          REJECT
          """

          reviewer_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": open(".ai/REVIEWER.md", encoding="utf-8").read()
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              1800
          )

          print(reviewer_raw)

          reviewer_match = re.match(
              r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          reviewer_status = ""

          if reviewer_match:
              reviewer_status = reviewer_match.group(1).upper()

          reviewer_reject = reviewer_status.startswith("REJECT")

          # ----------------------------------------------------------
          # FIXER
          # ----------------------------------------------------------

          if (not qa_pass) or reviewer_reject:

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_prompt = f"""
              Ты Fixer Agent проекта LORGUS.

              ЗАДАЧА:
              {TASK}

              CODER:
              {json.dumps(coder, ensure_ascii=False, indent=2)}

              QA:
              {qa_raw}

              REVIEWER:
              {reviewer_raw}

              ТЕКУЩИЕ ФАЙЛЫ:
              {repo_snapshot()}

              Исправь только проблемы, найденные QA или Reviewer.

              Верни ТОЛЬКО JSON:

              {{
                "changes": [
                  {{
                    "path": "README.md",
                    "content_lines": [
                      "полное",
                      "исправленное",
                      "содержимое"
                    ]
                  }}
                ]
              }}

              Не используй diff.
              Не меняй несвязанные файлы.
              """

              fixer_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": open(".ai/CODER.md", encoding="utf-8").read()
                      },
                      {
                          "role": "user",
                          "content": fixer_prompt
                      }
                  ],
                  6000
              )

              fixer_raw = clean_json(fixer_raw)

              try:
                  fixer = json.loads(fixer_raw)
              except Exception:
                  print("FIXER returned invalid JSON:")
                  print(fixer_raw)
                  raise

              for change in fixer.get("changes", []):

                  path = change.get("path")
                  lines = change.get("content_lines")

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Fixer attempted to modify forbidden file: {path}"
                      )

                  if not isinstance(lines, list):
                      raise RuntimeError(
                          f"Invalid content_lines for {path}"
                      )

                  write_file(path, lines)

              run_command("git diff --check")

              # ------------------------------------------------------
              # FINAL QA
              # ------------------------------------------------------

              print()
              print("========================================")
              print("FINAL QA")
              print("========================================")

              final_context = context_for(
                  sorted(
                      set(selected) |
                      {
                          p for p in ALLOWED_FILES
                          if os.path.isfile(p)
                      }
                  )
              )

              final_qa_prompt = f"""
              Ты финальный QA Agent проекта LORGUS.

              ЗАДАЧА:
              {TASK}

              Предыдущий QA:
              {qa_raw}

              Предыдущий Reviewer:
              {reviewer_raw}

              Текущие файлы:
              {final_context}

              Проверь, что первоначальная задача выполнена
              и проблемы QA/Reviewer исправлены.

              Первая строка строго:

              PASS

              или

              FAIL
              """

              final_qa_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": open(".ai/QA.md", encoding="utf-8").read()
                      },
                      {
                          "role": "user",
                          "content": final_qa_prompt
                      }
                  ],
                  1800
              )

              print(final_qa_raw)

              if not re.match(
                  r"^\s*PASS\b",
                  final_qa_raw,
                  re.IGNORECASE
              ):
                  raise RuntimeError(
                      "Final QA returned FAIL."
                  )

              # ------------------------------------------------------
              # FINAL REVIEW
              # ------------------------------------------------------

              print()
              print("========================================")
              print("FINAL REVIEW")
              print("========================================")

              final_diff = run_command(
                  "git diff -- README.md index.html app.js style.css "
                  "worker.js wrangler.toml docs/PROJECT.md"
              )

              final_review_prompt = f"""
              Ты финальный Reviewer Agent проекта LORGUS.

              ЗАДАЧА:
              {TASK}

              FINAL QA:
              {final_qa_raw}

              FINAL DIFF:
              {final_diff}

              Проверь итоговый diff.

              Первая строка строго:

              APPROVE

              или

              REJECT
              """

              final_reviewer_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": open(".ai/REVIEWER.md", encoding="utf-8").read()
                      },
                      {
                          "role": "user",
                          "content": final_review_prompt
                      }
                  ],
                  1800
              )

              print(final_reviewer_raw)

              final_match = re.match(
                  r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
                  final_reviewer_raw,
                  re.IGNORECASE
              )

              if not final_match:
                  raise RuntimeError(
                      "Final Reviewer returned an invalid status."
                  )

              final_status = final_match.group(1).upper()

              if final_status.startswith("REJECT"):
                  raise RuntimeError(
                      "Final Reviewer returned REJECT."
                  )

          else:
              print()
              print("QA and Reviewer approved the first implementation.")

          # ----------------------------------------------------------
          # FINAL DIFF CHECK
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("FINAL DIFF CHECK")
          print("========================================")

          run_command("git diff --check")

          final_diff = run_command(
              "git diff -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          if not final_diff.strip():
              print("No changes detected.")
              print("Nothing to commit.")
              raise SystemExit(0)

          # ----------------------------------------------------------
          # COMMIT
          # ----------------------------------------------------------

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run_command(
              'git config user.name "LORGUS AI"'
          )

          run_command(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run_command(
              "git add -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          run_command(
              'git commit -m "AI: update LORGUS project"'
          )

          run_command(
              "git push origin HEAD"
          )

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
