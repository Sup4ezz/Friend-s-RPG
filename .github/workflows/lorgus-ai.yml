name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI pipeline
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import subprocess
          import re

          TASK = os.environ["TASK"]
          API_KEY = os.environ["OPENROUTER_API_KEY"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          def ask(system, user):
              data = json.dumps({
                  "model": "openrouter/free",
                  "messages": [
                      {"role": "system", "content": system},
                      {"role": "user", "content": user}
                  ]
              }).encode()

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=data,
                  headers={
                      "Authorization": f"Bearer {API_KEY}",
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read())

              return result["choices"][0]["message"]["content"]

          def repository_text():
              result = []

              for root, dirs, files in os.walk("."):
                  if ".git" in root.split(os.sep):
                      continue

                  for filename in files:
                      path = os.path.join(root, filename)

                      if path.startswith("./"):
                          path = path[2:]

                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()

                          result.append(
                              f"\n===== {path} =====\n{content}"
                          )
                      except UnicodeDecodeError:
                          pass

              return "\n".join(result)

          def git_diff():
              return subprocess.check_output(
                  ["git", "diff", "--no-ext-diff"],
                  text=True
              )

          def extract_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )
                  text = re.sub(r"\s*```$", "", text)

              return json.loads(text)

          repo = repository_text()

          print("\n===== ARCHITECT =====\n")

          architect = ask(
              """Ты ARCHITECT проекта LORGUS.

              Изучи реальный репозиторий.

              Не изменяй файлы.

              Определи:
              - проблему;
              - затронутые файлы;
              - минимальный план изменений;
              - риски;
              - способ проверки.

              ВАЖНО:
              - не предлагай переписывать уже существующий код без необходимости;
              - не меняй язык существующего текста;
              - не добавляй лишнюю функциональность;
              - учитывай то, что уже существует в репозитории.""",
              f"""ЗАДАЧА:
          {TASK}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:
          {repo}"""
          )

          print(architect)

          print("\n===== CODER =====\n")

          coder_raw = ask(
              """Ты CODER проекта LORGUS.

              Изучи задачу, план Architect и полный текущий репозиторий.

              Верни ТОЛЬКО JSON:

              {
                "changes": [
                  {
                    "path": "README.md",
                    "content_lines": [
                      "полное новое содержимое файла"
                    ]
                  }
                ]
              }

              Правила:

              - content_lines содержит ПОЛНОЕ содержимое изменяемого файла;
              - изменяй только необходимые файлы;
              - сохраняй существующий язык;
              - сохраняй существующее содержимое, если оно не относится к задаче;
              - не переписывай существующий текст без необходимости;
              - не добавляй пояснения от себя;
              - не меняй .ai;
              - не добавляй секреты;
              - если изменений не требуется: {"changes": []}.""",
              f"""ЗАДАЧА:
          {TASK}

          ПЛАН ARCHITECT:
          {architect}

          ПОЛНЫЙ РЕПОЗИТОРИЙ:
          {repo}"""
          )

          print(coder_raw)

          try:
              coder = extract_json(coder_raw)
          except Exception as e:
              raise RuntimeError(
                  f"Coder returned invalid JSON: {e}"
              )

          for change in coder.get("changes", []):
              path = change["path"]

              if path not in ALLOWED_FILES:
                  raise RuntimeError(
                      f"Coder attempted to modify forbidden file: {path}"
                  )

              content = "\n".join(change["content_lines"])

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

              print(f"CODER: updated {path}")

          diff = git_diff()

          print("\n===== ACTUAL GIT DIFF =====\n")
          print(diff)

          repo_after = repository_text()

          print("\n===== QA =====\n")

          qa_raw = ask(
              """Ты QA Agent проекта LORGUS.

              Проверь РЕАЛЬНОЕ текущее состояние репозитория.

              У тебя есть:
              - исходная задача;
              - полный текущий репозиторий;
              - фактический git diff.

              ВАЖНО:
              Твой ответ обязан начинаться ровно с одного из:

              PASS

              или

              FAIL

              После PASS можешь дать краткое объяснение.

              После FAIL обязательно укажи:
              - файл;
              - проблему;
              - ожидаемый результат;
              - фактический результат.

              Не пиши "User Safety", "safe" или другие статусы вместо PASS/FAIL.

              Проверяй:
              - соответствие задаче;
              - синтаксис;
              - JavaScript;
              - HTML;
              - CSS;
              - API;
              - Supabase;
              - Cloudflare Worker;
              - регрессии;
              - лишние изменения.""",
              f"""ЗАДАЧА:
          {TASK}

          CURRENT REPOSITORY:
          {repo_after}

          ACTUAL GIT DIFF:
          {diff}"""
          )

          print(qa_raw)

          qa_match = re.match(
              r"^\s*(PASS|FAIL)\b",
              qa_raw,
              re.IGNORECASE
          )

          if not qa_match:
              raise RuntimeError(
                  "QA returned neither PASS nor FAIL."
              )

          qa_status = qa_match.group(1).upper()

          if qa_status == "FAIL":
              raise RuntimeError(
                  "QA reported FAIL."
              )

          print("\nQA VALIDATION: PASS")

          print("\n===== REVIEWER =====\n")

          reviewer_raw = ask(
              """Ты REVIEWER проекта LORGUS.

              Проведи независимое ревью.

              У тебя есть:
              - исходная задача;
              - полный текущий репозиторий;
              - фактический git diff;
              - результат QA.

              ВАЖНО:
              Твой ответ обязан начинаться ровно с одного из:

              APPROVE

              или

              REJECT

              После APPROVE можешь дать краткое объяснение.

              После REJECT обязательно укажи:
              - файл;
              - проблему;
              - почему это проблема;
              - что необходимо изменить.

              Не пиши "User Safety", "safe" или другие статусы вместо APPROVE/REJECT.

              ACTUAL GIT DIFF показывает только изменения.
              CURRENT REPOSITORY показывает полное состояние файлов.

              Не отклоняй изменение только потому,
              что требуемый элемент отсутствует в diff:
              он мог существовать до изменения.

              Проверяй:
              - соответствие задаче;
              - логику;
              - безопасность;
              - Supabase;
              - Cloudflare Worker;
              - регрессии;
              - лишние изменения;
              - сохранение существующего содержимого.""",
              f"""ЗАДАЧА:
          {TASK}

          CURRENT REPOSITORY:
          {repo_after}

          ACTUAL GIT DIFF:
          {diff}

          QA RESULT:
          {qa_raw}"""
          )

          print(reviewer_raw)

          reviewer_match = re.match(
              r"^\s*(APPROVE|REJECT)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          if not reviewer_match:
              raise RuntimeError(
                  "Reviewer returned neither APPROVE nor REJECT."
              )

          reviewer_status = reviewer_match.group(1).upper()

          if reviewer_status == "REJECT":
              raise RuntimeError(
                  "Reviewer rejected the changes."
              )

          print("\nREVIEW VALIDATION: APPROVE")
          print("\nPIPELINE RESULT: APPROVED")
          PY
