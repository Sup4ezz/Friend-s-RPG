name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run LORGUS AI
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          USER_TASK = os.environ["USER_TASK"]

          ALLOWED_FILES = {
              "index.html",
              "app.js",
              "style.css"
          }

          FORBIDDEN_FILES = {
              "README.md",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("USER TASK:")
          print(USER_TASK)
          print()

          def run(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          def groq(messages, max_tokens):

              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens,
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              for attempt in range(1, 4):

                  request = urllib.request.Request(
                      GROQ_URL,
                      data=body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "LORGUS-GitHub-Actions"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          data = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                          return data[
                              "choices"
                          ][0][
                              "message"
                          ][
                              "content"
                          ]

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/3)"
                      )

                      print(raw)

                      if error.code == 429:

                          wait = 30

                          match = re.search(
                              r"try again in ([0-9.]+)s",
                              raw,
                              re.IGNORECASE
                          )

                          if match:

                              wait = max(
                                  30,
                                  int(
                                      float(
                                          match.group(1)
                                      )
                                  ) + 3
                              )

                          print(
                              f"Waiting {wait}s..."
                          )

                          time.sleep(wait)

                          continue

                      if error.code == 413:

                          raise RuntimeError(
                              "Groq request is too large."
                          )

                      raise RuntimeError(
                          f"Groq HTTP {error.code}: {raw}"
                      )

              raise RuntimeError(
                  "Groq rate limit retry exhausted."
              )

          def parse_json(raw):

              raw = raw.strip()

              if raw.startswith("```"):

                  raw = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      raw,
                      flags=re.IGNORECASE
                  )

                  raw = re.sub(
                      r"\s*```$",
                      "",
                      raw
                  )

              try:

                  return json.loads(raw)

              except json.JSONDecodeError as error:

                  print("INVALID JSON:")
                  print(raw)

                  raise RuntimeError(
                      f"Invalid JSON: {error}"
                  )

          def read_file(path):

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:

                  return file.read()

          def choose_files(task):

              text = task.lower()

              selected = set()

              interface_words = [
                  "кноп",
                  "интерфейс",
                  "страниц",
                  "ui",
                  "html",
                  "элемент",
                  "разметк"
              ]

              javascript_words = [
                  "javascript",
                  "js",
                  "логик",
                  "обработчик",
                  "событи",
                  "функци"
              ]

              css_words = [
                  "css",
                  "стиль",
                  "оформлен",
                  "цвет",
                  "размер"
              ]

              if any(
                  word in text
                  for word in interface_words
              ):

                  selected.update({
                      "index.html",
                      "app.js",
                      "style.css"
                  })

              if any(
                  word in text
                  for word in javascript_words
              ):

                  selected.add("app.js")

              if any(
                  word in text
                  for word in css_words
              ):

                  selected.add("style.css")

              if not selected:

                  selected.update({
                      "index.html",
                      "app.js",
                      "style.css"
                  })

              return sorted(selected)

          def context_for(path, content):

              lines = content.splitlines()

              if len(content) <= 9000:

                  return content

              if path == "index.html":

                  patterns = [
                      r"<body",
                      r"<main",
                      r"<header",
                      r"<section",
                      r"<div",
                      r"<button",
                      r"id=",
                      r"class=",
                      r"<script"
                  ]

              elif path == "app.js":

                  patterns = [
                      r"initialize",
                      r"render",
                      r"innerHTML",
                      r"createElement",
                      r"addEventListener",
                      r"querySelector",
                      r"getElementById",
                      r"DOMContentLoaded"
                  ]

              else:

                  patterns = [
                      r"button",
                      r"\.btn",
                      r"\.gold-button",
                      r"header",
                      r"main",
                      r"section",
                      r"\."
                  ]

              regexes = [
                  re.compile(
                      pattern,
                      re.IGNORECASE
                  )
                  for pattern in patterns
              ]

              selected = set()

              for i, line in enumerate(lines):

                  if any(
                      regex.search(line)
                      for regex in regexes
                  ):

                      start = max(
                          0,
                          i - 6
                      )

                      end = min(
                          len(lines),
                          i + 7
                      )

                      selected.update(
                          range(start, end)
                      )

              selected.update(
                  range(
                      min(40, len(lines))
                  )
              )

              if path == "app.js":

                  selected.update(
                      range(
                          max(
                              0,
                              len(lines) - 60
                          ),
                          len(lines)
                      )
                  )

              indexes = sorted(selected)

              result = []
              last = None

              for i in indexes:

                  if (
                      last is not None
                      and i > last + 1
                  ):

                      result.append(
                          "\n... [GAP] ...\n"
                      )

                  result.append(
                      f"{i + 1}: {lines[i]}"
                  )

                  last = i

              text = "\n".join(result)

              if len(text) > 9000:

                  text = (
                      text[:9000]
                      + "\n... [TRUNCATED] ..."
                  )

              return text

          def build_context(paths):

              blocks = []

              for path in paths:

                  if not os.path.isfile(path):
                      continue

                  content = read_file(path)

                  blocks.append(
                      "\n===== FILE: "
                      + path
                      + " =====\n"
                      + context_for(
                          path,
                          content
                      )
                      + "\n===== END FILE =====\n"
                  )

              return "\n".join(blocks)

          selected = choose_files(
              USER_TASK
          )

          print("Files supplied to AI:")

          for path in selected:

              print(
                  f"  - {path}"
              )

          print()

          context = build_context(
              selected
          )

          print("========================================")
          print("LORGUS AI")
          print("========================================")

          system_prompt = """
          Ты единственный Coding Agent проекта LORGUS.

          Ты работаешь непосредственно с Git repository.

          Репозиторий является единственным источником истины.

          Твоя задача:

          1. Изучить предоставленный реальный код.
          2. Понять существующую архитектуру.
          3. Выполнить задачу пользователя.
          4. Изменить только необходимые файлы.
          5. Не ломать существующую функциональность.
          6. Использовать существующий код вместо переписывания.
          7. Делать минимальные точечные изменения.

          КРИТИЧЕСКИЕ ПРАВИЛА:

          - Никогда не переписывай файл целиком.
          - Никогда не возвращай полный файл.
          - Используй только operation "replace".
          - old должен быть точной строкой из предоставленного кода.
          - old должен встречаться ровно один раз.
          - old должен содержать достаточно контекста,
            чтобы однозначно определить место изменения.
          - old должен содержать минимум 30 символов.
          - Никогда не используй в качестве old только:
            "}", "{", ";", ")", "(", ",", ":" или одну короткую строку.
          - Не используй одиночную скобку или один оператор
            как якорь для изменения.
          - Для JavaScript используй несколько соседних строк
            существующего кода.
          - Для HTML используй несколько соседних строк
            существующей разметки.
          - Для CSS используй существующий небольшой блок
            CSS целиком.
          - Не удаляй существующую функциональность.
          - Не меняй несвязанный код.
          - Не придумывай отсутствующий код.
          - Не создавай новые файлы.
          - Не создавай новые архитектурные слои без необходимости.
          - README.md запрещён для изменения.
          - worker.js запрещён для изменения.
          - wrangler.toml запрещён для изменения.
          - docs/PROJECT.md запрещён для изменения.
          - Если достаточно одного файла — меняй один файл.
          - Не добавляй лишние пустые строки в конце файла.
          - new не должен создавать дополнительную пустую строку
            в конце файла.
          - Для элементов интерфейса сначала ищи существующий
            HTML-контейнер или существующую секцию интерфейса.
          - Не добавляй UI через document.body.appendChild(),
            если существующая архитектура позволяет встроить элемент.
          - Не предполагай существование элемента DOM,
            которого нет в предоставленном коде.
          - Не предполагай существование id, класса, функции,
            переменной или контейнера, которого нет в коде.
          - Перед использованием существующего DOM-элемента
            убедись, что он действительно присутствует
            в предоставленном коде.
          - Сохраняй существующие классы и стили,
            если они подходят для новой функции.
          - Не добавляй inline style, если подходящий
            существующий CSS-класс уже есть.
          - Не создавай дублирующие элементы.
          - Если нужная функциональность уже существует,
            не создавай вторую реализацию.

          Пользовательская задача имеет абсолютный приоритет.

          Верни ТОЛЬКО валидный JSON.

          Формат:

          {
            "changes": [
              {
                "path": "app.js",
                "operation": "replace",
                "old": "точный уникальный существующий фрагмент",
                "new": "необходимая замена"
              }
            ]
          }

          Если изменений не требуется:

          {
            "changes": []
          }

          Не добавляй другие поля.
          """

          user_prompt = f"""
          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:

          {USER_TASK}

          РЕАЛЬНЫЙ КОД ПРОЕКТА:

          {context}

          Выполни задачу.

          Сначала определи точное существующее место,
          куда необходимо внести изменение.

          Не предполагай существование DOM-элементов,
          которых нет в коде.

          Не возвращай полный файл.

          Используй только точечные replace-изменения.

          Каждый old обязан:

          - существовать в реальном коде;
          - встречаться ровно один раз;
          - содержать минимум 30 символов;
          - содержать достаточный окружающий контекст;
          - не быть одиночной скобкой или коротким оператором.

          Не добавляй лишние пустые строки.
          """

          response = groq(
              [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              2200
          )

          result = parse_json(
              response
          )

          changes = result.get(
              "changes",
              []
          )

          if not isinstance(
              changes,
              list
          ):

              raise RuntimeError(
                  "AI changes must be a list."
              )

          print()
          print("AI requested changes:")

          print(
              json.dumps(
                  changes,
                  ensure_ascii=False,
                  indent=2
              )
          )

          changed_paths = []

          for change in changes:

              if not isinstance(
                  change,
                  dict
              ):

                  raise RuntimeError(
                      "Each change must be an object."
                  )

              path = change.get(
                  "path"
              )

              operation = change.get(
                  "operation"
              )

              old = change.get(
                  "old"
              )

              new = change.get(
                  "new"
              )

              if path not in ALLOWED_FILES:

                  raise RuntimeError(
                      f"Forbidden file: {path}"
                  )

              if path in FORBIDDEN_FILES:

                  raise RuntimeError(
                      f"Forbidden modification: {path}"
                  )

              if operation != "replace":

                  raise RuntimeError(
                      f"Unsupported operation: {operation}"
                  )

              if not isinstance(
                  old,
                  str
              ):

                  raise RuntimeError(
                      f"Invalid old content: {path}"
                  )

              if not isinstance(
                  new,
                  str
              ):

                  raise RuntimeError(
                      f"Invalid new content: {path}"
                  )

              if len(old.strip()) < 30:

                  raise RuntimeError(
                      f"Anchor is too short in {path}. "
                      f"AI must provide a larger unique "
                      f"code fragment."
                  )

              forbidden_short_anchors = {
                  "}",
                  "{",
                  ";",
                  ")",
                  "(",
                  ",",
                  ":"
              }

              if old.strip() in forbidden_short_anchors:

                  raise RuntimeError(
                      f"Invalid short anchor in {path}."
                  )

              content = read_file(
                  path
              )

              count = content.count(
                  old
              )

              if count == 0:

                  raise RuntimeError(
                      f"Anchor not found in {path}."
                  )

              if count > 1:

                  raise RuntimeError(
                      f"Anchor occurs {count} times "
                      f"in {path}. "
                      f"AI must provide a unique "
                      f"code fragment."
                  )

              old_lines = len(
                  old.splitlines()
              )

              if old_lines > 40:

                  raise RuntimeError(
                      f"Large replacement blocked "
                      f"in {path}: "
                      f"{old_lines} lines."
                  )

              updated = content.replace(
                  old,
                  new,
                  1
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as file:

                  file.write(
                      updated
                  )

              changed_paths.append(
                  path
              )

              print(
                  f"Applied precise change: {path}"
              )

          changed_paths = sorted(
              set(changed_paths)
          )

          for path in changed_paths:

              content = read_file(
                  path
              )

              normalized = (
                  content.rstrip("\r\n")
                  + "\n"
              )

              if normalized != content:

                  with open(
                      path,
                      "w",
                      encoding="utf-8"
                  ) as file:

                      file.write(
                          normalized
                      )

          print()
          print("========================================")
          print("DIFF")
          print("========================================")

          diff = run(
              "git diff -- "
              "index.html "
              "app.js "
              "style.css"
          )

          if not diff.strip():

              print(
                  "AI made no changes."
              )

              raise SystemExit(0)

          run(
              "git diff --check"
          )

          print()
          print("========================================")
          print("CHECKS")
          print("========================================")

          if "app.js" in changed_paths:

              run(
                  "node --check app.js"
              )

              print(
                  "JavaScript syntax: PASS"
              )

          changed_by_git = run(
              "git diff --name-only"
          ).splitlines()

          for path in changed_by_git:

              if path in FORBIDDEN_FILES:

                  raise RuntimeError(
                      f"Forbidden file changed: {path}"
                  )

              if path not in ALLOWED_FILES:

                  raise RuntimeError(
                      f"Unexpected file changed: {path}"
                  )

          print(
              "Allowed files: PASS"
          )

          print(
              "Forbidden files: PASS"
          )

          print(
              "Git diff check: PASS"
          )

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run(
              'git config user.name "LORGUS AI"'
          )

          run(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run(
              "git add -- "
              "index.html "
              "app.js "
              "style.css"
          )

          run(
              'git commit -m '
              '"AI: update LORGUS project"'
          )

          run(
              "git push origin HEAD"
          )

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
