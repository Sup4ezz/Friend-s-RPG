name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODELS_URL: https://api.groq.com/openai/v1/models

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Groq preflight
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("GROQ_API_KEY", "")
          model = os.environ.get("GROQ_MODEL", "")
          url = os.environ.get("GROQ_MODELS_URL", "")

          print("========================================")
          print("GROQ PREFLIGHT")
          print("========================================")

          if not key:
              raise SystemExit("GitHub Secret API is empty.")

          print("API key detected: YES")
          print(f"Key length: {len(key)}")
          print(f"Model: {model}")

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "User-Agent": "LORGUS-GitHub-Actions"
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(
                      response.read().decode("utf-8", errors="replace")
                  )

              models = {
                  item.get("id")
                  for item in data.get("data", [])
              }

              print(f"Models endpoint: HTTP {response.status}")

              if model not in models:
                  raise SystemExit(
                      f"Model {model} is not available."
                  )

              print("Target model: AVAILABLE")

          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(f"Groq HTTP {error.code}")
              print(body)

              raise SystemExit(
                  f"Groq preflight failed with HTTP {error.code}."
              )
          PY

      - name: Run LORGUS AI pipeline
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import subprocess
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          USER_TASK = os.environ["USER_TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          MAX_CONTEXT = 10000

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("USER TASK:")
          print(USER_TASK)
          print()

          def run(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          def groq(messages, max_tokens, json_mode=False):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens
              }

              if json_mode:
                  payload["response_format"] = {
                      "type": "json_object"
                  }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              last_error = None

              for attempt in range(1, 3):
                  request = urllib.request.Request(
                      GROQ_URL,
                      data=body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "LORGUS-GitHub-Actions"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          raw = response.read().decode(
                              "utf-8",
                              errors="replace"
                          )

                          data = json.loads(raw)

                          return data["choices"][0]["message"]["content"]

                  except urllib.error.HTTPError as error:
                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/2)"
                      )

                      print(raw)

                      last_error = raw

                      if error.code in (400, 401, 403):
                          break

                      if error.code == 413:
                          break

                      if error.code == 429:
                          time.sleep(5)
                          continue

                      time.sleep(3)

                  except Exception as error:
                      last_error = str(error)
                      time.sleep(3)

              raise RuntimeError(
                  f"Groq request failed: {last_error}"
              )

          def parse_json(raw):
              raw = raw.strip()

              if raw.startswith("```"):
                  raw = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      raw,
                      flags=re.IGNORECASE
                  )

                  raw = re.sub(
                      r"\s*```$",
                      "",
                      raw
                  )

              try:
                  return json.loads(raw)

              except json.JSONDecodeError as error:
                  print("INVALID JSON FROM MODEL:")
                  print(raw)
                  raise RuntimeError(
                      f"Invalid JSON from model: {error}"
                  )

          def read_file(path):
              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  return file.read()

          def write_content(path, content):
              if not isinstance(content, str):
                  raise RuntimeError(
                      f"Invalid content for {path}"
                  )

              if not content.endswith("\n"):
                  content += "\n"

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(content)

          def get_files():
              result = {}

              for path in sorted(ALLOWED_FILES):
                  if os.path.isfile(path):
                      result[path] = read_file(path)

              return result

          def build_context(paths, limit=MAX_CONTEXT):
              files = get_files()
              blocks = []
              total = 0

              for path in paths:
                  if path not in files:
                      continue

                  content = files[path]

                  remaining = limit - total

                  if remaining <= 0:
                      break

                  if len(content) > remaining:
                      content = (
                          content[:remaining]
                          + "\n[CONTEXT TRUNCATED]\n"
                      )

                  block = (
                      f"\n===== FILE: {path} =====\n"
                      f"{content}\n"
                      f"===== END FILE: {path} =====\n"
                  )

                  blocks.append(block)
                  total += len(block)

              return "\n".join(blocks)

          def detect_files(task):
              task_lower = task.lower()

              selected = set()

              mapping = {
                  "readme": ["README.md"],
                  "index.html": ["index.html"],
                  "html": ["index.html"],
                  "css": ["style.css"],
                  "style.css": ["style.css"],
                  "app.js": ["app.js"],
                  "javascript": ["app.js"],
                  "worker.js": ["worker.js"],
                  "cloudflare": [
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "wrangler": ["wrangler.toml"],
                  "supabase": [
                      "app.js",
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "project.md": ["docs/PROJECT.md"],
                  "docs": ["docs/PROJECT.md"]
              }

              for keyword, paths in mapping.items():
                  if keyword in task_lower:
                      selected.update(paths)

              if not selected:
                  selected = set(ALLOWED_FILES)

              return sorted(selected)

          selected = detect_files(USER_TASK)

          print("Relevant files:")

          for path in selected:
              print(f"  - {path}")

          print()

          original_files = get_files()

          # ============================================================
          # ARCHITECT
          # ============================================================

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect_context = build_context(
              selected,
              8000
          )

          architect_prompt = f"""
          Ты Architect Agent проекта LORGUS.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          ВАЖНО:

          Исходная задача пользователя является главным источником
          требований.

          Нельзя заменять задачу пользователя собственной идеей.

          Если пользователь указал конкретный файл или конкретное
          содержимое, это требование имеет приоритет.

          Не ищи посторонние проблемы проекта.

          Не исправляй код.

          ТЕКУЩИЕ ФАЙЛЫ:
          {architect_context}

          Верни JSON:

          {{
            "problem": "...",
            "cause": "...",
            "files": ["..."],
            "plan": ["..."],
            "risks": ["..."],
            "checks": ["..."]
          }}
          """

          architect = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/ARCHITECT.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": architect_prompt
                      }
                  ],
                  1200,
                  True
              )
          )

          print(
              json.dumps(
                  architect,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ============================================================
          # CODER
          # ============================================================

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_context = build_context(
              selected,
              9000
          )

          coder_prompt = f"""
          Ты Coding Agent проекта LORGUS.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          ПЛАН ARCHITECT:
          {json.dumps(
              architect,
              ensure_ascii=False
          )}

          ТЕКУЩИЕ ФАЙЛЫ:
          {coder_context}

          КРИТИЧЕСКОЕ ПРАВИЛО:

          Ты обязан выполнить ИСХОДНУЮ ЗАДАЧУ пользователя.

          План Architect является вспомогательным.
          Он НЕ может переопределять задачу пользователя.

          Если пользователь дал точное содержимое файла,
          сохрани это содержимое буквально.

          Разрешённые файлы:

          {sorted(ALLOWED_FILES)}

          Верни ТОЛЬКО JSON:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content": "полное содержимое файла"
              }}
            ]
          }}

          Правила:

          - content является полной строкой содержимого файла;
          - переносы строк должны быть представлены как \\n;
          - не используй unified diff;
          - не используй markdown fences;
          - не меняй несвязанные файлы;
          - не удаляй существующую функциональность;
          - если изменений не требуется:
            {{"changes":[]}}
          """

          coder = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/CODER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": coder_prompt
                      }
                  ],
                  3500,
                  True
              )
          )

          changes = coder.get("changes", [])

          if not isinstance(changes, list):
              raise RuntimeError(
                  "Coder returned invalid changes."
              )

          changed_paths = []

          for change in changes:

              path = change.get("path")
              content = change.get("content")

              if path not in ALLOWED_FILES:
                  raise RuntimeError(
                      f"Coder attempted to modify "
                      f"forbidden file: {path}"
                  )

              if not isinstance(content, str):
                  raise RuntimeError(
                      f"Coder returned invalid content "
                      f"for {path}"
                  )

              write_content(
                  path,
                  content
              )

              changed_paths.append(path)

          # ============================================================
          # DIFF
          # ============================================================

          print()
          print("========================================")
          print("CURRENT DIFF")
          print("========================================")

          diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run("git diff --check")

          # ============================================================
          # QA
          # ============================================================

          print()
          print("========================================")
          print("QA")
          print("========================================")

          qa_context = build_context(
              changed_paths,
              7000
          )

          qa_prompt = f"""
          Проверь РЕАЛЬНЫЙ результат работы Coding Agent.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          CURRENT DIFF:
          {diff[:7000]}

          АКТУАЛЬНЫЕ ФАЙЛЫ:
          {qa_context}

          Проверяй результат самостоятельно.

          Не доверяй плану Architect.

          Проверь:

          1. Выполнена ли исходная задача пользователя.
          2. Реально ли присутствуют изменения.
          3. Сохранена ли существующая функциональность.
          4. Нет ли синтаксических ошибок.
          5. Изменены ли только необходимые файлы.
          6. Если пользователь дал точное содержимое —
             соответствует ли файл именно ему.

          Первая строка ответа должна быть:

          PASS

          или:

          FAIL

          После первой строки дай краткое объяснение.
          """

          qa_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/QA.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              1200,
              False
          )

          print(qa_raw)

          qa_pass = bool(
              re.match(
                  r"^\s*PASS\b",
                  qa_raw,
                  re.IGNORECASE
              )
          )

          # ============================================================
          # REVIEWER
          # ============================================================

          print()
          print("========================================")
          print("REVIEWER")
          print("========================================")

          reviewer_prompt = f"""
          Проведи независимый review изменений LORGUS.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          DIFF:
          {diff[:7000]}

          QA:
          {qa_raw[:3000]}

          ВАЖНО:

          Не принимай интерпретацию Architect как источник истины.

          Проверяй исходную задачу пользователя напрямую.

          Проверь:

          - соответствие задаче;
          - безопасность;
          - секреты;
          - Supabase;
          - Cloudflare;
          - XSS;
          - регрессии;
          - несвязанные изменения.

          Не переписывай код.

          Первая строка:

          APPROVE

          или:

          REJECT
          """

          reviewer_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/REVIEWER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              1200,
              False
          )

          print(reviewer_raw)

          reviewer_match = re.match(
              r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          reviewer_status = (
              reviewer_match.group(1).upper()
              if reviewer_match
              else ""
          )

          reviewer_reject = (
              reviewer_status.startswith("REJECT")
          )

          # ============================================================
          # FIXER
          # ============================================================

          if not qa_pass or reviewer_reject:

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_context = build_context(
                  changed_paths,
                  7000
              )

              fixer_prompt = f"""
              Исправь реальные проблемы проекта.

              ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
              {USER_TASK}

              CURRENT DIFF:
              {diff[:6000]}

              QA:
              {qa_raw[:3000]}

              REVIEWER:
              {reviewer_raw[:3000]}

              АКТУАЛЬНЫЕ ФАЙЛЫ:
              {fixer_context}

              ВАЖНО:

              Исходная задача пользователя имеет приоритет.

              Исправляй только проблемы, относящиеся к задаче.

              Верни ТОЛЬКО JSON:

              {{
                "changes": [
                  {{
                    "path": "README.md",
                    "content": "полное содержимое файла"
                  }}
                ]
              }}

              Правила:

              - content = полное содержимое файла;
              - переносы строк = \\n;
              - не используй diff;
              - не используй markdown fences;
              - не меняй несвязанные файлы.
              """

              fixer = parse_json(
                  groq(
                      [
                          {
                              "role": "system",
                              "content": read_file(
                                  ".ai/CODER.md"
                              )
                          },
                          {
                              "role": "user",
                              "content": fixer_prompt
                          }
                      ],
                      3500,
                      True
                  )
              )

              fixer_changes = fixer.get(
                  "changes",
                  []
              )

              fixer_paths = []

              for change in fixer_changes:

                  path = change.get("path")
                  content = change.get("content")

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Fixer attempted to modify "
                          f"forbidden file: {path}"
                      )

                  if not isinstance(content, str):
                      raise RuntimeError(
                          f"Fixer returned invalid content "
                          f"for {path}"
                      )

                  write_content(
                      path,
                      content
                  )

                  fixer_paths.append(path)

              run("git diff --check")

              # ========================================================
              # FINAL QA
              # ========================================================

              print()
              print("========================================")
              print("FINAL QA")
              print("========================================")

              final_paths = sorted(
                  set(changed_paths + fixer_paths)
              )

              final_context = build_context(
                  final_paths,
                  7000
              )

              final_diff = run(
                  "git diff -- "
                  "README.md "
                  "index.html "
                  "app.js "
                  "style.css "
                  "worker.js "
                  "wrangler.toml "
                  "docs/PROJECT.md"
              )

              final_qa_prompt = f"""
              Проведи финальную независимую проверку.

              ИСХОДНАЯ ЗАДАЧА:
              {USER_TASK}

              ФИНАЛЬНЫЙ DIFF:
              {final_diff[:7000]}

              ФИНАЛЬНЫЕ ФАЙЛЫ:
              {final_context}

              Проверь непосредственно исходную задачу.

              Не доверяй Architect, Coder или Reviewer.

              Первая строка:

              PASS

              или:

              FAIL
              """

              final_qa_raw = groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/QA.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": final_qa_prompt
                      }
                  ],
                  1200,
                  False
              )

              print(final_qa_raw)

              if not re.match(
                  r"^\s*PASS\b",
                  final_qa_raw,
                  re.IGNORECASE
              ):
                  raise RuntimeError(
                      "Final QA returned FAIL."
                  )

              # ========================================================
              # FINAL REVIEW
              # ========================================================

              print()
              print("========================================")
              print("FINAL REVIEW")
              print("========================================")

              final_review_prompt = f"""
              Финальный review.

              ИСХОДНАЯ ЗАДАЧА:
              {USER_TASK}

              FINAL QA:
              {final_qa_raw[:3000]}

              FINAL DIFF:
              {final_diff[:7000]}

              Независимо проверь соответствие задаче.

              Первая строка:

              APPROVE

              или:

              REJECT
              """

              final_review_raw = groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/REVIEWER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": final_review_prompt
                      }
                  ],
                  1200,
                  False
              )

              print(final_review_raw)

              final_match = re.match(
                  r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
                  final_review_raw,
                  re.IGNORECASE
              )

              if not final_match:
                  raise RuntimeError(
                      "Final Reviewer returned invalid status."
                  )

              final_status = (
                  final_match.group(1).upper()
              )

              if final_status.startswith("REJECT"):
                  raise RuntimeError(
                      "Final Reviewer returned REJECT."
                  )

          else:

              print()
              print(
                  "QA and Reviewer approved "
                  "the first implementation."
              )

          # ============================================================
          # FINAL CHECK
          # ============================================================

          print()
          print("========================================")
          print("FINAL CHECK")
          print("========================================")

          run("git diff --check")

          final_diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          if not final_diff.strip():

              print("No changes detected.")

              raise SystemExit(0)

          # ============================================================
          # COMMIT
          # ============================================================

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run(
              'git config user.name "LORGUS AI"'
          )

          run(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run(
              "git add -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run(
              'git commit -m "AI: update LORGUS project"'
          )

          run(
              "git push origin HEAD"
          )

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
