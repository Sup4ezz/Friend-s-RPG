name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODELS_URL: https://api.groq.com/openai/v1/models

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Groq preflight
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ["GROQ_API_KEY"]
          model = os.environ["GROQ_MODEL"]

          request = urllib.request.Request(
              os.environ["GROQ_MODELS_URL"],
              headers={
                  "Authorization": f"Bearer {key}",
                  "User-Agent": "LORGUS-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.loads(
                      response.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              models = {
                  item.get("id")
                  for item in data.get("data", [])
              }

              if model not in models:
                  raise SystemExit(
                      f"Model {model} is unavailable."
                  )

              print("Groq: OK")
              print(f"Model: {model}")

          except urllib.error.HTTPError as error:

              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(body)

              raise SystemExit(
                  f"Groq preflight failed: HTTP {error.code}"
              )
          PY

      - name: Run LORGUS AI pipeline
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          USER_TASK = os.environ["USER_TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          FORBIDDEN_FILES = {
              "README.md",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("USER TASK:")
          print(USER_TASK)
          print()

          # ============================================================
          # SHELL
          # ============================================================

          def run(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          # ============================================================
          # GROQ
          # ============================================================

          def groq(messages, max_tokens, json_mode=False):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens
              }

              if json_mode:
                  payload["response_format"] = {
                      "type": "json_object"
                  }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              for attempt in range(1, 4):

                  request = urllib.request.Request(
                      GROQ_URL,
                      data=body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "LORGUS-GitHub-Actions"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          data = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                          return data[
                              "choices"
                          ][0][
                              "message"
                          ][
                              "content"
                          ]

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/3)"
                      )

                      print(raw)

                      if error.code == 429:

                          wait = 15

                          match = re.search(
                              r"try again in ([0-9.]+)s",
                              raw,
                              re.IGNORECASE
                          )

                          if match:
                              wait = max(
                                  15,
                                  int(
                                      float(
                                          match.group(1)
                                      )
                                  ) + 2
                              )

                          print(
                              f"Waiting {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      if error.code == 413:

                          raise RuntimeError(
                              "Groq request is too large."
                          )

                      raise RuntimeError(
                          f"Groq HTTP {error.code}: {raw}"
                      )

              raise RuntimeError(
                  "Groq rate limit retry exhausted."
              )

          # ============================================================
          # JSON
          # ============================================================

          def parse_json(raw):

              raw = raw.strip()

              if raw.startswith("```"):

                  raw = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      raw,
                      flags=re.IGNORECASE
                  )

                  raw = re.sub(
                      r"\s*```$",
                      "",
                      raw
                  )

              try:

                  return json.loads(raw)

              except json.JSONDecodeError as error:

                  print("MODEL RETURNED INVALID JSON:")
                  print(raw)

                  raise RuntimeError(
                      f"Invalid JSON: {error}"
                  )

          # ============================================================
          # FILES
          # ============================================================

          def read_file(path):

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  return file.read()

          def get_files():

              result = {}

              for path in sorted(ALLOWED_FILES):

                  if os.path.isfile(path):
                      result[path] = read_file(path)

              return result

          # ============================================================
          # FILE DETECTION
          # ============================================================

          def detect_files(task):

              text = task.lower()

              selected = set()

              mapping = {
                  "readme": [
                      "README.md"
                  ],

                  "index.html": [
                      "index.html"
                  ],

                  "html": [
                      "index.html"
                  ],

                  "страниц": [
                      "index.html"
                  ],

                  "интерфейс": [
                      "index.html",
                      "style.css",
                      "app.js"
                  ],

                  "кноп": [
                      "index.html",
                      "style.css",
                      "app.js"
                  ],

                  "ui": [
                      "index.html",
                      "style.css",
                      "app.js"
                  ],

                  "стиль": [
                      "style.css"
                  ],

                  "css": [
                      "style.css"
                  ],

                  "app.js": [
                      "app.js"
                  ],

                  "javascript": [
                      "app.js"
                  ],

                  "логик": [
                      "app.js"
                  ],

                  "обработчик": [
                      "app.js"
                  ],

                  "worker.js": [
                      "worker.js"
                  ],

                  "cloudflare": [
                      "worker.js",
                      "wrangler.toml"
                  ],

                  "wrangler": [
                      "wrangler.toml"
                  ],

                  "supabase": [
                      "app.js",
                      "worker.js",
                      "wrangler.toml"
                  ],

                  "project.md": [
                      "docs/PROJECT.md"
                  ],

                  "docs": [
                      "docs/PROJECT.md"
                  ]
              }

              for keyword, paths in mapping.items():

                  if keyword in text:
                      selected.update(paths)

              if not selected:

                  selected = set(
                      ALLOWED_FILES
                  )

              return sorted(selected)

          # ============================================================
          # STRUCTURAL CONTEXT
          # ============================================================

          def numbered_lines(content):
              return content.splitlines()

          def add_window(
              lines,
              center,
              radius,
              output
          ):

              start = max(
                  0,
                  center - radius
              )

              end = min(
                  len(lines),
                  center + radius + 1
              )

              for number in range(
                  start,
                  end
              ):

                  output.add(number)

          def html_context(content):

              lines = numbered_lines(content)

              selected = set()

              important = re.compile(
                  r"<body\b|"
                  r"<main\b|"
                  r"<header\b|"
                  r"<section\b|"
                  r"<div\b|"
                  r"<button\b|"
                  r"<script\b|"
                  r"id=|"
                  r"class=",
                  re.IGNORECASE
              )

              for index, line in enumerate(lines):

                  if important.search(line):
                      add_window(
                          lines,
                          index,
                          3,
                          selected
                      )

              indexes = sorted(selected)

              result = []

              last = None

              for index in indexes:

                  if last is not None and index > last + 1:
                      result.append(
                          "\n... [HTML GAP] ...\n"
                      )

                  result.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )

                  last = index

              text = "\n".join(result)

              if len(text) > 7000:
                  text = text[:7000] + \
                      "\n... [TRUNCATED] ..."

              return text

          def js_context(content):

              lines = numbered_lines(content)

              selected = set()

              important = re.compile(
                  r"function\s+\w+\s*\("
                  r"|async\s+function\s+\w+"
                  r"|DOMContentLoaded"
                  r"|addEventListener"
                  r"|querySelector"
                  r"|getElementById"
                  r"|innerHTML"
                  r"|createElement"
                  r"|render[A-Z]"
                  r"|window\."
              )

              for index, line in enumerate(lines):

                  if important.search(line):

                      add_window(
                          lines,
                          index,
                          4,
                          selected
                      )

              # Always provide beginning and end.
              for index in range(
                  min(30, len(lines))
              ):
                  selected.add(index)

              for index in range(
                  max(0, len(lines) - 30),
                  len(lines)
              ):
                  selected.add(index)

              indexes = sorted(selected)

              result = []

              last = None

              for index in indexes:

                  if last is not None and index > last + 1:
                      result.append(
                          "\n... [JS GAP] ...\n"
                      )

                  result.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )

                  last = index

              text = "\n".join(result)

              if len(text) > 9000:
                  text = text[:9000] + \
                      "\n... [TRUNCATED] ..."

              return text

          def css_context(content):

              lines = numbered_lines(content)

              selected = set()

              important = re.compile(
                  r"button|"
                  r"\.btn|"
                  r"#|"
                  r"input|"
                  r"header|"
                  r"main|"
                  r"section",
                  re.IGNORECASE
              )

              for index, line in enumerate(lines):

                  if important.search(line):

                      add_window(
                          lines,
                          index,
                          3,
                          selected
                      )

              if not selected:

                  for index in range(
                      min(100, len(lines))
                  ):
                      selected.add(index)

              indexes = sorted(selected)

              result = []

              last = None

              for index in indexes:

                  if last is not None and index > last + 1:
                      result.append(
                          "\n... [CSS GAP] ...\n"
                      )

                  result.append(
                      f"{index + 1}: "
                      f"{lines[index]}"
                  )

                  last = index

              text = "\n".join(result)

              if len(text) > 6000:
                  text = text[:6000] + \
                      "\n... [TRUNCATED] ..."

              return text

          def smart_context(paths):

              files = get_files()

              blocks = []

              for path in paths:

                  if path not in files:
                      continue

                  content = files[path]

                  if path == "index.html":
                      excerpt = html_context(
                          content
                      )

                  elif path == "app.js":
                      excerpt = js_context(
                          content
                      )

                  elif path == "style.css":
                      excerpt = css_context(
                          content
                      )

                  else:
                      excerpt = content[:4000]

                  blocks.append(
                      "\n===== FILE: "
                      + path
                      + " =====\n"
                      + excerpt
                      + "\n===== END FILE =====\n"
                  )

              return "\n".join(blocks)

          # ============================================================
          # ARCHITECT
          # ============================================================

          selected = detect_files(
              USER_TASK
          )

          print("Relevant files:")

          for path in selected:
              print(f"  - {path}")

          print()

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect_prompt = f"""
          Проанализируй исходную задачу пользователя.

          ЗАДАЧА:
          {USER_TASK}

          ДОСТУПНЫЕ ФАЙЛЫ:
          {smart_context(selected)}

          Исходная задача пользователя имеет абсолютный приоритет.

          Ничего не изменяй.

          Верни JSON:

          {{
            "problem": "...",
            "files": ["index.html", "app.js"],
            "plan": [
              "..."
            ],
            "checks": [
              "..."
            ]
          }}

          Указывай только файлы, которые реально необходимо
          изменить для выполнения задачи.
          """

          architect = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/ARCHITECT.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": architect_prompt
                      }
                  ],
                  1400,
                  True
              )
          )

          print(
              json.dumps(
                  architect,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ------------------------------------------------------------
          # MERGE ARCHITECT FILES
          # ------------------------------------------------------------

          architect_files = architect.get(
              "files",
              []
          )

          for path in architect_files:

              if path in ALLOWED_FILES:
                  selected.append(path)

          selected = sorted(
              set(selected)
          )

          print()
          print("Files selected by Architect:")

          for path in selected:
              print(f"  - {path}")

          # ============================================================
          # CODER
          # ============================================================

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_context = smart_context(
              selected
          )

          coder_prompt = f"""
          Ты Coding Agent проекта LORGUS.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          ПЛАН ARCHITECT:
          {json.dumps(
              architect,
              ensure_ascii=False
          )}

          НИЖЕ НАХОДЯТСЯ ФРАГМЕНТЫ
          РЕАЛЬНЫХ ФАЙЛОВ ИЗ REPOSITORY:

          {coder_context}

          КРИТИЧЕСКИЕ ПРАВИЛА:

          1. Выполни именно задачу пользователя.

          2. Никогда не переписывай файл целиком.

          3. Никогда не возвращай полный файл.

          4. Используй только точечные изменения.

          5. operation всегда должна быть "replace".

          6. old должен быть точной строкой,
             существующей в реальном файле.

          7. new должен содержать только необходимую замену.

          8. old должен встречаться в файле ровно один раз.

          9. Не удаляй существующую функциональность.

          10. Не изменяй несвязанные участки.

          11. Не изменяй запрещённые файлы.

          12. Не изменяй README.md.

          13. Не изменяй worker.js.

          14. Не изменяй wrangler.toml.

          15. Не изменяй docs/PROJECT.md.

          16. Если задачу можно выполнить изменением
              одного файла — не меняй два.

          17. Не придумывай anchor.
              Используй только текст, который реально
              присутствует в предоставленном контексте.

          Верни ТОЛЬКО JSON:

          {{
            "changes": [
              {{
                "path": "index.html",
                "operation": "replace",
                "old": "точный существующий фрагмент",
                "new": "новый фрагмент"
              }}
            ]
          }}

          Если изменений не требуется:

          {{
            "changes": []
          }}
          """

          coder = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/CODER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": coder_prompt
                      }
                  ],
                  1800,
                  True
              )
          )

          # ============================================================
          # APPLY CODER CHANGES
          # ============================================================

          def apply_changes(changes):

              if not isinstance(
                  changes,
                  list
              ):
                  raise RuntimeError(
                      "changes must be a list."
                  )

              changed_paths = []

              for change in changes:

                  path = change.get(
                      "path"
                  )

                  operation = change.get(
                      "operation"
                  )

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Forbidden file: {path}"
                      )

                  if path in FORBIDDEN_FILES:
                      raise RuntimeError(
                          f"Forbidden modification: {path}"
                      )

                  if operation != "replace":
                      raise RuntimeError(
                          f"Unsupported operation: "
                          f"{operation}"
                      )

                  old = change.get("old")
                  new = change.get("new")

                  if not isinstance(
                      old,
                      str
                  ):
                      raise RuntimeError(
                          f"Invalid old content "
                          f"for {path}"
                      )

                  if not isinstance(
                      new,
                      str
                  ):
                      raise RuntimeError(
                          f"Invalid new content "
                          f"for {path}"
                      )

                  content = read_file(path)

                  count = content.count(old)

                  if count == 0:

                      raise RuntimeError(
                          f"Anchor not found "
                          f"in {path}."
                      )

                  if count > 1:

                      raise RuntimeError(
                          f"Anchor occurs "
                          f"{count} times "
                          f"in {path}. "
                          f"Refusing to guess."
                      )

                  old_lines = len(
                      old.splitlines()
                  )

                  new_lines = len(
                      new.splitlines()
                  )

                  deleted = old_lines
                  added = new_lines

                  # --------------------------------------------------
                  # DESTRUCTIVE CHANGE GUARD
                  # --------------------------------------------------

                  if deleted > 80:

                      raise RuntimeError(
                          f"Destructive change "
                          f"blocked in {path}: "
                          f"{deleted} old lines."
                      )

                  if (
                      deleted > 20
                      and added < deleted * 0.25
                  ):

                      raise RuntimeError(
                          f"Suspicious destructive "
                          f"change blocked in {path}."
                      )

                  updated = content.replace(
                      old,
                      new,
                      1
                  )

                  with open(
                      path,
                      "w",
                      encoding="utf-8"
                  ) as file:

                      file.write(updated)

                  changed_paths.append(
                      path
                  )

                  print(
                      f"Applied precise change: "
                      f"{path}"
                  )

              return sorted(
                  set(changed_paths)
              )

          changed_paths = apply_changes(
              coder.get("changes", [])
          )

          # ============================================================
          # DIFF
          # ============================================================

          print()
          print("========================================")
          print("CURRENT DIFF")
          print("========================================")

          diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run(
              "git diff --check"
          )

          # ============================================================
          # QA
          # ============================================================

          print()
          print("========================================")
          print("QA")
          print("========================================")

          qa_prompt = f"""
          Проведи независимую проверку реального diff.

          ИСХОДНАЯ ЗАДАЧА:
          {USER_TASK}

          DIFF:
          {diff[:8000]}

          Проверь:

          1. Задача действительно выполнена.
          2. Существующая функциональность сохранена.
          3. Нет уничтожения существующего кода.
          4. Нет лишних изменений.
          5. Нет изменений запрещённых файлов.
          6. Нет очевидных JavaScript ошибок.
          7. Нет очевидных HTML ошибок.
          8. Нет очевидных CSS ошибок.

          Ответ:

          PASS

          если всё корректно.

          Иначе:

          FAIL

          После PASS/FAIL кратко объясни результат.
          """

          qa_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/QA.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              700,
              False
          )

          print(qa_raw)

          qa_pass = bool(
              re.match(
                  r"^\s*PASS\b",
                  qa_raw,
                  re.IGNORECASE
              )
          )

          # ============================================================
          # REVIEWER
          # ============================================================

          print()
          print("========================================")
          print("REVIEWER")
          print("========================================")

          reviewer_prompt = f"""
          Проведи независимый review.

          ИСХОДНАЯ ЗАДАЧА:
          {USER_TASK}

          DIFF:
          {diff[:7000]}

          QA:
          {qa_raw[:2000]}

          Проверь:

          - соответствие задаче;
          - регрессии;
          - безопасность;
          - лишние изменения;
          - изменение запрещённых файлов;
          - уничтожение существующего функционала.

          Первая строка должна быть:

          APPROVE

          или:

          REJECT
          """

          reviewer_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/REVIEWER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              700,
              False
          )

          print(reviewer_raw)

          reviewer_reject = bool(
              re.match(
                  r"^\s*REJECT\b",
                  reviewer_raw,
                  re.IGNORECASE
              )
          )

          # ============================================================
          # FIXER
          # ============================================================

          if (
              not qa_pass
              or reviewer_reject
          ):

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_context = smart_context(
                  changed_paths
              )

              fixer_prompt = f"""
              Исправь реальные проблемы в текущем коде.

              ИСХОДНАЯ ЗАДАЧА:
              {USER_TASK}

              ТЕКУЩИЙ DIFF:
              {diff[:7000]}

              QA:
              {qa_raw[:2200]}

              REVIEWER:
              {reviewer_raw[:2200]}

              ТЕКУЩИЕ ФАЙЛЫ:
              {fixer_context}

              Используй только точечные изменения.

              НИКОГДА НЕ ПЕРЕПИСЫВАЙ ФАЙЛ ЦЕЛИКОМ.

              Верни:

              {{
                "changes": [
                  {{
                    "path": "app.js",
                    "operation": "replace",
                    "old": "точный существующий фрагмент",
                    "new": "исправленный фрагмент"
                  }}
                ]
              }}

              old должен существовать в текущем файле
              ровно один раз.

              Не меняй несвязанный код.
              """

              fixer = parse_json(
                  groq(
                      [
                          {
                              "role": "system",
                              "content": read_file(
                                  ".ai/CODER.md"
                              )
                          },
                          {
                              "role": "user",
                              "content": fixer_prompt
                          }
                      ],
                      1800,
                      True
                  )
              )

              fixer_paths = apply_changes(
                  fixer.get("changes", [])
              )

              changed_paths = sorted(
                  set(
                      changed_paths
                      + fixer_paths
                  )
              )

              run(
                  "git diff --check"
              )

          # ============================================================
          # FINAL DIFF
          # ============================================================

          print()
          print("========================================")
          print("FINAL DIFF")
          print("========================================")

          final_diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          # ============================================================
          # FINAL QA
          # ============================================================

          print()
          print("========================================")
          print("FINAL QA")
          print("========================================")

          final_qa_prompt = f"""
          Финальная проверка.

          ИСХОДНАЯ ЗАДАЧА:
          {USER_TASK}

          ФИНАЛЬНЫЙ DIFF:
          {final_diff[:8000]}

          Проверь:

          - задача выполнена;
          - существующая функциональность не уничтожена;
          - изменены только необходимые файлы;
          - запрещённые файлы не изменены;
          - нет очевидных ошибок.

          Ответ должен начинаться:

          PASS

          или:

          FAIL
          """

          final_qa = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/QA.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": final_qa_prompt
                  }
              ],
              650,
              False
          )

          print(final_qa)

          if not re.match(
              r"^\s*PASS\b",
              final_qa,
              re.IGNORECASE
          ):

              raise RuntimeError(
                  "Final QA returned FAIL."
              )

          # ============================================================
          # FINAL REVIEW
          # ============================================================

          print()
          print("========================================")
          print("FINAL REVIEW")
          print("========================================")

          final_review = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/REVIEWER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": f"""
                      Финальный review.

                      ИСХОДНАЯ ЗАДАЧА:
                      {USER_TASK}

                      FINAL QA:
                      {final_qa[:2000]}

                      FINAL DIFF:
                      {final_diff[:8000]}

                      Первая строка:

                      APPROVE

                      или:

                      REJECT
                      """
                  }
              ],
              650,
              False
          )

          print(final_review)

          if re.match(
              r"^\s*REJECT\b",
              final_review,
              re.IGNORECASE
          ):

              raise RuntimeError(
                  "Final Reviewer returned REJECT."
              )

          # ============================================================
          # FINAL CHECK
          # ============================================================

          print()
          print("========================================")
          print("FINAL CHECK")
          print("========================================")

          run(
              "git diff --check"
          )

          final_diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          if not final_diff.strip():

              print("No changes.")
              raise SystemExit(0)

          # ============================================================
          # FORBIDDEN FILE GUARD
          # ============================================================

          forbidden_diff = run(
              "git diff --name-only"
          ).splitlines()

          for path in forbidden_diff:

              if path in FORBIDDEN_FILES:

                  raise RuntimeError(
                      f"Forbidden file changed: "
                      f"{path}"
                  )

          # ============================================================
          # COMMIT
          # ============================================================

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run(
              'git config user.name "LORGUS AI"'
          )

          run(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run(
              "git add -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run(
              'git commit -m '
              '"AI: update LORGUS project"'
          )

          run(
              "git push origin HEAD"
          )

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
