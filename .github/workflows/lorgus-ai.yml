name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODELS_URL: https://api.groq.com/openai/v1/models

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # GROQ PREFLIGHT
      # ============================================================

      - name: Groq preflight diagnostics
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ.get("GROQ_API_KEY", "")
          model = os.environ.get("GROQ_MODEL", "")
          url = os.environ.get("GROQ_MODELS_URL", "")

          print("========================================")
          print("GROQ PREFLIGHT DIAGNOSTICS")
          print("========================================")

          if not key:
              print("ERROR: GitHub Secret 'API' is empty or unavailable.")
              raise SystemExit(1)

          print("API key detected: YES")
          print(f"API key length: {len(key)}")
          print(f"Target model: {model}")
          print()

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
                  "User-Agent": "LORGUS-GitHub-Actions"
              },
              method="GET"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  data = json.loads(body)
                  models = data.get("data", [])

                  ids = sorted(
                      item.get("id")
                      for item in models
                      if item.get("id")
                  )

                  print(f"Models endpoint HTTP: {response.status}")
                  print(f"Available models: {len(ids)}")

                  if model in ids:
                      print(f"Target model '{model}': AVAILABLE")
                  else:
                      print(
                          f"ERROR: target model '{model}' "
                          "is not available."
                      )

                      print()
                      print("Available gpt-oss models:")

                      for model_id in ids:
                          if "gpt-oss" in model_id:
                              print(f"  - {model_id}")

                      raise SystemExit(2)

          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(f"Models endpoint HTTP: {error.code}")
              print("Groq response:")
              print(body)
              print()

              if error.code == 401:
                  print("DIAGNOSIS: invalid authentication.")
              elif error.code == 403:
                  print("DIAGNOSIS: permission/security rejection.")
              elif error.code == 429:
                  print("DIAGNOSIS: rate limit.")
              else:
                  print("DIAGNOSIS: unexpected Groq error.")

              raise SystemExit(3)
          PY

      # ============================================================
      # MAIN PIPELINE
      # ============================================================

      - name: Run LORGUS AI agents
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import urllib.request
          import urllib.error
          import subprocess

          GROQ_API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          TASK = os.environ["TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          # Максимальный размер контекста в символах.
          # Это специально ограничено, чтобы не пробивать
          # бесплатный лимит Groq 8000 TPM.
          MAX_CONTEXT_CHARS = 10000

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("TASK:")
          print(TASK)
          print()

          # ========================================================
          # COMMANDS
          # ========================================================

          def run_command(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed with code "
                      f"{result.returncode}: {command}"
                  )

              return result.stdout

          # ========================================================
          # GROQ
          # ========================================================

          def groq_call(messages, max_tokens):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens
              }

              body = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  GROQ_URL,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {GROQ_API_KEY}",
                      "Content-Type": "application/json",
                      "User-Agent": "LORGUS-GitHub-Actions"
                  },
                  method="POST"
              )

              last_error = None

              for attempt in range(1, 3):

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          raw = response.read().decode(
                              "utf-8",
                              errors="replace"
                          )

                          data = json.loads(raw)

                          return data[
                              "choices"
                          ][0][
                              "message"
                          ][
                              "content"
                          ]

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print()
                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/2)"
                      )
                      print("Response body:")
                      print(raw)
                      print()

                      last_error = (
                          f"Groq HTTP {error.code}: {raw}"
                      )

                      if error.code in (401, 403):
                          break

                      if error.code == 413:
                          print(
                              "REQUEST TOO LARGE: "
                              "reduce context or output size."
                          )
                          break

                      if error.code == 429:
                          time.sleep(5)
                          continue

                      time.sleep(3)

                  except Exception as error:

                      print(
                          f"Groq request error "
                          f"(attempt {attempt}/2): {error}"
                      )

                      last_error = str(error)
                      time.sleep(3)

              raise RuntimeError(
                  last_error or "Groq request failed"
              )

          # ========================================================
          # JSON
          # ========================================================

          def clean_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )

                  text = re.sub(
                      r"\s*```$",
                      "",
                      text
                  )

              return text.strip()

          # ========================================================
          # FILES
          # ========================================================

          def read_file(path):
              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  return file.read()

          def write_file(path, lines):
              content = "\n".join(lines)

              if not content.endswith("\n"):
                  content += "\n"

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(content)

          def current_files():
              result = {}

              for path in sorted(ALLOWED_FILES):
                  if os.path.isfile(path):
                      result[path] = read_file(path)

              return result

          def relevant_files(task):
              task_lower = task.lower()

              selected = set()

              mapping = {
                  "readme": ["README.md"],
                  "html": ["index.html"],
                  "страниц": ["index.html"],
                  "интерфейс": [
                      "index.html",
                      "style.css",
                      "app.js"
                  ],
                  "ui": [
                      "index.html",
                      "style.css",
                      "app.js"
                  ],
                  "css": ["style.css"],
                  "стиль": ["style.css"],
                  "javascript": ["app.js"],
                  "javascript": ["app.js"],
                  "js": ["app.js"],
                  "логик": ["app.js"],
                  "supabase": [
                      "app.js",
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "cloudflare": [
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "worker": [
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "wrangler": ["wrangler.toml"],
                  "конфиг": ["wrangler.toml"],
                  "докум": ["docs/PROJECT.md"],
                  "архитект": ["docs/PROJECT.md"],
                  "проект": ["docs/PROJECT.md"]
              }

              for keyword, paths in mapping.items():
                  if keyword in task_lower:
                      selected.update(paths)

              if not selected:
                  selected = set(ALLOWED_FILES)

              return sorted(selected)

          # ========================================================
          # CONTEXT LIMITER
          # ========================================================

          def build_context(paths, max_chars=MAX_CONTEXT_CHARS):
              files = current_files()

              result = []
              total = 0

              for path in paths:

                  if path not in files:
                      continue

                  content = files[path]

                  remaining = max_chars - total

                  if remaining <= 0:
                      break

                  if len(content) > remaining:
                      content = (
                          content[:remaining]
                          + "\n\n[CONTEXT TRUNCATED]\n"
                      )

                  block = (
                      f"\n===== FILE: {path} =====\n"
                      f"{content}"
                      f"\n===== END FILE: {path} =====\n"
                  )

                  result.append(block)
                  total += len(block)

              return "\n".join(result)

          # ========================================================
          # RELEVANT FILES
          # ========================================================

          selected = relevant_files(TASK)

          print("Relevant files:")

          for path in selected:
              print(f"  - {path}")

          print()

          # ========================================================
          # ARCHITECT
          # ========================================================

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect_context = build_context(
              selected,
              max_chars=8000
          )

          architect_prompt = f"""
          Проанализируй проект LORGUS.

          ЗАДАЧА:
          {TASK}

          ТЕКУЩИЙ КОД:
          {architect_context}

          Ничего не изменяй.

          Верни ТОЛЬКО JSON:

          {{
            "problem": "...",
            "cause": "...",
            "files": ["..."],
            "plan": ["..."],
            "risks": ["..."],
            "checks": ["..."]
          }}

          Не создавай diff.
          Не возвращай код.
          Не придумывай отсутствующие файлы.
          """

          architect_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/ARCHITECT.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": architect_prompt
                  }
              ],
              1200
          )

          architect_raw = clean_json(
              architect_raw
          )

          architect = json.loads(
              architect_raw
          )

          print(
              json.dumps(
                  architect,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ========================================================
          # CODER
          # ========================================================

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_context = build_context(
              selected,
              max_chars=9000
          )

          coder_prompt = f"""
          Ты Coding Agent проекта LORGUS.

          ЗАДАЧА:
          {TASK}

          ПЛАН ARCHITECT:
          {json.dumps(
              architect,
              ensure_ascii=False
          )}

          ТЕКУЩИЕ ФАЙЛЫ:
          {coder_context}

          Внеси минимальные необходимые изменения.

          Разрешённые файлы:
          {sorted(ALLOWED_FILES)}

          Верни ТОЛЬКО JSON:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "полное",
                  "содержимое",
                  "файла"
                ]
              }}
            ]
          }}

          ВАЖНО:

          - content_lines = ПОЛНОЕ содержимое файла;
          - НЕ используй unified diff;
          - НЕ используй markdown fences;
          - НЕ меняй несвязанные файлы;
          - НЕ удаляй существующую функциональность;
          - если изменений не нужно, верни {{"changes":[]}};
          - каждый path должен быть разрешён.
          """

          coder_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/CODER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": coder_prompt
                  }
              ],
              3500
          )

          coder_raw = clean_json(
              coder_raw
          )

          coder = json.loads(
              coder_raw
          )

          changes = coder.get(
              "changes",
              []
          )

          changed_paths = []

          for change in changes:

              path = change.get("path")
              lines = change.get(
                  "content_lines"
              )

              if path not in ALLOWED_FILES:
                  raise RuntimeError(
                      f"Coder attempted to modify "
                      f"forbidden file: {path}"
                  )

              if not isinstance(lines, list):
                  raise RuntimeError(
                      f"Invalid content_lines for {path}"
                  )

              write_file(
                  path,
                  lines
              )

              changed_paths.append(path)

          # ========================================================
          # DIFF AFTER CODER
          # ========================================================

          print()
          print("========================================")
          print("CURRENT DIFF")
          print("========================================")

          diff = run_command(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run_command(
              "git diff --check"
          )

          # ========================================================
          # QA
          # ========================================================

          print()
          print("========================================")
          print("QA")
          print("========================================")

          # ВАЖНО:
          # здесь читаются ФАКТИЧЕСКИЕ текущие файлы,
          # а не старый snapshot до Coder.

          qa_context = build_context(
              changed_paths,
              max_chars=7000
          )

          qa_diff = diff[:6000]

          qa_prompt = f"""
          Проверь реальные изменения LORGUS.

          ЗАДАЧА:
          {TASK}

          CURRENT DIFF:
          {qa_diff}

          АКТУАЛЬНОЕ СОДЕРЖИМОЕ ИЗМЕНЁННЫХ ФАЙЛОВ:
          {qa_context}

          Проверь:

          - задача действительно выполнена;
          - изменения реально присутствуют;
          - нет синтаксических ошибок;
          - нет регрессий;
          - изменены только необходимые файлы.

          Для простой текстовой задачи проверяй реальное содержимое
          файла, а не только diff.

          Первая строка ответа должна быть строго:

          PASS

          или

          FAIL

          После неё краткое объяснение.
          """

          qa_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/QA.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              1200
          )

          print(qa_raw)

          qa_pass = bool(
              re.match(
                  r"^\s*PASS\b",
                  qa_raw,
                  re.IGNORECASE
              )
          )

          # ========================================================
          # REVIEWER
          # ========================================================

          print()
          print("========================================")
          print("REVIEWER")
          print("========================================")

          reviewer_prompt = f"""
          Проверь изменения LORGUS.

          ЗАДАЧА:
          {TASK}

          DIFF:
          {diff[:7000]}

          QA:
          {qa_raw[:3000]}

          Проверь:

          - безопасность;
          - секреты;
          - Supabase;
          - Cloudflare;
          - XSS;
          - регрессии;
          - несвязанные изменения;
          - соответствие задаче.

          Не переписывай код.

          Первая строка строго:

          APPROVE

          или

          REJECT
          """

          reviewer_raw = groq_call(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/REVIEWER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              1200
          )

          print(reviewer_raw)

          reviewer_match = re.match(
              r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          reviewer_status = ""

          if reviewer_match:
              reviewer_status = (
                  reviewer_match
                  .group(1)
                  .upper()
              )

          reviewer_reject = (
              reviewer_status.startswith(
                  "REJECT"
              )
          )

          # ========================================================
          # FIXER
          # ========================================================

          if (not qa_pass) or reviewer_reject:

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_context = build_context(
                  changed_paths,
                  max_chars=7000
              )

              fixer_prompt = f"""
              Исправь проблемы, найденные QA или Reviewer.

              ЗАДАЧА:
              {TASK}

              CURRENT DIFF:
              {diff[:6000]}

              QA:
              {qa_raw[:3000]}

              REVIEWER:
              {reviewer_raw[:3000]}

              АКТУАЛЬНЫЕ ФАЙЛЫ:
              {fixer_context}

              Исправляй только реальные проблемы.

              Верни ТОЛЬКО JSON:

              {{
                "changes": [
                  {{
                    "path": "README.md",
                    "content_lines": [
                      "полное",
                      "исправленное",
                      "содержимое"
                    ]
                  }}
                ]
              }}

              Не используй diff.
              Не меняй несвязанные файлы.
              """

              fixer_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/CODER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": fixer_prompt
                      }
                  ],
                  3500
              )

              fixer_raw = clean_json(
                  fixer_raw
              )

              fixer = json.loads(
                  fixer_raw
              )

              fixer_changes = fixer.get(
                  "changes",
                  []
              )

              fixer_paths = []

              for change in fixer_changes:

                  path = change.get("path")
                  lines = change.get(
                      "content_lines"
                  )

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Fixer attempted to modify "
                          f"forbidden file: {path}"
                      )

                  if not isinstance(lines, list):
                      raise RuntimeError(
                          f"Invalid content_lines for {path}"
                      )

                  write_file(
                      path,
                      lines
                  )

                  fixer_paths.append(path)

              run_command(
                  "git diff --check"
              )

              # ====================================================
              # FINAL QA
              # ====================================================

              print()
              print("========================================")
              print("FINAL QA")
              print("========================================")

              final_paths = sorted(
                  set(changed_paths + fixer_paths)
              )

              final_context = build_context(
                  final_paths,
                  max_chars=7000
              )

              final_diff = run_command(
                  "git diff -- "
                  "README.md "
                  "index.html "
                  "app.js "
                  "style.css "
                  "worker.js "
                  "wrangler.toml "
                  "docs/PROJECT.md"
              )

              final_qa_prompt = f"""
              Проведи финальную проверку LORGUS.

              ЗАДАЧА:
              {TASK}

              ФИНАЛЬНЫЙ DIFF:
              {final_diff[:6000]}

              АКТУАЛЬНЫЕ ФАЙЛЫ:
              {final_context}

              Убедись, что:

              1. первоначальная задача выполнена;
              2. проблемы QA исправлены;
              3. проблемы Reviewer исправлены;
              4. нет очевидных регрессий.

              Первая строка строго:

              PASS

              или

              FAIL
              """

              final_qa_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/QA.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": final_qa_prompt
                      }
                  ],
                  1200
              )

              print(final_qa_raw)

              if not re.match(
                  r"^\s*PASS\b",
                  final_qa_raw,
                  re.IGNORECASE
              ):
                  raise RuntimeError(
                      "Final QA returned FAIL."
                  )

              # ====================================================
              # FINAL REVIEW
              # ====================================================

              print()
              print("========================================")
              print("FINAL REVIEW")
              print("========================================")

              final_review_prompt = f"""
              Проведи финальный review изменений LORGUS.

              ЗАДАЧА:
              {TASK}

              FINAL QA:
              {final_qa_raw[:3000]}

              FINAL DIFF:
              {final_diff[:7000]}

              Если всё соответствует задаче,
              первая строка должна быть:

              APPROVE

              Иначе:

              REJECT
              """

              final_reviewer_raw = groq_call(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/REVIEWER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": final_review_prompt
                      }
                  ],
                  1200
              )

              print(final_reviewer_raw)

              final_match = re.match(
                  r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
                  final_reviewer_raw,
                  re.IGNORECASE
              )

              if not final_match:
                  raise RuntimeError(
                      "Final Reviewer returned invalid status."
                  )

              final_status = (
                  final_match
                  .group(1)
                  .upper()
              )

              if final_status.startswith(
                  "REJECT"
              ):
                  raise RuntimeError(
                      "Final Reviewer returned REJECT."
                  )

          else:

              print()
              print(
                  "QA and Reviewer approved "
                  "the first implementation."
              )

          # ========================================================
          # FINAL DIFF
          # ========================================================

          print()
          print("========================================")
          print("FINAL DIFF CHECK")
          print("========================================")

          run_command(
              "git diff --check"
          )

          final_diff = run_command(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          if not final_diff.strip():

              print(
                  "No changes detected."
              )

              raise SystemExit(0)

          # ========================================================
          # COMMIT
          # ========================================================

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

