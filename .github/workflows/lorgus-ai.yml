name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run LORGUS AI
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          USER_TASK = os.environ["USER_TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          FORBIDDEN_FILES = {
              "README.md",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("USER TASK:")
          print(USER_TASK)
          print()

          # ============================================================
          # SHELL
          # ============================================================

          def run(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          # ============================================================
          # GROQ
          # ============================================================

          def groq(messages, max_tokens):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens,
                  "response_format": {
                      "type": "json_object"
                  }
              }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              for attempt in range(1, 4):

                  request = urllib.request.Request(
                      GROQ_URL,
                      data=body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "LORGUS-GitHub-Actions"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          data = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                          return data[
                              "choices"
                          ][0][
                              "message"
                          ][
                              "content"
                          ]

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/3)"
                      )

                      print(raw)

                      if error.code == 429:

                          wait = 30

                          match = re.search(
                              r"try again in ([0-9.]+)s",
                              raw,
                              re.IGNORECASE
                          )

                          if match:
                              wait = max(
                                  30,
                                  int(
                                      float(
                                          match.group(1)
                                      )
                                  ) + 3
                              )

                          print(
                              f"Waiting {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      if error.code == 413:
                          raise RuntimeError(
                              "Groq request is too large."
                          )

                      raise RuntimeError(
                          f"Groq HTTP {error.code}: {raw}"
                      )

              raise RuntimeError(
                  "Groq rate limit retry exhausted."
              )

          # ============================================================
          # JSON
          # ============================================================

          def parse_json(raw):

              raw = raw.strip()

              if raw.startswith("```"):

                  raw = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      raw,
                      flags=re.IGNORECASE
                  )

                  raw = re.sub(
                      r"\s*```$",
                      "",
                      raw
                  )

              try:
                  return json.loads(raw)

              except json.JSONDecodeError as error:

                  print("INVALID JSON:")
                  print(raw)

                  raise RuntimeError(
                      f"Invalid JSON: {error}"
                  )

          # ============================================================
          # FILES
          # ============================================================

          def read_file(path):

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  return file.read()

          def existing_files():

              return {
                  path: read_file(path)
                  for path in sorted(ALLOWED_FILES)
                  if os.path.isfile(path)
              }

          # ============================================================
          # FILE SELECTION
          # ============================================================

          def select_files(task):

              text = task.lower()

              selected = set()

              rules = {
                  "html": {"index.html"},
                  "страниц": {"index.html"},
                  "интерфейс": {
                      "index.html",
                      "style.css",
                      "app.js"
                  },
                  "кноп": {
                      "index.html",
                      "style.css",
                      "app.js"
                  },
                  "ui": {
                      "index.html",
                      "style.css",
                      "app.js"
                  },
                  "javascript": {"app.js"},
                  "javascript": {"app.js"},
                  "логик": {"app.js"},
                  "обработчик": {"app.js"},
                  "js": {"app.js"},
                  "css": {"style.css"},
                  "стиль": {"style.css"},
                  "worker": {"worker.js"},
                  "cloudflare": {
                      "worker.js",
                      "wrangler.toml"
                  },
                  "wrangler": {"wrangler.toml"},
                  "supabase": {"app.js"},
                  "readme": {"README.md"},
                  "project.md": {"docs/PROJECT.md"}
              }

              for keyword, paths in rules.items():

                  if keyword in text:
                      selected.update(paths)

              # Если задача не позволяет определить файлы,
              # даём AI ограниченный обзор основных файлов.
              if not selected:

                  selected.update({
                      "index.html",
                      "app.js",
                      "style.css"
                  })

              return sorted(selected)

          # ============================================================
          # CONTEXT
          # ============================================================

          def context_for(path, content):

              lines = content.splitlines()

              # Для небольших файлов даём всё содержимое.
              if len(content) <= 5000:
                  return content

              selected = set()

              patterns = {
                  "index.html": (
                      r"<body|<main|<header|<section|"
                      r"<button|<script|id=|class="
                  ),

                  "app.js": (
                      r"function\s+|async\s+function|"
                      r"DOMContentLoaded|addEventListener|"
                      r"querySelector|getElementById|"
                      r"innerHTML|createElement|"
                      r"render[A-Z]|window\."
                  ),

                  "style.css": (
                      r"button|\.btn|#|input|"
                      r"header|main|section"
                  )
              }

              pattern = patterns.get(path)

              if pattern:

                  regex = re.compile(
                      pattern,
                      re.IGNORECASE
                  )

                  for i, line in enumerate(lines):

                      if regex.search(line):

                          start = max(0, i - 4)
                          end = min(
                              len(lines),
                              i + 5
                          )

                          selected.update(
                              range(start, end)
                          )

              # Начало файла
              selected.update(
                  range(
                      min(20, len(lines))
                  )
              )

              indexes = sorted(selected)

              result = []
              last = None

              for i in indexes:

                  if (
                      last is not None
                      and i > last + 1
                  ):
                      result.append(
                          "\n... [GAP] ...\n"
                      )

                  result.append(
                      f"{i + 1}: {lines[i]}"
                  )

                  last = i

              text = "\n".join(result)

              if len(text) > 6000:
                  text = text[:6000] + \
                      "\n... [TRUNCATED] ..."

              return text

          def build_context(paths):

              files = existing_files()
              blocks = []

              for path in paths:

                  if path not in files:
                      continue

                  blocks.append(
                      "\n===== FILE: "
                      + path
                      + " =====\n"
                      + context_for(
                          path,
                          files[path]
                      )
                      + "\n===== END FILE =====\n"
                  )

              return "\n".join(blocks)

          # ============================================================
          # SELECT CONTEXT
          # ============================================================

          selected = select_files(
              USER_TASK
          )

          print("Files supplied to AI:")

          for path in selected:
              print(f"  - {path}")

          print()

          context = build_context(
              selected
          )

          # ============================================================
          # AI
          # ============================================================

          print("========================================")
          print("LORGUS AI")
          print("========================================")

          system_prompt = """
          Ты единственный Coding Agent проекта LORGUS.

          Ты работаешь непосредственно с Git repository.

          Репозиторий является источником истины.

          Твоя задача:
          1. Изучить предоставленный реальный код.
          2. Понять существующую архитектуру.
          3. Выполнить задачу пользователя.
          4. Изменить только необходимые файлы.
          5. Не ломать существующую функциональность.
          6. Использовать существующий код вместо переписывания.
          7. Делать минимальные точечные изменения.

          КРИТИЧЕСКИЕ ПРАВИЛА:

          - Никогда не переписывай файл целиком.
          - Никогда не возвращай полный файл.
          - Используй только operation "replace".
          - old должен быть точной строкой из предоставленного кода.
          - old должен встречаться ровно один раз.
          - new должен содержать только необходимую замену.
          - Не удаляй существующую функциональность.
          - Не меняй несвязанный код.
          - Не придумывай отсутствующий код.
          - Не создавай новые файлы без крайней необходимости.
          - README.md запрещён для изменения.
          - worker.js запрещён для изменения.
          - wrangler.toml запрещён для изменения.
          - docs/PROJECT.md запрещён для изменения.
          - Если достаточно одного файла — меняй один файл.

          Пользовательская задача имеет абсолютный приоритет.

          Верни ТОЛЬКО валидный JSON:

          {
            "changes": [
              {
                "path": "app.js",
                "operation": "replace",
                "old": "точный существующий фрагмент",
                "new": "необходимая замена"
              }
            ]
          }

          Если изменений не требуется:

          {
            "changes": []
          }
          """

          user_prompt = f"""
          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:

          {USER_TASK}

          РЕАЛЬНЫЙ КОД ПРОЕКТА:

          {context}

          Выполни задачу.

          Не выполняй никаких изменений, которые пользователь
          прямо запретил.

          Не возвращай полный файл.
          Используй только точечные replace-изменения.
          """

          response = groq(
              [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              2200
          )

          changes = parse_json(
              response
          ).get(
              "changes",
              []
          )

          if not isinstance(
              changes,
              list
          ):
              raise RuntimeError(
                  "AI changes must be a list."
              )

          print()
          print("AI requested changes:")

          print(
              json.dumps(
                  changes,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ============================================================
          # APPLY CHANGES
          # ============================================================

          changed_paths = []

          for change in changes:

              path = change.get("path")
              operation = change.get("operation")
              old = change.get("old")
              new = change.get("new")

              if path not in ALLOWED_FILES:
                  raise RuntimeError(
                      f"Forbidden file: {path}"
                  )

              if path in FORBIDDEN_FILES:
                  raise RuntimeError(
                      f"Forbidden modification: {path}"
                  )

              if operation != "replace":
                  raise RuntimeError(
                      f"Unsupported operation: {operation}"
                  )

              if not isinstance(old, str):
                  raise RuntimeError(
                      f"Invalid old content: {path}"
                  )

              if not isinstance(new, str):
                  raise RuntimeError(
                      f"Invalid new content: {path}"
                  )

              content = read_file(path)

              count = content.count(old)

              if count == 0:
                  raise RuntimeError(
                      f"Anchor not found in {path}."
                  )

              if count > 1:
                  raise RuntimeError(
                      f"Anchor occurs {count} times "
                      f"in {path}. Refusing to guess."
                  )

              old_lines = len(
                  old.splitlines()
              )

              if old_lines > 40:
                  raise RuntimeError(
                      f"Large replacement blocked "
                      f"in {path}: {old_lines} lines."
                  )

              updated = content.replace(
                  old,
                  new,
                  1
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(updated)

              changed_paths.append(
                  path
              )

              print(
                  f"Applied precise change: {path}"
              )

          changed_paths = sorted(
              set(changed_paths)
          )

          # ============================================================
          # DIFF
          # ============================================================

          print()
          print("========================================")
          print("DIFF")
          print("========================================")

          diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          if not diff.strip():

              print("AI made no changes.")
              raise SystemExit(0)

          run(
              "git diff --check"
          )

          # ============================================================
          # BASIC AUTOMATIC CHECKS
          # ============================================================

          print()
          print("========================================")
          print("CHECKS")
          print("========================================")

          if "app.js" in changed_paths:

              run(
                  "node --check app.js"
              )

              print(
                  "JavaScript syntax: PASS"
              )

          # Проверяем запрещённые файлы.
          changed_by_git = run(
              "git diff --name-only"
          ).splitlines()

          for path in changed_by_git:

              if path in FORBIDDEN_FILES:
                  raise RuntimeError(
                      f"Forbidden file changed: {path}"
                  )

          print(
              "Forbidden files: PASS"
          )

          print(
              "Git diff check: PASS"
          )

          # ============================================================
          # COMMIT
          # ============================================================

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run(
              'git config user.name "LORGUS AI"'
          )

          run(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run(
              "git add -- "
              "index.html "
              "app.js "
              "style.css"
          )

          run(
              'git commit -m '
              '"AI: update LORGUS project"'
          )

          run(
              "git push origin HEAD"
          )

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
