name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      CEREBRAS_API_KEY: ${{ secrets.API }}
      CEREBRAS_MODEL: gpt-oss-120b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI workspace
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import subprocess
          import sys
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("CEREBRAS_API_KEY")
          MODEL = os.environ.get("CEREBRAS_MODEL", "gpt-oss-120b")
          TASK = os.environ.get("USER_TASK", "").strip()

          if not API_KEY:
              raise RuntimeError(
                  "CEREBRAS_API_KEY is missing. "
                  "Put the Cerebras API key into GitHub Secret 'API'."
              )

          if not TASK:
              raise RuntimeError("USER_TASK is empty.")

          API_URL = "https://api.cerebras.ai/v1/chat/completions"

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md",
          }

          MAX_RETRIES = 3

          def run_cmd(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed:\n{command}\n\n"
                      f"STDOUT:\n{result.stdout}\n\n"
                      f"STDERR:\n{result.stderr}"
                  )

              return result.stdout

          def scan_repository():
              files = {}

              for path in sorted(ALLOWED_FILES):
                  if os.path.isfile(path):
                      with open(path, "r", encoding="utf-8") as f:
                          files[path] = f.read()

              return files

          def format_repository(files):
              result = []

              for path, content in files.items():
                  result.append(
                      f"\n===== FILE: {path} =====\n"
                      f"{content}\n"
                      f"===== END FILE: {path} =====\n"
                  )

              return "\n".join(result)

          def call_ai(messages, temperature=0.2):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": temperature,
                  "max_completion_tokens": 12000
              }

              data = json.dumps(payload).encode("utf-8")

              for attempt in range(1, MAX_RETRIES + 1):
                  request = urllib.request.Request(
                      API_URL,
                      data=data,
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": f"Bearer {API_KEY}"
                      },
                      method="POST"
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          body = response.read().decode("utf-8")
                          result = json.loads(body)

                          return result["choices"][0]["message"]["content"]

                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="replace")

                      print(
                          f"\nCerebras HTTP {e.code} "
                          f"(attempt {attempt}/{MAX_RETRIES})"
                      )
                      print(body)

                      if e.code == 429:
                          if attempt < MAX_RETRIES:
                              time.sleep(5 * attempt)
                              continue

                          raise RuntimeError(
                              "Cerebras rate limit exceeded."
                          )

                      if e.code in (401, 403):
                          raise RuntimeError(
                              "Cerebras authentication failed. "
                              "Check GitHub Secret 'API'."
                          )

                      if attempt < MAX_RETRIES:
                          time.sleep(3 * attempt)
                          continue

                      raise RuntimeError(
                          f"Cerebras returned HTTP {e.code}."
                      )

                  except Exception as e:
                      print(
                          f"\nCerebras request error "
                          f"(attempt {attempt}/{MAX_RETRIES}): {e}"
                      )

                      if attempt < MAX_RETRIES:
                          time.sleep(3 * attempt)
                          continue

                      raise

          def extract_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )
                  text = re.sub(
                      r"\s*```$",
                      "",
                      text
                  )

              start = text.find("{")
              end = text.rfind("}")

              if start == -1 or end == -1 or end <= start:
                  raise RuntimeError(
                      "AI did not return a JSON object.\n\n"
                      + text
                  )

              candidate = text[start:end + 1]

              try:
                  return json.loads(candidate)
              except json.JSONDecodeError as e:
                  raise RuntimeError(
                      "AI returned invalid JSON.\n\n"
                      f"Error: {e}\n\n"
                      f"Response:\n{candidate}"
                  )

          def validate_changes(data):
              if not isinstance(data, dict):
                  raise RuntimeError("AI changes response is not an object.")

              changes = data.get("changes")

              if not isinstance(changes, list):
                  raise RuntimeError(
                      "AI response does not contain 'changes' array."
                  )

              validated = []

              for change in changes:
                  if not isinstance(change, dict):
                      raise RuntimeError("Invalid change object.")

                  path = change.get("path")
                  content_lines = change.get("content_lines")

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"AI attempted to modify forbidden file: {path}"
                      )

                  if not isinstance(content_lines, list):
                      raise RuntimeError(
                          f"'content_lines' must be an array for {path}"
                      )

                  if not all(
                      isinstance(line, str)
                      for line in content_lines
                  ):
                      raise RuntimeError(
                          f"Every content_lines item must be a string: {path}"
                      )

                  validated.append(
                      {
                          "path": path,
                          "content_lines": content_lines
                      }
                  )

              return validated

          def apply_changes(changes):
              for change in changes:
                  path = change["path"]
                  content = "\n".join(change["content_lines"])

                  if not content.endswith("\n"):
                      content += "\n"

                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

                  print(f"UPDATED: {path}")

          def print_section(title, content):
              print("\n")
              print("=" * 80)
              print(title)
              print("=" * 80)
              print(content)
              print("=" * 80)

          # ------------------------------------------------------------
          # REPOSITORY
          # ------------------------------------------------------------

          repository = scan_repository()
          repository_text = format_repository(repository)

          print_section(
              "REPOSITORY BEFORE AI",
              repository_text
          )

          # ------------------------------------------------------------
          # ARCHITECT
          # ------------------------------------------------------------

          architect_prompt = f"""
          You are ARCHITECT of the LORGUS project.

          Read the repository provided below.

          Your task is to analyze how the requested change should be
          implemented.

          DO NOT modify files.

          DO NOT output code.

          DO NOT output a diff.

          DO NOT invent files or functionality that do not exist.

          Determine:

          1. What the user wants.
          2. Which existing files are relevant.
          3. How the current implementation works.
          4. What must be changed.
          5. What must NOT be changed.
          6. Possible regression risks.
          7. How the result should be verified.

          Keep the plan concise.

          USER TASK:
          {TASK}

          REPOSITORY:
          {repository_text}
          """

          architect = call_ai(
              [
                  {
                      "role": "system",
                      "content": """
                      You are the Architect Agent of LORGUS.
                      Analyze the real repository.
                      Never invent repository contents.
                      Never modify code.
                      """
                  },
                  {
                      "role": "user",
                      "content": architect_prompt
                  }
              ]
          )

          print_section(
              "ARCHITECT",
              architect
          )

          # ------------------------------------------------------------
          # CODER
          # ------------------------------------------------------------

          coder_prompt = f"""
          You are CODER of the LORGUS project.

          Implement the user's task using the repository below.

          IMPORTANT RULES:

          1. Read the existing files carefully.
          2. Preserve existing functionality.
          3. Make the smallest necessary changes.
          4. Do not rewrite unrelated code.
          5. Do not modify files unrelated to the task.
          6. Do not create new files.
          7. Only these files may be changed:

             README.md
             index.html
             app.js
             style.css
             worker.js
             wrangler.toml
             docs/PROJECT.md

          8. Return ONLY valid JSON.
          9. Do not use Markdown code fences.
          10. Do not return a git diff.
          11. Each changed file must contain its COMPLETE final content.
          12. Files that do not need changes must not appear.

          Required JSON format:

          {{
            "changes": [
              {{
                "path": "README.md",
                "content_lines": [
                  "line 1",
                  "line 2"
                ]
              }}
            ]
          }}

          If no changes are necessary:

          {{
            "changes": []
          }}

          USER TASK:
          {TASK}

          ARCHITECT PLAN:
          {architect}

          CURRENT REPOSITORY:
          {repository_text}
          """

          coder_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": """
                      You are the Coding Agent of LORGUS.
                      Return strict JSON only.
                      Never return a diff.
                      """
                  },
                  {
                      "role": "user",
                      "content": coder_prompt
                  }
              ]
          )

          print_section(
              "CODER RAW RESPONSE",
              coder_raw
          )

          coder_data = extract_json(coder_raw)
          coder_changes = validate_changes(coder_data)

          if coder_changes:
              apply_changes(coder_changes)
          else:
              print("\nCODER: NO CHANGES")

          # ------------------------------------------------------------
          # GIT DIFF
          # ------------------------------------------------------------

          diff_after_coder = run_cmd(
              "git diff -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          print_section(
              "DIFF AFTER CODER",
              diff_after_coder or "NO DIFF"
          )

          if not diff_after_coder.strip():
              print("\nNo code changes were produced.")

              if TASK.lower().find("ничего не изменяй") >= 0:
                  print("Task explicitly requested no changes.")
                  sys.exit(0)

          # ------------------------------------------------------------
          # QA
          # ------------------------------------------------------------

          current_repository = scan_repository()
          current_repository_text = format_repository(
              current_repository
          )

          qa_prompt = f"""
          You are QA of the LORGUS project.

          Check the actual repository after the Coder changes.

          USER TASK:
          {TASK}

          ARCHITECT PLAN:
          {architect}

          CURRENT REPOSITORY:
          {current_repository_text}

          GIT DIFF:
          {diff_after_coder}

          Verify:

          - requested functionality;
          - JavaScript syntax and logic;
          - HTML;
          - CSS;
          - API interaction;
          - Supabase usage;
          - Cloudflare Worker;
          - regressions;
          - accidental unrelated changes;
          - security problems.

          You must start your response with exactly:

          PASS

          or:

          FAIL

          If FAIL, explain concrete problems.
          """

          qa_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": """
                      You are the QA Agent of LORGUS.
                      Test the actual repository.
                      Be strict.
                      """
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ]
          )

          print_section(
              "QA",
              qa_raw
          )

          qa_match = re.match(
              r"^\s*(PASS|FAIL)\b",
              qa_raw,
              re.IGNORECASE
          )

          if not qa_match:
              raise RuntimeError(
                  "QA did not start with PASS or FAIL."
              )

          qa_status = qa_match.group(1).upper()

          # ------------------------------------------------------------
          # REVIEWER
          # ------------------------------------------------------------

          reviewer_prompt = f"""
          You are REVIEWER of the LORGUS project.

          Review the actual changes.

          USER TASK:
          {TASK}

          ARCHITECT PLAN:
          {architect}

          QA RESULT:
          {qa_raw}

          CURRENT REPOSITORY:
          {current_repository_text}

          GIT DIFF:
          {diff_after_coder}

          Check:

          - correctness;
          - security;
          - Supabase;
          - Cloudflare Worker;
          - JavaScript;
          - regressions;
          - unnecessary changes;
          - whether the task was actually completed.

          You must start your response with exactly:

          APPROVE

          or:

          REJECT

          If REJECT, list concrete problems.
          """

          reviewer_raw = call_ai(
              [
                  {
                      "role": "system",
                      "content": """
                      You are the Reviewer Agent of LORGUS.
                      Review real repository changes.
                      Do not rewrite code.
                      """
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ]
          )

          print_section(
              "REVIEWER",
              reviewer_raw
          )

          reviewer_match = re.match(
              r"^\s*(APPROVE|APPROVED|REJECT|REJECTED)\b",
              reviewer_raw,
              re.IGNORECASE
          )

          if not reviewer_match:
              raise RuntimeError(
                  "Reviewer did not start with APPROVE or REJECT."
              )

          reviewer_status = reviewer_match.group(1).upper()

          if reviewer_status.startswith("APPROVE"):
              reviewer_status = "APPROVE"
          else:
              reviewer_status = "REJECT"

          # ------------------------------------------------------------
          # FIXER
          # ------------------------------------------------------------

          needs_fixer = (
              qa_status == "FAIL"
              or reviewer_status == "REJECT"
          )

          if needs_fixer:
              print("\nFIXER REQUIRED")

              fixer_prompt = f"""
              You are FIXER of the LORGUS project.

              The current implementation failed QA or Review.

              USER TASK:
              {TASK}

              ARCHITECT PLAN:
              {architect}

              QA:
              {qa_raw}

              REVIEWER:
              {reviewer_raw}

              CURRENT REPOSITORY:
              {current_repository_text}

              GIT DIFF:
              {diff_after_coder}

              Fix ONLY the problems identified by QA or Reviewer.

              Rules:

              1. Preserve existing functionality.
              2. Do not rewrite unrelated code.
              3. Do not create new files.
              4. Only modify allowed files.
              5. Return ONLY valid JSON.
              6. Do not use Markdown code fences.
              7. Do not return a diff.
              8. Every changed file must contain complete final content.

              JSON format:

              {{
                "changes": [
                  {{
                    "path": "README.md",
                    "content_lines": [
                      "line 1",
                      "line 2"
                    ]
                  }}
                ]
              }}

              If no fix is necessary:

              {{
                "changes": []
              }}
              """

              fixer_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": """
                          You are the Fixer Agent of LORGUS.
                          Return strict JSON only.
                          Fix only verified problems.
                          """
                      },
                      {
                          "role": "user",
                          "content": fixer_prompt
                      }
                  ]
              )

              print_section(
                  "FIXER RAW RESPONSE",
                  fixer_raw
              )

              fixer_data = extract_json(fixer_raw)
              fixer_changes = validate_changes(fixer_data)

              if fixer_changes:
                  apply_changes(fixer_changes)
              else:
                  print("\nFIXER: NO CHANGES")

              # --------------------------------------------------------
              # QA AFTER FIX
              # --------------------------------------------------------

              current_repository = scan_repository()
              current_repository_text = format_repository(
                  current_repository
              )

              diff_after_fixer = run_cmd(
                  "git diff -- README.md index.html app.js style.css "
                  "worker.js wrangler.toml docs/PROJECT.md"
              )

              qa_fix_prompt = f"""
              Re-check the repository after the Fixer.

              USER TASK:
              {TASK}

              ORIGINAL QA:
              {qa_raw}

              ORIGINAL REVIEW:
              {reviewer_raw}

              CURRENT REPOSITORY:
              {current_repository_text}

              CURRENT DIFF:
              {diff_after_fixer}

              Start exactly with:

              PASS

              or:

              FAIL
              """

              qa_fix_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": """
                          You are QA Agent.
                          Perform a final verification after a fix.
                          """
                      },
                      {
                          "role": "user",
                          "content": qa_fix_prompt
                      }
                  ]
              )

              print_section(
                  "QA AFTER FIX",
                  qa_fix_raw
              )

              qa_fix_match = re.match(
                  r"^\s*(PASS|FAIL)\b",
                  qa_fix_raw,
                  re.IGNORECASE
              )

              if not qa_fix_match:
                  raise RuntimeError(
                      "Final QA did not start with PASS or FAIL."
                  )

              qa_fix_status = qa_fix_match.group(1).upper()

              if qa_fix_status == "FAIL":
                  raise RuntimeError(
                      "Final QA failed after Fixer."
                  )

              # --------------------------------------------------------
              # FINAL REVIEW
              # --------------------------------------------------------

              final_review_prompt = f"""
              Perform the final review of the current repository.

              USER TASK:
              {TASK}

              FINAL QA:
              {qa_fix_raw}

              CURRENT REPOSITORY:
              {current_repository_text}

              CURRENT DIFF:
              {diff_after_fixer}

              Start exactly with:

              APPROVE

              or:

              REJECT
              """

              final_review_raw = call_ai(
                  [
                      {
                          "role": "system",
                          "content": """
                          You are the final Reviewer Agent of LORGUS.
                          Review the actual final repository.
                          """
                      },
                      {
                          "role": "user",
                          "content": final_review_prompt
                      }
                  ]
              )

              print_section(
                  "FINAL REVIEW",
                  final_review_raw
              )

              final_review_match = re.match(
                  r"^\s*(APPROVE|APPROVED|REJECT|REJECTED)\b",
                  final_review_raw,
                  re.IGNORECASE
              )

              if not final_review_match:
                  raise RuntimeError(
                      "Final Reviewer did not start with APPROVE or REJECT."
                  )

              final_review_status = (
                  final_review_match.group(1).upper()
              )

              if final_review_status.startswith("REJECT"):
                  raise RuntimeError(
                      "Final Reviewer rejected the changes."
                  )

          else:
              print("\nQA + REVIEW PASSED")
              print("FIXER NOT REQUIRED")

          # ------------------------------------------------------------
          # FINAL VALIDATION
          # ------------------------------------------------------------

          print("\nRunning git diff --check...")

          run_cmd("git diff --check")

          final_diff = run_cmd(
              "git diff -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          print_section(
              "FINAL DIFF",
              final_diff or "NO CHANGES"
          )

          if not final_diff.strip():
              print("\nNothing to commit.")
              sys.exit(0)

          # ------------------------------------------------------------
          # COMMIT
          # ------------------------------------------------------------

          run_cmd(
              'git config user.name "LORGUS AI"'
          )

          run_cmd(
              'git config user.email "lorgus-ai@users.noreply.github.com"'
          )

          run_cmd(
              "git add -- README.md index.html app.js style.css "
              "worker.js wrangler.toml docs/PROJECT.md"
          )

          status = run_cmd(
              "git status --short"
          )

          print_section(
              "FILES TO COMMIT",
              status
          )

          run_cmd(
              'git commit -m "AI: update LORGUS project"'
          )

          run_cmd(
              "git push origin HEAD"
          )

          print("\n========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
