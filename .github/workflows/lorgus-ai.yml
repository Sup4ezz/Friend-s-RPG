name: LORGUS AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.API }}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODELS_URL: https://api.groq.com/openai/v1/models

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Groq preflight
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          key = os.environ["GROQ_API_KEY"]
          model = os.environ["GROQ_MODEL"]

          request = urllib.request.Request(
              os.environ["GROQ_MODELS_URL"],
              headers={
                  "Authorization": f"Bearer {key}",
                  "User-Agent": "LORGUS-GitHub-Actions"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(
                      response.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              models = {
                  item.get("id")
                  for item in data.get("data", [])
              }

              if model not in models:
                  raise SystemExit(
                      f"Model {model} is unavailable."
                  )

              print("Groq: OK")
              print(f"Model: {model}")

          except urllib.error.HTTPError as error:
              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(body)

              raise SystemExit(
                  f"Groq preflight failed: HTTP {error.code}"
              )
          PY

      - name: Run LORGUS AI pipeline
        env:
          USER_TASK: ${{ inputs.task }}
        run: |
          python3 <<'PY'
          import os
          import json
          import re
          import time
          import subprocess
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GROQ_API_KEY"]
          GROQ_URL = os.environ["GROQ_URL"]
          MODEL = os.environ["GROQ_MODEL"]
          USER_TASK = os.environ["USER_TASK"]

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          print("========================================")
          print("LORGUS AI WORKSPACE")
          print("========================================")
          print()
          print("USER TASK:")
          print(USER_TASK)
          print()

          # ------------------------------------------------------------
          # SHELL
          # ------------------------------------------------------------

          def run(command):
              result = subprocess.run(
                  command,
                  shell=True,
                  text=True,
                  capture_output=True
              )

              if result.stdout:
                  print(result.stdout)

              if result.stderr:
                  print(result.stderr)

              if result.returncode != 0:
                  raise RuntimeError(
                      f"Command failed: {command}"
                  )

              return result.stdout

          # ------------------------------------------------------------
          # GROQ
          # ------------------------------------------------------------

          def groq(messages, max_tokens, json_mode=False):
              payload = {
                  "model": MODEL,
                  "messages": messages,
                  "temperature": 0.1,
                  "max_tokens": max_tokens
              }

              if json_mode:
                  payload["response_format"] = {
                      "type": "json_object"
                  }

              body = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              for attempt in range(1, 4):

                  request = urllib.request.Request(
                      GROQ_URL,
                      data=body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "User-Agent": "LORGUS-GitHub-Actions"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=180
                      ) as response:

                          data = json.loads(
                              response.read().decode(
                                  "utf-8",
                                  errors="replace"
                              )
                          )

                          return data[
                              "choices"
                          ][0][
                              "message"
                          ][
                              "content"
                          ]

                  except urllib.error.HTTPError as error:

                      raw = error.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"Groq HTTP {error.code} "
                          f"(attempt {attempt}/3)"
                      )

                      print(raw)

                      if error.code == 429:

                          wait = 15

                          match = re.search(
                              r"try again in ([0-9.]+)s",
                              raw
                          )

                          if match:
                              wait = max(
                                  15,
                                  int(
                                      float(
                                          match.group(1)
                                      )
                                  ) + 2
                              )

                          print(
                              f"Waiting {wait}s..."
                          )

                          time.sleep(wait)
                          continue

                      if error.code == 413:
                          raise RuntimeError(
                              "Groq request is too large."
                          )

                      raise RuntimeError(
                          f"Groq HTTP {error.code}: {raw}"
                      )

              raise RuntimeError(
                  "Groq rate limit retry exhausted."
              )

          # ------------------------------------------------------------
          # JSON
          # ------------------------------------------------------------

          def parse_json(raw):

              raw = raw.strip()

              if raw.startswith("```"):
                  raw = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      raw,
                      flags=re.IGNORECASE
                  )

                  raw = re.sub(
                      r"\s*```$",
                      "",
                      raw
                  )

              try:
                  return json.loads(raw)

              except json.JSONDecodeError as error:

                  print("MODEL RETURNED INVALID JSON:")
                  print(raw)

                  raise RuntimeError(
                      f"Invalid JSON: {error}"
                  )

          # ------------------------------------------------------------
          # FILES
          # ------------------------------------------------------------

          def read_file(path):

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as file:
                  return file.read()

          def get_files():

              result = {}

              for path in sorted(ALLOWED_FILES):

                  if os.path.isfile(path):
                      result[path] = read_file(path)

              return result

          def detect_files(task):

              task_lower = task.lower()

              selected = set()

              mapping = {
                  "readme": ["README.md"],
                  "index.html": ["index.html"],
                  "html": ["index.html"],
                  "style.css": ["style.css"],
                  "css": ["style.css"],
                  "app.js": ["app.js"],
                  "javascript": ["app.js"],
                  "worker.js": ["worker.js"],
                  "cloudflare": [
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "wrangler": ["wrangler.toml"],
                  "supabase": [
                      "app.js",
                      "worker.js",
                      "wrangler.toml"
                  ],
                  "project.md": [
                      "docs/PROJECT.md"
                  ],
                  "docs": [
                      "docs/PROJECT.md"
                  ]
              }

              for keyword, paths in mapping.items():

                  if keyword in task_lower:
                      selected.update(paths)

              if not selected:
                  selected = set(ALLOWED_FILES)

              return sorted(selected)

          def build_context(paths, limit=16000):

              files = get_files()

              blocks = []
              total = 0

              for path in paths:

                  if path not in files:
                      continue

                  content = files[path]

                  remaining = limit - total

                  if remaining <= 0:
                      break

                  if len(content) > remaining:

                      content = (
                          content[:remaining]
                          + "\n[TRUNCATED]\n"
                      )

                  block = (
                      f"\n===== FILE: {path} =====\n"
                      f"{content}\n"
                      f"===== END FILE: {path} =====\n"
                  )

                  blocks.append(block)

                  total += len(block)

              return "\n".join(blocks)

          # ------------------------------------------------------------
          # APPLY PATCHES
          # ------------------------------------------------------------

          def apply_changes(changes):

              if not isinstance(changes, list):
                  raise RuntimeError(
                      "Changes must be a list."
                  )

              changed_paths = []

              for change in changes:

                  path = change.get("path")
                  operation = change.get("operation")

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"Forbidden file: {path}"
                      )

                  if operation != "replace":
                      raise RuntimeError(
                          f"Unsupported operation: "
                          f"{operation}"
                      )

                  old = change.get("old")
                  new = change.get("new")

                  if not isinstance(old, str):
                      raise RuntimeError(
                          f"Invalid old content for {path}"
                      )

                  if not isinstance(new, str):
                      raise RuntimeError(
                          f"Invalid new content for {path}"
                      )

                  content = read_file(path)

                  count = content.count(old)

                  if count == 0:
                      raise RuntimeError(
                          f"Anchor not found in {path}."
                      )

                  if count > 1:
                      raise RuntimeError(
                          f"Anchor occurs {count} times "
                          f"in {path}. Refusing to guess."
                      )

                  updated = content.replace(
                      old,
                      new,
                      1
                  )

                  with open(
                      path,
                      "w",
                      encoding="utf-8"
                  ) as file:
                      file.write(updated)

                  changed_paths.append(path)

                  print(
                      f"Applied precise change: {path}"
                  )

              return sorted(
                  set(changed_paths)
              )

          # ------------------------------------------------------------
          # FILE DISCOVERY
          # ------------------------------------------------------------

          selected = detect_files(USER_TASK)

          print("Relevant files:")

          for path in selected:
              print(f"  - {path}")

          print()

          # ------------------------------------------------------------
          # ARCHITECT
          # ------------------------------------------------------------

          print("========================================")
          print("ARCHITECT")
          print("========================================")

          architect_prompt = f"""
          Проанализируй ИСХОДНУЮ задачу пользователя.

          ЗАДАЧА:
          {USER_TASK}

          ТЕКУЩИЙ ПРОЕКТ:
          {build_context(selected, 12000)}

          Исходная задача пользователя имеет абсолютный приоритет.

          Не придумывай другую задачу.

          Не исправляй код.

          Верни JSON:

          {{
            "problem": "...",
            "files": ["..."],
            "plan": ["..."],
            "checks": ["..."]
          }}
          """

          architect = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/ARCHITECT.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": architect_prompt
                      }
                  ],
                  1000,
                  True
              )
          )

          print(
              json.dumps(
                  architect,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ------------------------------------------------------------
          # CODER
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("CODER")
          print("========================================")

          coder_prompt = f"""
          Ты Coding Agent LORGUS.

          ИСХОДНАЯ ЗАДАЧА ПОЛЬЗОВАТЕЛЯ:
          {USER_TASK}

          ПЛАН ARCHITECT:
          {json.dumps(
              architect,
              ensure_ascii=False
          )}

          ТЕКУЩИЙ КОД:
          {build_context(selected, 15000)}

          КРИТИЧЕСКИЕ ПРАВИЛА:

          1. Выполни именно исходную задачу.
          2. Никогда не переписывай файл целиком.
          3. Никогда не возвращай полный content файла.
          4. Используй только точечные изменения.
          5. Для изменения существующего кода используй
             operation = "replace".
          6. Поле old должно содержать существующий фрагмент
             файла БЕЗ изменений.
          7. Поле new должно содержать только замену этого фрагмента.
          8. old должен встречаться в файле ровно один раз.
          9. Не меняй несвязанный код.
          10. Не изменяй README.md, если это запрещено задачей.

          Верни ТОЛЬКО JSON:

          {{
            "changes": [
              {{
                "path": "app.js",
                "operation": "replace",
                "old": "точный существующий фрагмент",
                "new": "новый фрагмент"
              }}
            ]
          }}

          Если изменений не требуется:

          {{
            "changes": []
          }}
          """

          coder = parse_json(
              groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/CODER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": coder_prompt
                      }
                  ],
                  2200,
                  True
              )
          )

          changed_paths = apply_changes(
              coder.get("changes", [])
          )

          # ------------------------------------------------------------
          # DIFF
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("CURRENT DIFF")
          print("========================================")

          diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run("git diff --check")

          # ------------------------------------------------------------
          # QA
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("QA")
          print("========================================")

          qa_prompt = f"""
          Проведи независимую проверку.

          ИСХОДНАЯ ЗАДАЧА:
          {USER_TASK}

          DIFF:
          {diff[:8000]}

          Проверяй именно исходную задачу.

          Особое внимание:

          - не удалён ли существующий код;
          - не переписан ли файл целиком;
          - выполнена ли задача;
          - нет ли синтаксических ошибок;
          - нет ли несвязанных изменений;
          - не нарушена ли существующая функциональность.

          Если задача выполнена и код сохранён:

          PASS

          Иначе:

          FAIL
          """

          qa_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/QA.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": qa_prompt
                  }
              ],
              700,
              False
          )

          print(qa_raw)

          qa_pass = bool(
              re.match(
                  r"^\s*PASS\b",
                  qa_raw,
                  re.IGNORECASE
              )
          )

          # ------------------------------------------------------------
          # REVIEWER
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("REVIEWER")
          print("========================================")

          reviewer_prompt = f"""
          Проведи независимый review.

          ИСХОДНАЯ ЗАДАЧА:
          {USER_TASK}

          DIFF:
          {diff[:8000]}

          QA:
          {qa_raw[:2500]}

          Проверь:

          - соответствие задаче;
          - регрессии;
          - безопасность;
          - секреты;
          - лишние изменения;
          - сохранность существующего кода.

          Первая строка:

          APPROVE

          или:

          REJECT
          """

          reviewer_raw = groq(
              [
                  {
                      "role": "system",
                      "content": read_file(
                          ".ai/REVIEWER.md"
                      )
                  },
                  {
                      "role": "user",
                      "content": reviewer_prompt
                  }
              ],
              700,
              False
          )

          print(reviewer_raw)

          reviewer_reject = bool(
              re.match(
                  r"^\s*REJECT\b",
                  reviewer_raw,
                  re.IGNORECASE
              )
          )

          # ------------------------------------------------------------
          # FIXER
          # ------------------------------------------------------------

          if not qa_pass or reviewer_reject:

              print()
              print("========================================")
              print("FIXER")
              print("========================================")

              fixer_prompt = f"""
              Исправь только реальные проблемы.

              ИСХОДНАЯ ЗАДАЧА:
              {USER_TASK}

              DIFF:
              {diff[:8000]}

              QA:
              {qa_raw[:2500]}

              REVIEWER:
              {reviewer_raw[:2500]}

              Никогда не переписывай файл целиком.

              Используй только:

              {{
                "changes": [
                  {{
                    "path": "app.js",
                    "operation": "replace",
                    "old": "точный существующий фрагмент",
                    "new": "исправленный фрагмент"
                  }}
                ]
              }}

              old должен встречаться ровно один раз.

              Не меняй несвязанный код.
              """

              fixer = parse_json(
                  groq(
                      [
                          {
                              "role": "system",
                              "content": read_file(
                                  ".ai/CODER.md"
                              )
                          },
                          {
                              "role": "user",
                              "content": fixer_prompt
                          }
                      ],
                      2200,
                      True
                  )
              )

              fixer_paths = apply_changes(
                  fixer.get("changes", [])
              )

              changed_paths = sorted(
                  set(
                      changed_paths
                      + fixer_paths
                  )
              )

              run("git diff --check")

              # --------------------------------------------------------
              # FINAL QA
              # --------------------------------------------------------

              print()
              print("========================================")
              print("FINAL QA")
              print("========================================")

              final_diff = run(
                  "git diff -- "
                  "README.md "
                  "index.html "
                  "app.js "
                  "style.css "
                  "worker.js "
                  "wrangler.toml "
                  "docs/PROJECT.md"
              )

              final_qa_prompt = f"""
              Финальная независимая проверка.

              ИСХОДНАЯ ЗАДАЧА:
              {USER_TASK}

              ФИНАЛЬНЫЙ DIFF:
              {final_diff[:9000]}

              Проверь:

              1. Задача выполнена.
              2. Старый функционал сохранён.
              3. Нет лишних изменений.
              4. Нет очевидных ошибок.

              Ответ должен начинаться:

              PASS

              или:

              FAIL
              """

              final_qa = groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/QA.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": final_qa_prompt
                      }
                  ],
                  700,
                  False
              )

              print(final_qa)

              if not re.match(
                  r"^\s*PASS\b",
                  final_qa,
                  re.IGNORECASE
              ):
                  raise RuntimeError(
                      "Final QA returned FAIL."
                  )

              # --------------------------------------------------------
              # FINAL REVIEW
              # --------------------------------------------------------

              print()
              print("========================================")
              print("FINAL REVIEW")
              print("========================================")

              final_review = groq(
                  [
                      {
                          "role": "system",
                          "content": read_file(
                              ".ai/REVIEWER.md"
                          )
                      },
                      {
                          "role": "user",
                          "content": f"""
                          Финальный review.

                          ИСХОДНАЯ ЗАДАЧА:
                          {USER_TASK}

                          FINAL QA:
                          {final_qa[:2500]}

                          FINAL DIFF:
                          {final_diff[:9000]}

                          Первая строка:

                          APPROVE

                          или:

                          REJECT
                          """
                      }
                  ],
                  700,
                  False
              )

              print(final_review)

              if re.match(
                  r"^\s*REJECT\b",
                  final_review,
                  re.IGNORECASE
              ):
                  raise RuntimeError(
                      "Final Reviewer returned REJECT."
                  )

          # ------------------------------------------------------------
          # FINAL CHECK
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("FINAL CHECK")
          print("========================================")

          run("git diff --check")

          final_diff = run(
              "git diff -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          if not final_diff.strip():
              print("No changes.")
              raise SystemExit(0)

          # ------------------------------------------------------------
          # COMMIT
          # ------------------------------------------------------------

          print()
          print("========================================")
          print("COMMIT")
          print("========================================")

          run(
              'git config user.name "LORGUS AI"'
          )

          run(
              'git config user.email '
              '"lorgus-ai@users.noreply.github.com"'
          )

          run(
              "git add -- "
              "README.md "
              "index.html "
              "app.js "
              "style.css "
              "worker.js "
              "wrangler.toml "
              "docs/PROJECT.md"
          )

          run(
              'git commit -m "AI: update LORGUS project"'
          )

          run("git push origin HEAD")

          print()
          print("========================================")
          print("LORGUS AI WORKSPACE: SUCCESS")
          print("========================================")
          PY
