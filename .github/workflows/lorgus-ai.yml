name: LORGUS AI Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Задача для AI"
        required: true
        type: string

permissions:
  contents: write

jobs:
  ai:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.API }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI pipeline
        env:
          TASK: ${{ inputs.task }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import subprocess
          import re
          import time

          TASK = os.environ["TASK"]
          API_KEY = os.environ["OPENROUTER_API_KEY"]

          MODEL = "openrouter/free"

          ALLOWED_FILES = {
              "README.md",
              "index.html",
              "app.js",
              "style.css",
              "worker.js",
              "wrangler.toml",
              "docs/PROJECT.md"
          }

          MAX_FIX_ATTEMPTS = 2
          MAX_API_RETRIES = 5

          def ask(system, user):
              data = json.dumps({
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "system",
                          "content": system
                      },
                      {
                          "role": "user",
                          "content": user
                      }
                  ]
              }).encode("utf-8")

              for attempt in range(1, MAX_API_RETRIES + 1):
                  request = urllib.request.Request(
                      "https://openrouter.ai/api/v1/chat/completions",
                      data=data,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "HTTP-Referer": "https://github.com/Sup4ezz/Friend-s-RPG",
                          "X-Title": "LORGUS AI"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:
                          result = json.loads(response.read())

                      if "choices" not in result:
                          raise RuntimeError(
                              f"OpenRouter returned unexpected response: {result}"
                          )

                      return result["choices"][0]["message"]["content"]

                  except urllib.error.HTTPError as e:
                      body = e.read().decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(
                          f"\nOPENROUTER HTTP ERROR {e.code} "
                          f"(attempt {attempt}/{MAX_API_RETRIES})"
                      )
                      print(body)

                      if e.code != 429:
                          raise

                      if attempt == MAX_API_RETRIES:
                          raise RuntimeError(
                              "OpenRouter returned HTTP 429 after "
                              f"{MAX_API_RETRIES} attempts."
                          )

                      delay = 10 * (2 ** (attempt - 1))

                      print(
                          f"Rate limit detected. "
                          f"Waiting {delay} seconds before retry..."
                      )

                      time.sleep(delay)

                  except urllib.error.URLError as e:
                      print(
                          f"\nOPENROUTER NETWORK ERROR "
                          f"(attempt {attempt}/{MAX_API_RETRIES})"
                      )
                      print(e)

                      if attempt == MAX_API_RETRIES:
                          raise

                      delay = 10 * (2 ** (attempt - 1))

                      print(
                          f"Waiting {delay} seconds before retry..."
                      )

                      time.sleep(delay)

          def repository_text():
              result = []

              for root, dirs, files in os.walk("."):
                  if ".git" in root.split(os.sep):
                      continue

                  for filename in files:
                      path = os.path.join(root, filename)

                      if path.startswith("./"):
                          path = path[2:]

                      try:
                          with open(
                              path,
                              "r",
                              encoding="utf-8"
                          ) as f:
                              content = f.read()

                          result.append(
                              f"\n===== {path} =====\n{content}"
                          )

                      except UnicodeDecodeError:
                          pass

              return "\n".join(result)

          def git_diff():
              return subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--no-ext-diff"
                  ],
                  text=True
              )

          def extract_json(text):
              text = text.strip()

              if text.startswith("```"):
                  text = re.sub(
                      r"^```(?:json)?\s*",
                      "",
                      text,
                      flags=re.IGNORECASE
                  )

                  text = re.sub(
                      r"\s*```$",
                      "",
                      text
                  )

              return json.loads(text)

          def apply_changes(raw, agent_name):
              try:
                  data = extract_json(raw)

              except Exception as e:
                  raise RuntimeError(
                      f"{agent_name} returned invalid JSON: {e}"
                  )

              changes = data.get("changes", [])

              if not isinstance(changes, list):
                  raise RuntimeError(
                      f"{agent_name}: changes must be a list."
                  )

              for change in changes:
                  path = change["path"]

                  if path not in ALLOWED_FILES:
                      raise RuntimeError(
                          f"{agent_name} attempted to modify "
                          f"forbidden file: {path}"
                      )

                  lines = change.get("content_lines")

                  if not isinstance(lines, list):
                      raise RuntimeError(
                          f"{agent_name}: content_lines must be "
                          f"a list for {path}."
                      )

                  content = "\n".join(
                      str(line)
                      for line in lines
                  )

                  with open(
                      path,
                      "w",
                      encoding="utf-8",
                      newline="\n"
                  ) as f:
                      f.write(
                          content.rstrip("\n") + "\n"
                      )

                  print(
                      f"{agent_name}: updated {path}"
                  )

              return data

          def run_qa(task, repo, diff):
              print("\n===== QA =====\n")

              qa_raw = ask(
                  """Ты QA Agent проекта LORGUS.

                  Проверь РЕАЛЬНОЕ текущее состояние репозитория.

                  Ответ ОБЯЗАН начинаться ровно с:

                  PASS

                  или:

                  FAIL

                  Не используй "User Safety", "safe"
                  или другие статусы.

                  PASS означает, что задача выполнена
                  и состояние репозитория соответствует задаче.

                  FAIL означает, что существует реальная проблема.

                  При FAIL обязательно укажи:
                  - файл;
                  - проблему;
                  - ожидаемый результат;
                  - фактический результат.

                  Проверяй:
                  - соответствие задаче;
                  - синтаксис;
                  - JavaScript;
                  - HTML;
                  - CSS;
                  - API;
                  - Supabase;
                  - Cloudflare Worker;
                  - регрессии;
                  - лишние изменения;
                  - сохранение существующей функциональности.

                  Не требуй изменений, которые не относятся к задаче.""",
                  f"""ЗАДАЧА:
          {task}

          CURRENT REPOSITORY:
          {repo}

          ACTUAL GIT DIFF:
          {diff}"""
              )

              print(qa_raw)

              match = re.match(
                  r"^\s*(PASS|FAIL)\b",
                  qa_raw,
                  re.IGNORECASE
              )

              if not match:
                  raise RuntimeError(
                      "QA returned neither PASS nor FAIL."
                  )

              return (
                  match.group(1).upper(),
                  qa_raw
              )

          def run_reviewer(
              task,
              repo,
              diff,
              qa
          ):
              print("\n===== REVIEWER =====\n")

              reviewer_raw = ask(
                  """Ты REVIEWER проекта LORGUS.

                  Проведи независимое ревью.

                  Ответ ОБЯЗАН начинаться ровно с:

                  APPROVE

                  или:

                  REJECT

                  Допускаются также:

                  APPROVED
                  REJECTED

                  Не используй "User Safety", "safe"
                  или другие статусы.

                  APPROVE означает, что изменение можно принять.

                  REJECT означает, что существует реальная проблема.

                  При REJECT обязательно укажи:
                  - файл;
                  - проблему;
                  - почему это проблема;
                  - что необходимо изменить.

                  ACTUAL GIT DIFF показывает только изменения.

                  CURRENT REPOSITORY показывает полное
                  текущее состояние файлов.

                  Не отклоняй изменение только потому,
                  что требуемый элемент отсутствует в diff:
                  он мог существовать до изменения.

                  Проверяй:
                  - соответствие задаче;
                  - логику;
                  - безопасность;
                  - Supabase;
                  - Cloudflare Worker;
                  - регрессии;
                  - лишние изменения;
                  - сохранение существующего содержимого;
                  - сохранение языка существующих документов.

                  Не требуй рефакторинга без необходимости.""",
                  f"""ЗАДАЧА:
          {task}

          CURRENT REPOSITORY:
          {repo}

          ACTUAL GIT DIFF:
          {diff}

          QA RESULT:
          {qa}"""
              )

              print(reviewer_raw)

              match = re.match(
                  r"^\s*(APPROVED?|REJECT(?:ED)?)\b",
                  reviewer_raw,
                  re.IGNORECASE
              )

              if not match:
                  raise RuntimeError(
                      "Reviewer returned neither APPROVE nor REJECT."
                  )

              status = match.group(1).upper()

              if status.startswith("REJECT"):
                  return "REJECT", reviewer_raw

              return "APPROVE", reviewer_raw

          repo = repository_text()

          print("\n===== ARCHITECT =====\n")

          architect = ask(
              """Ты ARCHITECT проекта LORGUS.

              Изучи реальный репозиторий.

              Не изменяй файлы.

              Определи:
              - проблему;
              - затронутые файлы;
              - минимальный план изменений;
              - риски;
              - способ проверки.

              ВАЖНО:
              - не переписывай существующий код;
              - не меняй язык существующего текста;
              - не добавляй лишнюю функциональность;
              - учитывай существующую архитектуру проекта.

              Верни только JSON:

              {
                "changes": []
              }

              Architect не должен самостоятельно изменять файлы.""",
              f"""ЗАДАЧА:
          {TASK}

          ТЕКУЩИЙ РЕПОЗИТОРИЙ:
          {repo}"""
          )

          print(architect)

          print("\n===== CODER =====\n")

          coder_raw = ask(
              """Ты CODER проекта LORGUS.

              Изучи задачу, план Architect
              и полный текущий репозиторий.

              Верни ТОЛЬКО JSON:

              {
                "changes": [
                  {
                    "path": "README.md",
                    "content_lines": [
                      "полное новое содержимое файла"
                    ]
                  }
                ]
              }

              Правила:

              - content_lines содержит ПОЛНОЕ содержимое изменяемого файла;
              - изменяй только необходимые файлы;
              - сохраняй существующий язык;
              - сохраняй существующее содержимое;
              - не переписывай текст без необходимости;
              - не переводи документы;
              - не добавляй пояснения;
              - не меняй .ai;
              - не добавляй секреты;
              - не добавляй лишнюю функциональность;
              - если изменений не требуется:
                {"changes": []}.""",
              f"""ЗАДАЧА:
          {TASK}

          ПЛАН ARCHITECT:
          {architect}

          ПОЛНЫЙ РЕПОЗИТОРИЙ:
          {repo}"""
          )

          print(coder_raw)

          apply_changes(
              coder_raw,
              "CODER"
          )

          diff = git_diff()

          print(
              "\n===== ACTUAL GIT DIFF =====\n"
          )
          print(diff)

          qa_status, qa_raw = run_qa(
              TASK,
              repository_text(),
              diff
          )

          if qa_status == "FAIL":
              raise RuntimeError(
                  "QA reported FAIL."
              )

          print(
              "\nQA VALIDATION: PASS"
          )

          reviewer_status, reviewer_raw = run_reviewer(
              TASK,
              repository_text(),
              diff,
              qa_raw
          )

          print(
              f"\nREVIEW VALIDATION: "
              f"{reviewer_status}"
          )

          # -------------------------------------------------
          # DETERMINISTIC FIXER TEST
          # -------------------------------------------------

          if (
              "FIXER_TEST_MARKER" in TASK
              and reviewer_status == "APPROVE"
          ):
              print(
                  "\n===== FIXER TEST MODE ====="
              )
              print(
                  "Forcing REVIEWER REJECT "
                  "to verify Fixer."
              )

              reviewer_status = "REJECT"

              reviewer_raw = """
          REJECT

          FIXER TEST:
          README.md contains FIXER_TEST_MARKER: ORIGINAL.

          Required change:
          change only:

          FIXER_TEST_MARKER: ORIGINAL

          to:

          FIXER_TEST_MARKER: FIXED
          """

              print(reviewer_raw)

          fix_attempt = 0

          while (
              reviewer_status == "REJECT"
              and fix_attempt < MAX_FIX_ATTEMPTS
          ):
              fix_attempt += 1

              print(
                  f"\n===== FIXER ATTEMPT "
                  f"{fix_attempt}/{MAX_FIX_ATTEMPTS} =====\n"
              )

              repo_before_fix = repository_text()
              diff_before_fix = git_diff()

              fixer_raw = ask(
                  """Ты FIXER проекта LORGUS.

                  Ты исправляешь только реальные проблемы,
                  найденные QA или Reviewer.

                  Верни ТОЛЬКО JSON:

                  {
                    "changes": [
                      {
                        "path": "README.md",
                        "content_lines": [
                          "полное новое содержимое файла"
                        ]
                      }
                    ]
                  }

                  КРИТИЧЕСКИЕ ПРАВИЛА:

                  - content_lines содержит полное содержимое файла;
                  - исправляй только конкретные найденные проблемы;
                  - не переписывай проект;
                  - не рефактори без необходимости;
                  - не переводи существующий текст;
                  - сохраняй существующий язык;
                  - сохраняй всё содержимое, не относящееся к проблеме;
                  - не меняй другие файлы без необходимости;
                  - не меняй .ai;
                  - не добавляй секреты;
                  - не придумывай новые проблемы.

                  Для FIXER_TEST_MARKER:

                  Если Reviewer требует изменить:

                  FIXER_TEST_MARKER: ORIGINAL

                  замени только значение ORIGINAL
                  на FIXED.

                  Если проблема уже исправлена:
                  {"changes": []}.""",
                  f"""ИСХОДНАЯ ЗАДАЧА:
          {TASK}

          QA RESULT:
          {qa_raw}

          REVIEWER RESULT:
          {reviewer_raw}

          CURRENT REPOSITORY:
          {repo_before_fix}

          ACTUAL GIT DIFF:
          {diff_before_fix}"""
              )

              print(fixer_raw)

              apply_changes(
                  fixer_raw,
                  "FIXER"
              )

              diff = git_diff()

              print(
                  "\n===== DIFF AFTER FIXER =====\n"
              )
              print(diff)

              qa_status, qa_raw = run_qa(
                  TASK,
                  repository_text(),
                  diff
              )

              if qa_status == "FAIL":
                  print(
                      "\nQA VALIDATION: FAIL"
                  )

                  reviewer_status = "REJECT"

                  reviewer_raw = """
          REJECT

          QA failed after Fixer.
          """

                  continue

              print(
                  "\nQA VALIDATION: PASS"
              )

              reviewer_status, reviewer_raw = run_reviewer(
                  TASK,
                  repository_text(),
                  diff,
                  qa_raw
              )

              # The deterministic test ends after the
              # first successful Fixer pass.
              if (
                  "FIXER_TEST_MARKER" in TASK
                  and "FIXER_TEST_MARKER: FIXED"
                  in repository_text()
              ):
                  reviewer_status = "APPROVE"

                  reviewer_raw = """
          APPROVE

          FIXER TEST PASSED:
          FIXER_TEST_MARKER was changed
          from ORIGINAL to FIXED.
          """

                  print(
                      "\n===== FIXER TEST PASSED ====="
                  )
                  print(reviewer_raw)

                  break

              print(
                  f"\nREVIEW VALIDATION: "
                  f"{reviewer_status}"
              )

          if reviewer_status != "APPROVE":
              raise RuntimeError(
                  "Pipeline failed after "
                  f"{MAX_FIX_ATTEMPTS} Fixer attempts."
              )

          print(
              "\n===== FINAL CHECK =====\n"
          )

          final_diff = git_diff()

          print(final_diff)

          check = subprocess.run(
              [
                  "git",
                  "diff",
                  "--check"
              ],
              text=True,
              capture_output=True
          )

          if check.returncode != 0:
              print(check.stdout)
              print(check.stderr)

              raise RuntimeError(
                  "git diff --check failed."
              )

          print(
              "\nFINAL GIT CHECK: PASS"
          )

          print(
              "\nPIPELINE RESULT: APPROVED"
          )

          PY

      - name: Commit and push approved changes
        run: |
          if git diff --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi

          git config user.name "LORGUS AI"
          git config user.email "lorgus-ai@users.noreply.github.com"

          git add -- \
            README.md \
            index.html \
            app.js \
            style.css \
            worker.js \
            wrangler.toml \
            docs/PROJECT.md

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "NO STAGED CHANGES"
            exit 0
          fi

          git commit -m "AI: update LORGUS project"

          git push origin HEAD
