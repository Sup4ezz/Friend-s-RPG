name: Request Unity Personal license file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-license:
    name: Generate activation request for cloud build
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 3
